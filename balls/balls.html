<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyssal Balls</title>
    <style>
      :root {
        --bg: #000000;
        --ink: #00ffc8;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: monospace;
      }

      body {
        position: relative;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
        cursor: pointer;
      }

      .fallback {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: #000;
        color: var(--ink);
        text-align: center;
        padding: 24px;
      }

      .fallback.visible {
        display: grid;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="Animated metaballs"></canvas>
    <div id="fallback" class="fallback">Canvas is not available in this browser.</div>

    <script>
      const canvas = document.getElementById('scene');
      const fallback = document.getElementById('fallback');
      const ctx = canvas.getContext('2d');

      if (!ctx) {
        fallback.classList.add('visible');
        throw new Error('Canvas 2D context unavailable');
      }

      const MAX_BALLS = 60;
      const INITIAL_COLORS = [
        { r: 0, g: 255, b: 200 },
        { r: 255, g: 238, b: 0 },
        { r: 255, g: 0, b: 85 },
      ];

      function hsbToRgb(h, s, b) {
        const i = Math.floor(h * 6);
        const f = h * 6 - i;
        const p = b * (1 - s);
        const q = b * (1 - f * s);
        const t = b * (1 - (1 - f) * s);

        switch (i % 6) {
          case 0: return { r: b, g: t, b: p };
          case 1: return { r: q, g: b, b: p };
          case 2: return { r: p, g: b, b: t };
          case 3: return { r: p, g: q, b: b };
          case 4: return { r: t, g: p, b: b };
          default: return { r: b, g: p, b: q };
        }
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function getBaseRadius(width, height) {
        return Math.max(Math.min(width, height) * 0.12, 60);
      }

      function createBall(color, width, height) {
        const baseRadius = getBaseRadius(width, height);
        const angle = Math.random() * Math.PI * 2;
        const speed = 4;

        return {
          baseRadius,
          currentRadius: baseRadius,
          targetRadius: baseRadius,
          radiusVelocity: 0,
          x: Math.random() * Math.max(width - baseRadius * 2, 1) + baseRadius,
          y: Math.random() * Math.max(height - baseRadius * 2, 1) + baseRadius,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: { r: color.r / 255, g: color.g / 255, b: color.b / 255 },
        };
      }

      const balls = INITIAL_COLORS.map((color) => createBall(color, window.innerWidth, window.innerHeight));

      function resizeCanvas() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.max(1, Math.floor(width * pixelRatio));
        canvas.height = Math.max(1, Math.floor(height * pixelRatio));
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(pixelRatio, pixelRatio);

        for (const ball of balls) {
          const scale = getBaseRadius(canvas.width, canvas.height) / ball.baseRadius;
          ball.baseRadius = getBaseRadius(canvas.width, canvas.height);
          ball.currentRadius *= scale;
          ball.targetRadius = ball.baseRadius;
          ball.x = clamp(ball.x * (canvas.width / Math.max(canvas.width, 1)), ball.baseRadius, canvas.width - ball.baseRadius);
          ball.y = clamp(ball.y * (canvas.height / Math.max(canvas.height, 1)), ball.baseRadius, canvas.height - ball.baseRadius);
        }
      }

      function drawBall(ball) {
        const radius = ball.currentRadius;
        const gradient = ctx.createRadialGradient(
          ball.x,
          ball.y,
          radius * 0.12,
          ball.x,
          ball.y,
          radius,
        );

        gradient.addColorStop(0, `rgba(${Math.round(ball.color.r * 255)}, ${Math.round(ball.color.g * 255)}, ${Math.round(ball.color.b * 255)}, 1)`);
        gradient.addColorStop(0.25, `rgba(${Math.round(ball.color.r * 255)}, ${Math.round(ball.color.g * 255)}, ${Math.round(ball.color.b * 255)}, 0.85)`);
        gradient.addColorStop(0.6, `rgba(${Math.round(ball.color.r * 255)}, ${Math.round(ball.color.g * 255)}, ${Math.round(ball.color.b * 255)}, 0.45)`);
        gradient.addColorStop(1, `rgba(${Math.round(ball.color.r * 255)}, ${Math.round(ball.color.g * 255)}, ${Math.round(ball.color.b * 255)}, 0)`);

        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(ball.x, ball.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.globalCompositeOperation = 'screen';

        for (const ball of balls) {
          const force = (ball.targetRadius - ball.currentRadius) * 0.1;
          ball.radiusVelocity = (ball.radiusVelocity + force) * 0.85;
          ball.currentRadius += ball.radiusVelocity;

          ball.x += ball.vx;
          ball.y += ball.vy;

          if (ball.x - ball.currentRadius <= 0) {
            ball.x = ball.currentRadius;
            ball.vx *= -1;
          } else if (ball.x + ball.currentRadius >= canvas.width) {
            ball.x = canvas.width - ball.currentRadius;
            ball.vx *= -1;
          }

          if (ball.y - ball.currentRadius <= 0) {
            ball.y = ball.currentRadius;
            ball.vy *= -1;
          } else if (ball.y + ball.currentRadius >= canvas.height) {
            ball.y = canvas.height - ball.currentRadius;
            ball.vy *= -1;
          }

          drawBall(ball);
        }

        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
      }

      function handleClick(event) {
        if (balls.length >= MAX_BALLS) return;

        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * (canvas.width / rect.width);
        const y = (rect.height - (event.clientY - rect.top)) * (canvas.height / rect.height);
        const color = hsbToRgb(Math.random(), 0.75, 1);
        const ball = createBall(color, canvas.width, canvas.height);
        ball.x = x;
        ball.y = y;
        ball.currentRadius = ball.baseRadius * 1.8;
        ball.targetRadius = ball.baseRadius;
        balls.push(ball);
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      canvas.addEventListener('click', handleClick);
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
