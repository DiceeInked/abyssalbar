<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="description" content="A simple black-and-white Tic Tac Toe game."><title>Tic Tac Toe | Abyssal Bar</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(100%,440px);text-align:center}.home{position:fixed;top:20px;left:20px;color:#fff;text-decoration:none;border:1px solid #555;border-radius:999px;padding:9px 14px}.home:hover,.home:focus-visible{background:#fff;color:#000}.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:#aaa;margin:0 0 12px}h1{font-size:clamp(2.4rem,9vw,4rem);letter-spacing:-.065em;line-height:1;margin:0}.subtitle{color:#aaa;margin:14px 0 28px}.status{min-height:32px;font-weight:650;margin:0 0 18px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(82vw,340px);margin:auto}.cell{aspect-ratio:1;border:1px solid #555;background:#0b0b0b;color:#fff;border-radius:8px;font-size:clamp(2.8rem,14vw,5rem);font-weight:500;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.cell:hover:enabled{background:#1b1b1b;border-color:#fff}.cell:focus-visible,button.action:focus-visible{outline:2px solid #fff;outline-offset:3px}.cell:disabled{cursor:default}.cell.o{color:#aaa}.controls{margin-top:24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button.action{border:1px solid #fff;border-radius:999px;padding:11px 20px;background:#fff;color:#000;font:inherit;font-weight:650;cursor:pointer}button.action.secondary{background:transparent;color:#fff}button.action:hover{background:#ccc;color:#000}.note{color:#777;font-size:.8rem;margin-top:22px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><a class="home" href="./">← Home</a><main><p class="eyebrow">Abyssal Bar · Mini game</p><h1>Tic Tac Toe</h1><p class="subtitle">Three in a row. Simple as that.</p><p class="status" id="status" role="status" aria-live="polite">X goes first.</p>
<div class="board" role="group" aria-label="Tic Tac Toe board">
<button class="cell" type="button" data-cell="0" aria-label="Row 1, column 1"></button>
<button class="cell" type="button" data-cell="1" aria-label="Row 1, column 2"></button>
<button class="cell" type="button" data-cell="2" aria-label="Row 1, column 3"></button>
<button class="cell" type="button" data-cell="3" aria-label="Row 2, column 1"></button>
<button class="cell" type="button" data-cell="4" aria-label="Row 2, column 2"></button>
<button class="cell" type="button" data-cell="5" aria-label="Row 2, column 3"></button>
<button class="cell" type="button" data-cell="6" aria-label="Row 3, column 1"></button>
<button class="cell" type="button" data-cell="7" aria-label="Row 3, column 2"></button>
<button class="cell" type="button" data-cell="8" aria-label="Row 3, column 3"></button>
</div><div class="controls"><button class="action" id="again" type="button">Play again</button><button class="action secondary" id="reset" type="button">Reset board</button></div><p class="note">Two players · X always starts · Wins and draws are announced</p></main>
<script>
(()=>{const cells=[...document.querySelectorAll('[data-cell]')],status=document.getElementById('status'),wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(''),current='X',finished=false;
function winner(){for(const line of wins){const[a,b,c]=line;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return{player:board[a],line};}return null;}
function play(i){if(finished||board[i])return;board[i]=current;cells[i].textContent=current;cells[i].classList.add(current.toLowerCase());cells[i].setAttribute('aria-label',cells[i].getAttribute('aria-label')+', '+current);const result=winner();if(result){finished=true;status.textContent=result.player+' wins!';result.line.forEach(j=>{cells[j].style.background='#fff';cells[j].style.color='#000';});cells.forEach(c=>c.disabled=true);return;}if(board.every(Boolean)){finished=true;status.textContent="It's a draw!";cells.forEach(c=>c.disabled=true);return;}current=current==='X'?'O':'X';status.textContent=current+"'s turn";}
function reset(){board=Array(9).fill('');current='X';finished=false;status.textContent='X goes first.';cells.forEach((c,i)=>{c.textContent='';c.disabled=false;c.className='cell';c.style.background='';c.style.color='';c.setAttribute('aria-label','Row '+(Math.floor(i/3)+1)+', column '+(i%3+1));});}
cells.forEach((c,i)=>c.addEventListener('click',()=>play(i)));document.getElementById('again').addEventListener('click',reset);document.getElementById('reset').addEventListener('click',reset);})();
</script></body></html>
