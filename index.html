<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A minimalist field of dots hiding a tactile little world.">
<title>Still</title>
<style>
:root{color-scheme:dark;--paper:#000;--ink:#fff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:var(--paper)}
@supports(height:100dvh){html,body{height:100dvh;min-height:100dvh}}
body{overscroll-behavior:none;overscroll-behavior-y:none;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
button{font:inherit}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:#fff;opacity:1;transition:none;z-index:2}
.grid{display:grid;grid-template-columns:repeat(5,clamp(18px,5.2vw,36px));grid-template-rows:repeat(5,clamp(18px,5.2vw,36px));gap:clamp(16px,4.2vw,34px)}
.dot{width:100%;height:100%;padding:0;border:0;border-radius:50%;background:#000;cursor:pointer;transform:scale(1);transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s;touch-action:manipulation}
.dot:not(.active):hover{transform:scale(1.2)}
.dot:focus-visible{outline:2px solid #000;outline-offset:5px}
#zoom{position:fixed;z-index:3;left:0;top:0;width:0;height:0;border-radius:50%;background:#000;transform:translate(-50%,-50%) scale(0);pointer-events:none;will-change:transform}
#zoom.grow{animation:zoom-in .8s cubic-bezier(.65,0,.25,1) forwards}
@keyframes zoom-in{0%{transform:translate(-50%,-50%) scale(0);border-radius:50%}100%{transform:translate(-50%,-50%) scale(var(--zoom-scale,90));border-radius:50%}}
#experience{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:1;height:100vh;height:100dvh;overflow:hidden}
#experience.ready{opacity:1;pointer-events:auto}
#blob{display:block;width:100%;height:100%;height:100dvh;touch-action:none;overscroll-behavior:none;cursor:grab;outline:none;background:#000;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#blob:active{cursor:grabbing}
#blob:focus-visible{outline:2px solid #000;outline-offset:-7px}
#voiceFrame,#testFrame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:2}
#back{position:absolute;left:18px;top:18px;width:42px;height:42px;padding:0;border:0;background:transparent;color:#fff;opacity:0;pointer-events:none;cursor:pointer;transition:opacity .2s;z-index:4}
#back svg{display:block;width:100%;height:100%}
#experience.ready #back{opacity:1;pointer-events:auto}
#back:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){#menu,#experience{transition-duration:.01ms}#zoom.grow{animation-duration:.2s}.dot{transition-duration:.01ms}}
</style>
</head>
<body>

    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
  </div>
</main>
<div id="zoom" aria-hidden="true"></div>
<section id="experience" aria-label="Elastic blob fidget" inert>
  <canvas id="blob" tabindex="0" role="application" aria-label="Drag the white blob to stretch it and release to let it spring back. Press Enter or Space to bounce it."></canvas>
  <iframe id="voiceFrame" title="Voice visualizer" src="about:blank" allow="microphone" allowfullscreen></iframe>
  <iframe id="testFrame" title="Test dictation-to-video studio" src="about:blank" allow="microphone" allowfullscreen></iframe>

    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M28 12L16 24L28 36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

<script>
(() => {
  const menu = document.getElementById('menu');
  const dots = Array.from(document.querySelectorAll('.dot'));
  const zoom = document.getElementById('zoom');
  const experience = document.getElementById('experience');
  const back = document.getElementById('back');
  const canvas = document.getElementById('blob');
  const voiceFrame = document.getElementById('voiceFrame');
  const testFrame = document.getElementById('testFrame');
  const ctx = canvas.getContext('2d', { alpha: false });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let opened = false;
  let mode = "blob";
  let particles = [];
  let particleTouch = null;
  let ripples = [];
  let lastRippleAt = 0;
  let width = 0, height = 0, dpr = 1, radius = 100;
  let x = 0, y = 0, vx = 0, vy = 0, homeX = 0, homeY = 0;
  let targetX = 0, targetY = 0, grabX = 0, grabY = 0;
  let activePointer = null, pulse = 0, previousTime = 0;
  let points = [];
  let entrySide = 0;
  let jelly = 0;
  let lastPointerX = 0, lastPointerY = 0;
  let dragStartX = 0, dragStartY = 0;
  let dragGrowth = 0, targetDragGrowth = 0;

  function resize() {
    const oldX = homeX, oldY = homeY;
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    homeX = width / 2;
    homeY = height / 2;
    radius = Math.min(176, Math.max(70, Math.min(width, height) * .205));
    if (!oldX && !oldY) { x = homeX; y = homeY; }
    else if (activePointer === null && !opened) { x = homeX; y = homeY; }
    else if (activePointer === null) { x += homeX - oldX; y += homeY - oldY; }
    else { x += homeX - oldX; y += homeY - oldY; }
    targetX = activePointer === null ? homeX : targetX + homeX - oldX;
    targetY = activePointer === null ? homeY : targetY + homeY - oldY;
    draw(0, 0, 0);
  }

  function mid(a, b) { return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
  function maxBlobScale() {
    return Math.max(1.5, Math.hypot(width, height) / Math.max(radius * 1.55, 1));
  }
  function shape(sx, sy, time) {
    const stretch = Math.min(.72, Math.hypot(sx,sy) / Math.max(radius,1) * .85);
    const angle = Math.atan2(sy,sx);
    const speed = Math.min(.32,Math.hypot(vx,vy)/760);
    const pull = Math.max(stretch,speed);
    const breath = reduceMotion ? 0 : Math.sin(time*.0015)*.032 + Math.sin(time*.0008+1.7)*.018;
    const velocityAngle = Math.atan2(vy,vx);
    const squash = reduceMotion ? 0 : Math.min(.25,Math.hypot(vx,vy)/30);
    const size = 1 + dragGrowth * (maxBlobScale() - 1);
    const rX = radius*size*(1+breath+pulse*.15+pull*.42+squash*Math.cos(velocityAngle)**2);
    const rY = radius*size*(1+breath+pulse*.15-pull*.25+squash*Math.sin(velocityAngle)**2);
    points.length = 0;
    const n = 72;
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2, rel=a-angle;
      const wild=dragGrowth;
      const idleWave=reduceMotion?0:
        (.035*Math.sin(a*2-time*.0018)+.024*Math.sin(a*3+time*.0012)+.014*Math.cos(a*5-time*.0015))+
        wild*(.12*Math.sin(a*7-time*.012)+.085*Math.cos(a*9+time*.014)+.045*Math.sin(a*11-time*.018));
      const ripple=reduceMotion?0:jelly*(.105*Math.sin(a*2+time*.009)+.055*Math.sin(a*3-time*.007)+wild*.09*Math.sin(a*8+time*.016));
      const organic=1+.048*Math.sin(a*3+.55+time*.0008)+.028*Math.cos(a*5-.8-time*.0006)+idleWave+ripple;
      const warp=1+pull*((1+Math.cos(rel))*.28-Math.sin(rel)**2*.13)+wild*.11*Math.sin(a*6+time*.014);
      const px=Math.cos(a)*rX*organic*warp, py=Math.sin(a)*rY*organic*warp;
      const rotate=squash*.35*Math.sin(velocityAngle*2);
      points.push({x:x+px+py*rotate,y:y+py-px*rotate});
    }
    const path=new Path2D(), first=mid(points[n-1],points[0]);
    path.moveTo(first.x,first.y);
    for(let i=0;i<n;i++){const p=points[i],m=mid(p,points[(i+1)%n]);path.quadraticCurveTo(p.x,p.y,m.x,m.y);}
    path.closePath();
    return path;
  }
  function addRipple(px, py, strength = 1) {
    ripples.push({x:px,y:py,r:2,life:1,speed:(1.8+Math.random()*1.1)*strength,weight:strength});
    if(ripples.length>90) ripples.splice(0,ripples.length-90);
  }
  function drawRipples(time) {
    ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);
    const breathe = reduceMotion ? 0 : Math.sin(time*.0011)*5;
    ctx.save();ctx.translate(width/2,height/2);
    for(let layer=0;layer<7;layer++){
      const phase=((time*.018+layer*19)%120);
      const r=phase*2.1+layer*7+breathe;
      ctx.beginPath();ctx.arc(0,0,Math.max(1,r),0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,'+(0.28*(1-phase/120))+')';
      ctx.lineWidth=layer%2===0?1.25:.7;ctx.stroke();
    }
    ctx.restore();
    for(let i=ripples.length-1;i>=0;i--){
      const ring=ripples[i];ring.r+=ring.speed*(reduceMotion?1:1.25);ring.life-=reduceMotion?.035:.012;
      if(ring.life<=0){ripples.splice(i,1);continue;}
      for(let band=0;band<3;band++){
        const rr=ring.r-band*9;if(rr<=0)continue;
        ctx.beginPath();ctx.arc(ring.x,ring.y,rr,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,255,255,'+(ring.life*(.65-band*.17))+')';
        ctx.lineWidth=band===0?1.5:1;ctx.stroke();
      }
    }
  }
  function initParticles() {
    particles = Array.from({length:Math.min(150,Math.max(70,Math.round(width*height/9000)) )},()=>({
      x:Math.random()*width,y:Math.random()*height,
      vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,
      r:.6+Math.random()*1.5,phase:Math.random()*Math.PI*2
    }));
  }
  function drawParticles(time) {
    ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);
    for(const p of particles){
      if(!reduceMotion){p.x+=p.vx;p.y+=p.vy;p.phase+=.012;}
      if(p.x<0)p.x=width;if(p.x>width)p.x=0;
      if(p.y<0)p.y=height;if(p.y>height)p.y=0;
      if(particleTouch && !reduceMotion){
        const dx=p.x-particleTouch.x,dy=p.y-particleTouch.y,dist=Math.hypot(dx,dy);
        if(dist<150 && dist>1){const force=(150-dist)/150*.045;p.vx+=dx/dist*force;p.vy+=dy/dist*force;}
      }
      p.vx*=.997;p.vy*=.997;
      const glow=reduceMotion?1:(.55+.45*Math.sin(p.phase+time*.001));
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*glow,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+(.25+glow*.75)+')';ctx.fill();
    }
    if(particleTouch){
      ctx.beginPath();ctx.arc(particleTouch.x,particleTouch.y,5,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();
    }
  }
  function draw(sx,sy,time) {
    if(mode==='particles'){drawParticles(time);return;}
    if(mode==='ripples'){drawRipples(time);return;}
    ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);
    ctx.fillStyle='#fff';ctx.fill(shape(sx,sy,time));
  }
  function animate(time) {
    if(!width||!height){requestAnimationFrame(animate);return;}
    const dt=previousTime?Math.min((time-previousTime)/16.667,2):1;
    previousTime=time;
    const destX=homeX;
    const destY=homeY;
    if(reduceMotion){x+=(destX-x)*.34;y+=(destY-y)*.34;vx*=.65;vy*=.65;}
    else {
      const stiffness=activePointer===null?.082:.15;
      vx+=(destX-x)*stiffness*dt;vy+=(destY-y)*stiffness*dt;
      const damping=Math.pow(activePointer===null?.84:.76,dt);
      vx*=damping;vy*=damping;x+=vx*dt;y+=vy*dt;
    }
    pulse*=reduceMotion?.7:Math.pow(.9,dt);
    jelly*=reduceMotion?0:Math.pow(.965,dt);
    dragGrowth += (targetDragGrowth - dragGrowth) * (reduceMotion ? .28 : Math.min(.3, .12 * dt));
    if(pulse<.001)pulse=0;
    if(jelly<.002)jelly=0;
    if(dragGrowth<.001 && targetDragGrowth===0)dragGrowth=0;
    draw(0,0,time);
    requestAnimationFrame(animate);
  }
  function local(event){const r=canvas.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top};}

  const voiceDocument = "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <meta name=\"theme-color\" content=\"#000000\">\n  <meta name=\"description\" content=\"A minimal voice visualizer. Speak, and watch each word appear in a living white circle.\">\n  <title>VOICE</title>\n  <style>\n    :root {\n      color-scheme: dark;\n      --black: #000;\n      --white: #f7f7f7;\n      --muted: #777;\n      --pulse: 1;\n    }\n\n    * { box-sizing: border-box; }\n\n    html, body {\n      width: 100%;\n      min-width: 280px;\n      height: 100%;\n      min-height: 100%;\n      margin: 0;\n      background: var(--black);\n    }\n\n    body {\n      overflow: hidden;\n      color: var(--white);\n      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      -webkit-font-smoothing: antialiased;\n      user-select: none;\n    }\n\n    .shell {\n      position: relative;\n      display: grid;\n      width: 100%;\n      height: 100%;\n      min-height: 100svh;\n      place-items: center;\n      isolation: isolate;\n      background: #000;\n    }\n\n    .topline {\n      position: absolute;\n      top: max(23px, env(safe-area-inset-top));\n      left: max(24px, env(safe-area-inset-left));\n      right: max(24px, env(safe-area-inset-right));\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: 16px;\n      pointer-events: none;\n    }\n\n    .brand {\n      font-size: 10px;\n      font-weight: 650;\n      letter-spacing: .24em;\n      color: #858585;\n      text-transform: uppercase;\n    }\n\n    .status {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      color: #777;\n      font-size: 9px;\n      font-weight: 650;\n      letter-spacing: .17em;\n      text-transform: uppercase;\n      white-space: nowrap;\n    }\n\n    .status-dot {\n      width: 6px;\n      height: 6px;\n      border-radius: 50%;\n      background: #515151;\n      transition: background .25s ease, box-shadow .25s ease;\n    }\n\n    .status.live { color: #c7c7c7; }\n    .status.live .status-dot {\n      background: #f4f4f4;\n      box-shadow: 0 0 12px rgba(255,255,255,.65);\n    }\n\n    .topline, .bottom { display: none; }\n\n    .stage {\n      display: grid;\n      place-items: center;\n      width: 100%;\n      padding: 28px;\n      transform: translateY(-1.5vh);\n    }\n\n    .orb {\n      --pulse: 1;\n      display: grid;\n      place-items: center;\n      width: clamp(220px, 52vmin, 390px);\n      aspect-ratio: 1;\n      padding: 12%;\n      border: 0;\n      border-radius: 50%;\n      outline: none;\n      background: var(--white);\n      color: #050505;\n      cursor: pointer;\n      transform: scale(var(--pulse));\n      transform-origin: center;\n      will-change: transform;\n      -webkit-tap-highlight-color: transparent;\n      transition: background .25s ease;\n    }\n\n    .orb:focus-visible {\n      box-shadow: 0 0 0 3px #000, 0 0 0 5px #f7f7f7;\n    }\n\n    .word {\n      display: block;\n      max-width: 100%;\n      overflow-wrap: anywhere;\n      color: #050505;\n      font-size: clamp(25px, 5vmin, 52px);\n      font-weight: 720;\n      letter-spacing: -.055em;\n      line-height: 1.05;\n      text-align: center;\n      text-transform: none;\n    }\n\n    .word.prompt {\n      font-size: clamp(10px, 1.55vmin, 13px);\n      font-weight: 750;\n      letter-spacing: .19em;\n      line-height: 1.7;\n      text-transform: uppercase;\n    }\n\n    .word.small-word { font-size: clamp(19px, 3.8vmin, 37px); }\n\n    .departing-word {\n      position: fixed;\n      z-index: 5;\n      display: block;\n      max-width: min(80vw, 390px);\n      overflow-wrap: anywhere;\n      color: #050505;\n      font-size: clamp(25px, 5vmin, 52px);\n      font-weight: 720;\n      letter-spacing: -.055em;\n      line-height: 1.05;\n      text-align: center;\n      pointer-events: none;\n      transform: translate(-50%, -50%);\n      animation: word-float-away 1.15s cubic-bezier(.22,.7,.25,1) forwards;\n    }\n\n    .departing-word.small-word { font-size: clamp(19px, 3.8vmin, 37px); }\n\n    @keyframes word-float-away {\n      0%   { transform: translate(-50%, -50%) translateY(0); color: #050505; opacity: 1; }\n      32%  { color: #050505; opacity: 1; }\n      58%  { color: #f7f7f7; opacity: .85; }\n      100% { transform: translate(-50%, -50%) translateY(-230px); color: #f7f7f7; opacity: 0; }\n    }\n\n    .bottom {\n      position: absolute;\n      right: max(22px, env(safe-area-inset-right));\n      bottom: max(24px, env(safe-area-inset-bottom));\n      left: max(22px, env(safe-area-inset-left));\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      gap: 10px;\n      text-align: center;\n    }\n\n    .hint {\n      margin: 0;\n      color: #666;\n      font-size: 9px;\n      font-weight: 550;\n      letter-spacing: .12em;\n      line-height: 1.6;\n      text-transform: uppercase;\n    }\n\n    .hint.hidden { display: none; }\n\n    .error {\n      max-width: min(500px, 88vw);\n      color: #aaa;\n      font-size: 11px;\n      letter-spacing: .02em;\n      line-height: 1.5;\n      text-transform: none;\n    }\n\n    @media (max-height: 500px) {\n      .stage { transform: none; }\n      .orb { width: min(48vh, 290px); }\n      .topline { top: 15px; }\n      .bottom { bottom: 12px; }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      .status-dot, .orb { transition: none; }\n      .departing-word { animation-duration: .01ms; }\n    }\n  </style>\n</head>\n<body>\n  <main class=\"shell\">\n    <header class=\"topline\" aria-hidden=\"true\">\n      <span class=\"brand\">Voice / Visualizer</span>\n      <span class=\"status\" id=\"status\"><span class=\"status-dot\"></span><span id=\"statusText\">Mic off</span></span>\n    </header>\n\n    <section class=\"stage\" aria-label=\"Voice visualizer\">\n      <button class=\"orb\" id=\"orb\" type=\"button\" aria-label=\"Start microphone and speech recognition\">\n        <span class=\"word prompt\" id=\"word\" aria-live=\"off\">Tap to<br>start</span>\n      </button>\n    </section>\n\n    <footer class=\"bottom\">\n      <p class=\"hint\" id=\"hint\">Click the circle to begin · Esc to stop</p>\n      <p class=\"hint\" id=\"privacy\">Live words use your browser’s speech-recognition service.</p>\n      <p class=\"hint error\" id=\"message\" role=\"status\" aria-live=\"polite\"></p>\n    </footer>\n  </main>\n\n  <script>\n    (() => {\n      const orb = document.getElementById('orb');\n      const word = document.getElementById('word');\n      const status = document.getElementById('status');\n      const statusText = document.getElementById('statusText');\n      const hint = document.getElementById('hint');\n      const privacy = document.getElementById('privacy');\n      const message = document.getElementById('message');\n\n      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;\n      let listening = false;\n      let starting = false;\n      let micStream = null;\n      let audioContext = null;\n      let analyser = null;\n      let timeData = null;\n      let frameId = 0;\n      let recognition = null;\n      let recognitionDisabled = false;\n      let recognitionBusy = false;\n      let recognitionRestartTimer = 0;\n      let recognitionGeneration = 0;\n      let pulse = 1;\n\n      function setStatus(label, live) {\n        statusText.textContent = label;\n        status.classList.toggle('live', Boolean(live));\n      }\n\n      function floatPreviousWordAway() {\n        if (word.classList.contains('prompt')) return;\n        const previous = word.textContent.trim();\n        if (!previous) return;\n\n        const bounds = word.getBoundingClientRect();\n        const ghost = document.createElement('span');\n        ghost.className = 'departing-word' + (word.classList.contains('small-word') ? ' small-word' : '');\n        ghost.textContent = previous;\n        ghost.style.left = (bounds.left + bounds.width / 2) + 'px';\n        ghost.style.top = (bounds.top + bounds.height / 2) + 'px';\n        document.body.appendChild(ghost);\n        ghost.addEventListener('animationend', () => ghost.remove(), { once: true });\n      }\n\n      function showWord(value) {\n        const next = String(value || '').trim();\n        if (!next) return;\n        if (!word.classList.contains('prompt') && word.textContent.trim().toLocaleLowerCase() === next.toLocaleLowerCase()) return;\n        floatPreviousWordAway();\n        word.textContent = next;\n        word.classList.remove('prompt');\n        word.classList.toggle('small-word', next.length > 11);\n        orb.setAttribute('aria-label', 'Listening. Latest recognized word: ' + next + '. Click to stop.');\n      }\n\n      function latestWord(transcript) {\n        const matches = transcript.match(/[\\p{L}\\p{N}]+(?:['’\\-][\\p{L}\\p{N}]+)*/gu);\n        return matches && matches.length ? matches[matches.length - 1] : '';\n      }\n\n      function startRecognition() {\n        if (!SpeechRecognition) {\n          setStatus('Mic live · no captions', true);\n          message.textContent = 'Your microphone is working, but this browser does not offer live speech recognition. Try a supported browser such as Chrome on desktop.';\n          return;\n        }\n\n        if (!listening || recognitionDisabled) return;\n        if (recognitionRestartTimer) {\n          window.clearTimeout(recognitionRestartTimer);\n          recognitionRestartTimer = 0;\n        }\n\n        // Some browsers take a moment to release their speech service after stop().\n        // Never start a second recognition instance until the previous one has ended.\n        if (recognitionBusy) {\n          recognitionRestartTimer = window.setTimeout(() => {\n            recognitionRestartTimer = 0;\n            if (listening && !recognitionDisabled) startRecognition();\n          }, 350);\n          return;\n        }\n\n        const generation = recognitionGeneration;\n        const instance = new SpeechRecognition();\n        recognition = instance;\n        recognitionBusy = true;\n        instance.lang = 'en-US';\n        instance.continuous = true;\n        instance.interimResults = true;\n        instance.maxAlternatives = 1;\n\n        instance.onstart = () => {\n          if (listening && generation === recognitionGeneration) {\n            setStatus('Listening', true);\n            message.textContent = '';\n          }\n        };\n\n        instance.onresult = (event) => {\n          if (!listening || generation !== recognitionGeneration) return;\n          let transcript = '';\n          for (let i = event.results.length - 1; i >= 0; i--) {\n            const candidate = event.results[i][0] && event.results[i][0].transcript;\n            if (candidate && candidate.trim()) {\n              transcript = candidate.trim();\n              break;\n            }\n          }\n          const token = latestWord(transcript);\n          if (token) showWord(token);\n        };\n\n        instance.onerror = (event) => {\n          if (generation !== recognitionGeneration) return;\n          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {\n            recognitionDisabled = true;\n            setStatus('Speech blocked', true);\n            message.textContent = 'Microphone or speech-recognition permission was blocked. Check your browser permissions, then restart.';\n          } else if (event.error === 'language-not-supported') {\n            recognitionDisabled = true;\n            setStatus('Language unavailable', true);\n            message.textContent = 'English speech recognition is not available in this browser.';\n          } else if (event.error !== 'aborted' && event.error !== 'no-speech') {\n            setStatus('Mic live · captions retrying', true);\n            message.textContent = 'Speech recognition had a temporary problem. Trying to reconnect…';\n          }\n        };\n\n        instance.onend = () => {\n          recognitionBusy = false;\n          if (recognition === instance) recognition = null;\n\n          if (!listening || recognitionDisabled) return;\n          if (recognitionRestartTimer) window.clearTimeout(recognitionRestartTimer);\n          recognitionRestartTimer = window.setTimeout(() => {\n            recognitionRestartTimer = 0;\n            if (listening && !recognitionDisabled) startRecognition();\n          }, 350);\n        };\n\n        try {\n          instance.start();\n        } catch (_) {\n          // A few engines briefly reject start() while cleaning up a previous session.\n          recognitionBusy = false;\n          if (recognition === instance) recognition = null;\n          setStatus('Mic live · captions retrying', true);\n          message.textContent = 'Reconnecting speech recognition…';\n          recognitionRestartTimer = window.setTimeout(() => {\n            recognitionRestartTimer = 0;\n            if (listening && !recognitionDisabled) startRecognition();\n          }, 600);\n        }\n      }\n\n      function animate() {\n        if (!listening || !analyser || !timeData) return;\n        analyser.getByteTimeDomainData(timeData);\n        let sum = 0;\n        for (let i = 0; i < timeData.length; i++) {\n          const sample = (timeData[i] - 128) / 128;\n          sum += sample * sample;\n        }\n        const rms = Math.sqrt(sum / timeData.length);\n        const energy = Math.max(0, Math.min(0.58, (rms - 0.012) * 8.4));\n        const target = 1 + energy;\n        pulse += (target - pulse) * (target > pulse ? 0.28 : 0.11);\n        orb.style.setProperty('--pulse', pulse.toFixed(3));\n        frameId = window.requestAnimationFrame(animate);\n      }\n\n      async function startSession() {\n        if (starting || listening) return;\n        starting = true;\n        orb.disabled = true;\n        message.textContent = '';\n        setStatus('Requesting mic', false);\n\n        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {\n          setStatus('Mic unavailable', false);\n          message.textContent = 'Microphone access requires a supported browser and a secure HTTPS website.';\n          starting = false;\n          orb.disabled = false;\n          return;\n        }\n\n        try {\n          micStream = await navigator.mediaDevices.getUserMedia({\n            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },\n            video: false\n          });\n\n          const AudioContextClass = window.AudioContext || window.webkitAudioContext;\n          if (AudioContextClass) {\n            audioContext = new AudioContextClass();\n            if (audioContext.state === 'suspended') await audioContext.resume();\n            analyser = audioContext.createAnalyser();\n            analyser.fftSize = 1024;\n            analyser.smoothingTimeConstant = 0.72;\n            const source = audioContext.createMediaStreamSource(micStream);\n            source.connect(analyser);\n            timeData = new Uint8Array(analyser.fftSize);\n          }\n\n          listening = true;\n          recognitionGeneration++;\n          recognitionDisabled = false;\n          starting = false;\n          orb.disabled = false;\n          orb.classList.add('active');\n          hint.textContent = 'Click the circle or press Esc to stop';\n          privacy.classList.add('hidden');\n          setStatus(SpeechRecognition ? 'Listening' : 'Mic live', true);\n          word.textContent = '…';\n          word.classList.remove('prompt', 'small-word');\n          orb.setAttribute('aria-label', 'Microphone active. Click to stop listening.');\n          if (analyser && timeData) frameId = window.requestAnimationFrame(animate);\n          startRecognition();\n        } catch (error) {\n          if (micStream) micStream.getTracks().forEach((track) => track.stop());\n          micStream = null;\n          listening = false;\n          starting = false;\n          orb.disabled = false;\n          setStatus('Mic denied', false);\n          message.textContent = error && error.name === 'NotAllowedError'\n            ? 'Microphone access was not allowed. Allow it in your browser’s site settings, then click the circle again.'\n            : 'Could not start the microphone. Check that a microphone is connected and available to your browser.';\n        }\n      }\n\n      async function stopSession() {\n        listening = false;\n        starting = false;\n        recognitionGeneration++;\n        if (recognitionRestartTimer) {\n          window.clearTimeout(recognitionRestartTimer);\n          recognitionRestartTimer = 0;\n        }\n        if (frameId) window.cancelAnimationFrame(frameId);\n        frameId = 0;\n\n        // Keep the instance's onend handler attached so the browser can tell us\n        // when its speech service is actually released before the next start.\n        if (recognition) {\n          recognitionDisabled = true;\n          try { recognition.stop(); } catch (_) {\n            recognitionBusy = false;\n            recognition = null;\n          }\n        } else {\n          recognitionBusy = false;\n        }\n\n        if (micStream) {\n          micStream.getTracks().forEach((track) => track.stop());\n          micStream = null;\n        }\n\n        if (audioContext) {\n          try { await audioContext.close(); } catch (_) {}\n          audioContext = null;\n        }\n\n        analyser = null;\n        timeData = null;\n        pulse = 1;\n        orb.style.setProperty('--pulse', '1');\n        orb.disabled = false;\n        orb.classList.remove('active');\n        word.textContent = 'Tap to start';\n        word.classList.add('prompt');\n        word.classList.remove('small-word');\n        orb.setAttribute('aria-label', 'Start microphone and speech recognition');\n        hint.textContent = 'Click the circle to begin · Esc to stop';\n        privacy.classList.remove('hidden');\n        setStatus('Mic off', false);\n      }\n\n      orb.addEventListener('click', () => {\n        if (listening) stopSession();\n        else startSession();\n      });\n\n      window.addEventListener('keydown', (event) => {\n        if (event.key === 'Escape' && listening) stopSession();\n      });\n\n      window.addEventListener('pagehide', () => {\n        if (micStream) micStream.getTracks().forEach((track) => track.stop());\n        if (recognition) {\n          try { recognition.stop(); } catch (_) {}\n        }\n      });\n    })();\n  <\/script>\n</body>\n</html>\n";

  dots.forEach((dot,index)=>{
    dot.addEventListener('click',()=>{
      if(index>4||opened)return;
      mode=index===0?'blob':index===1?'ripples':index===2?'particles':index===3?'voice':'test';
      opened=true;
      experience.setAttribute('aria-label',mode==='blob'?'Elastic blob fidget':mode==='ripples'?'Ripple ring sensory experience':mode==='particles'?'Drifting particle field':mode==='test'?'Test dictation studio':'Voice visualizer');
      canvas.setAttribute('aria-label',mode==='blob'?'Drag the white blob to stretch it and release to let it spring back. Press Enter or Space to bounce it.':mode==='ripples'?'Tap or drag anywhere to send soft rings rippling across the dark water.':mode==='test'?'Test dictation-to-video studio':'Move your finger through the floating lights to gently scatter them.');
      const r=dot.getBoundingClientRect();
      zoom.style.left=(r.left+r.width/2)+'px';
      zoom.style.top=(r.top+r.height/2)+'px';
      zoom.style.width=r.width+'px';
      zoom.style.height=r.height+'px';
      zoom.style.transformOrigin='center';
      const coverScale=(Math.hypot(window.innerWidth,window.innerHeight)*1.55)/r.width;
      zoom.style.setProperty('--zoom-scale',String(Math.ceil(coverScale)));
      zoom.classList.add('grow');
      window.setTimeout(()=>{
        menu.style.display='none';
        zoom.style.display='none';
        if(mode==='voice') {
          canvas.style.display='none';testFrame.style.display='none';
          voiceFrame.style.display='block';voiceFrame.src=new URL('visualizer/',window.location.href).href;
        } else if(mode==='test') {
          canvas.style.display='none';voiceFrame.style.display='none';
          testFrame.style.display='block';testFrame.src=new URL('test/',window.location.href).href;
        } else {
          voiceFrame.style.display='none';testFrame.style.display='none';canvas.style.display='block';
        }
        experience.classList.add('ready');
        experience.inert=false;
        window.setTimeout(()=>{
          if(mode==='blob') startBlobEntrance();
          else if(mode==='ripples') { ripples=[]; addRipple(width/2,height/2,1.7); addRipple(width/2,height/2,1.1); }
          else if(mode==='particles') { particleTouch=null; initParticles(); }
          if(mode!=='voice'&&mode!=='test') canvas.focus({preventScroll:true});
        },reduceMotion?20:460);
      },reduceMotion?200:810);
    });
  });

  function startBlobEntrance(){
    entrySide=(entrySide+1)%4;
    x=homeX;y=homeY;vx=0;vy=0;jelly=.95;
    const margin=radius*2.15;
    if(reduceMotion){x=homeX;y=homeY;return;}
    if(entrySide===0){x=-margin;y=height*.5;vx=8;}
    else if(entrySide===1){x=width+margin;y=height*.42;vx=-8;}
    else if(entrySide===2){x=width*.5;y=-margin;vy=8;}
    else{x=width*.5;y=height+margin;vy=-8;}
    targetX=homeX;targetY=homeY;activePointer=null;pulse=.24;
  }

  back.addEventListener('click',()=>{
    if(mode==='voice') { voiceFrame.src='about:blank';voiceFrame.style.display='none';canvas.style.display='block'; }
    if(mode==='test') { testFrame.src='about:blank';testFrame.style.display='none';canvas.style.display='block'; }
    experience.classList.remove('ready');
    experience.inert=true;
    zoom.style.display='block';
    zoom.classList.remove('grow');
    menu.style.display='grid';
    opened=false;
    window.setTimeout(()=>{zoom.style.width='0';zoom.style.height='0';},20);
  });

  canvas.addEventListener('pointerdown',event=>{
    if(mode==='particles'){
      const p=local(event);particleTouch=p;activePointer=event.pointerId;lastPointerX=p.x;lastPointerY=p.y;
      canvas.setPointerCapture(event.pointerId);event.preventDefault();return;
    }
    if(mode==='ripples'){
      const p=local(event);addRipple(p.x,p.y,1.25);activePointer=event.pointerId;
      lastPointerX=p.x;lastPointerY=p.y;canvas.setPointerCapture(event.pointerId);event.preventDefault();return;
    }
    if(activePointer!==null)return;
    const p=local(event);
    const hitRadius=radius*(1+dragGrowth*(maxBlobScale()-1))*1.28;
    if(Math.hypot(p.x-x,p.y-y)>hitRadius)return;
    activePointer=event.pointerId;grabX=p.x-x;grabY=p.y-y;
    dragStartX=p.x;dragStartY=p.y;targetDragGrowth=dragGrowth;
    targetX=homeX;targetY=homeY;lastPointerX=p.x;lastPointerY=p.y;pulse=Math.max(pulse,.18);jelly=Math.max(jelly,.12);
    canvas.setPointerCapture(event.pointerId);event.preventDefault();
  });
  canvas.addEventListener('pointermove',event=>{
    if(activePointer!==event.pointerId)return;
    const p=local(event);
    if(mode==='particles') { particleTouch=p;lastPointerX=p.x;lastPointerY=p.y;return; }
    if(mode==='ripples'){
      const moved=Math.hypot(p.x-lastPointerX,p.y-lastPointerY);
      if(moved>20 && performance.now()-lastRippleAt>22){addRipple(p.x,p.y,Math.min(1.6,moved/35));lastRippleAt=performance.now();}
      lastPointerX=p.x;lastPointerY=p.y;return;
    }
    lastPointerX=p.x;lastPointerY=p.y;
    const travel=Math.hypot(p.x-dragStartX,p.y-dragStartY);
    const threshold=Math.max(120,Math.min(width,height)*.65);
    targetDragGrowth=Math.min(1,travel/threshold);
    jelly=Math.max(jelly,.06+targetDragGrowth*.12);pulse=Math.max(pulse,targetDragGrowth*.18);
  });
  function release(event){if(activePointer!==event.pointerId)return;activePointer=null;if(mode==='particles'){particleTouch=null;return;}if(mode==='ripples')return;targetDragGrowth=0;pulse=.72;jelly=1.15+dragGrowth*.35;}
  canvas.addEventListener('pointerup',release);
  canvas.addEventListener('pointercancel',release);
  canvas.addEventListener('lostpointercapture',event=>{if(activePointer===event.pointerId){activePointer=null;targetDragGrowth=0;pulse=.3;jelly=Math.max(jelly,.8);}});
  canvas.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();if(mode==='particles'){for(const p of particles){p.vx+=(Math.random()-.5)*3;p.vy+=(Math.random()-.5)*3;}return;}if(mode==='ripples'){addRipple(width/2,height/2,1.5);return;}pulse=.85;jelly=1.1;if(!reduceMotion){vy-=7;targetDragGrowth=Math.max(targetDragGrowth,.28);window.setTimeout(()=>{targetDragGrowth=0;},180);}}
  });
  window.addEventListener('resize',resize,{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener('resize',resize,{passive:true});
  resize();
  requestAnimationFrame(animate);
})();
</script>
