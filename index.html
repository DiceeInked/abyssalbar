<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="A single elastic shape to stretch, tug, and release.">
<title>Form</title>
<style>
:root{color-scheme:light;--paper:#fff;--ink:#000}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper)}
body{overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
canvas:active{cursor:grabbing}
canvas:focus-visible{outline:2px solid var(--ink);outline-offset:-7px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="form" role="button" tabindex="0" aria-label="Elastic shape. Drag to stretch it, then release. Press enter or space to give it a little bounce."></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('form');
  const ctx = canvas.getContext('2d', { alpha: false });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0;
  let height = 0;
  let dpr = 1;
  let radius = 120;
  let x = 0;
  let y = 0;
  let vx = 0;
  let vy = 0;
  let homeX = 0;
  let homeY = 0;
  let targetX = 0;
  let targetY = 0;
  let grabX = 0;
  let grabY = 0;
  let activePointer = null;
  let moved = false;
  let pulse = 0;
  let phase = 0;
  let previousTime = 0;
  let points = [];

  function resize() {
    const oldHomeX = homeX;
    const oldHomeY = homeY;
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    homeX = width / 2;
    homeY = height / 2;
    radius = Math.min(176, Math.max(74, Math.min(width, height) * 0.205));
    if (!oldHomeX && !oldHomeY) {
      x = homeX;
      y = homeY;
    } else if (activePointer === null) {
      x = homeX;
      y = homeY;
    } else {
      x += homeX - oldHomeX;
      y += homeY - oldHomeY;
    }
    targetX = activePointer === null ? homeX : targetX + homeX - oldHomeX;
    targetY = activePointer === null ? homeY : targetY + homeY - oldHomeY;
    drawShape(0, 0);
  }

  function roundedBlob(cx, cy, stretchX, stretchY, t) {
    const velocity = Math.hypot(vx, vy);
    const direction = Math.atan2(stretchY, stretchX);
    const pull = Math.min(0.72, Math.hypot(stretchX, stretchY) / Math.max(radius, 1) * 0.85);
    const speedPull = Math.min(0.24, velocity / 1050);
    const elongation = Math.max(pull, speedPull);
    const breathe = reduceMotion ? 0 : Math.sin(t * 0.00115) * 0.014;
    const throb = pulse * 0.12;
    const rx = radius * (1 + breathe + throb + elongation * 0.48);
    const ry = radius * (1 + breathe + throb - elongation * 0.27);

    points.length = 0;
    const count = 72;
    for (let i = 0; i < count; i++) {
      const a = i / count * Math.PI * 2;
      const relative = a - direction;
      const toward = (1 + Math.cos(relative)) / 2;
      const across = Math.sin(relative);
      const organic = 1
        + 0.042 * Math.sin(a * 3 + 0.55)
        + 0.025 * Math.cos(a * 5 - 0.8)
        + (reduceMotion ? 0 : 0.009 * Math.sin(a * 2 + t * 0.0007));
      const dragWarp = 1 + elongation * (toward * 0.48 - across * across * 0.12);
      points.push({
        x: cx + Math.cos(a) * rx * organic * dragWarp,
        y: cy + Math.sin(a) * ry * organic * dragWarp
      });
    }

    const path = new Path2D();
    const firstMid = midpoint(points[count - 1], points[0]);
    path.moveTo(firstMid.x, firstMid.y);
    for (let i = 0; i < count; i++) {
      const current = points[i];
      const next = points[(i + 1) % count];
      const mid = midpoint(current, next);
      path.quadraticCurveTo(current.x, current.y, mid.x, mid.y);
    }
    path.closePath();
    return path;
  }

  function midpoint(a, b) {
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  function drawShape(stretchX, stretchY, time = 0) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, width, height);
    const path = roundedBlob(x, y, stretchX, stretchY, time);
    ctx.fillStyle = '#000';
    ctx.fill(path);
  }

  function animate(time) {
    if (!width || !height) {
      requestAnimationFrame(animate);
      return;
    }
    const dt = previousTime ? Math.min((time - previousTime) / 16.667, 2) : 1;
    previousTime = time;

    if (reduceMotion) {
      const targetXNow = activePointer === null ? homeX : targetX;
      const targetYNow = activePointer === null ? homeY : targetY;
      x += (targetXNow - x) * 0.34;
      y += (targetYNow - y) * 0.34;
      vx *= 0.65;
      vy *= 0.65;
    } else {
      const destinationX = activePointer === null ? homeX : targetX;
      const destinationY = activePointer === null ? homeY : targetY;
      const stiffness = activePointer === null ? 0.105 : 0.15;
      vx += (destinationX - x) * stiffness * dt;
      vy += (destinationY - y) * stiffness * dt;
      const damping = Math.pow(activePointer === null ? 0.79 : 0.76, dt);
      vx *= damping;
      vy *= damping;
      x += vx * dt;
      y += vy * dt;
    }

    pulse *= reduceMotion ? 0.7 : Math.pow(0.88, dt);
    if (pulse < 0.001) pulse = 0;

    const stretchX = activePointer === null ? homeX - x : targetX - x;
    const stretchY = activePointer === null ? homeY - y : targetY - y;
    drawShape(stretchX, stretchY, time);
    requestAnimationFrame(animate);
  }

  function localPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', (event) => {
    if (activePointer !== null) return;
    const p = localPoint(event);
    if (Math.hypot(p.x - x, p.y - y) > radius * 1.28) return;
    activePointer = event.pointerId;
    grabX = p.x - x;
    grabY = p.y - y;
    targetX = p.x - grabX;
    targetY = p.y - grabY;
    moved = false;
    pulse = Math.max(pulse, 0.18);
    canvas.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  canvas.addEventListener('pointermove', (event) => {
    if (activePointer !== event.pointerId) return;
    const p = localPoint(event);
    targetX = p.x - grabX;
    targetY = p.y - grabY;
    if (Math.hypot(targetX - homeX, targetY - homeY) > 5) moved = true;
  });

  function release(event) {
    if (activePointer !== event.pointerId) return;
    activePointer = null;
    pulse = moved ? 0.5 : 0.28;
    moved = false;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('lostpointercapture', (event) => {
    if (activePointer === event.pointerId) {
      activePointer = null;
      pulse = 0.3;
    }
  });

  function bounce() {
    pulse = 0.62;
    vy -= reduceMotion ? 0 : 5;
  }
  canvas.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      bounce();
    }
  });

  window.addEventListener('resize', resize, { passive: true });
  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
