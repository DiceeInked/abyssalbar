<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A minimalist field of dots hiding a tactile little world.">
<title>Still</title>
<style>
:root{color-scheme:dark;--paper:#000;--ink:#fff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:var(--paper)}
@supports(height:100dvh){html,body{height:100dvh;min-height:100dvh}}
body{overscroll-behavior:none;overscroll-behavior-y:none;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
button{font:inherit}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:#fff;opacity:1;transition:opacity .45s ease;z-index:2}
.grid{display:grid;grid-template-columns:repeat(5,clamp(18px,5.2vw,36px));grid-template-rows:repeat(5,clamp(18px,5.2vw,36px));gap:clamp(16px,4.2vw,34px)}
.dot{width:100%;height:100%;padding:0;border:0;border-radius:50%;background:#000;cursor:pointer;transform:scale(1);transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s;touch-action:manipulation}
.dot:not(.active):hover{transform:scale(1.2)}
.dot:focus-visible{outline:2px solid #000;outline-offset:5px}
#menu.leaving{pointer-events:none;opacity:0}
#zoom{position:fixed;z-index:3;left:0;top:0;width:0;height:0;border-radius:50%;background:#000;transform:translate(-50%,-50%) scale(0);pointer-events:none;will-change:transform}
#zoom.grow{animation:zoom-in .8s cubic-bezier(.65,0,.25,1) forwards}
@keyframes zoom-in{0%{transform:translate(-50%,-50%) scale(0);border-radius:50%}100%{transform:translate(-50%,-50%) scale(var(--zoom-scale,90));border-radius:50%}}
#experience{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:1;height:100vh;height:100dvh;overflow:hidden}
#experience.ready{opacity:1;pointer-events:auto}
#blob{display:block;width:100%;height:100%;height:100dvh;touch-action:none;overscroll-behavior:none;cursor:grab;outline:none;background:#000;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#blob:active{cursor:grabbing}
#blob:focus-visible{outline:2px solid #000;outline-offset:-7px}
#back{position:absolute;left:18px;top:18px;width:42px;height:42px;padding:0;border:0;background:transparent;color:#fff;opacity:0;pointer-events:none;cursor:pointer;transition:opacity .2s;z-index:4}
#back svg{display:block;width:100%;height:100%}
#experience.ready #back{opacity:1;pointer-events:auto}
#back:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){#menu,#experience{transition-duration:.01ms}#zoom.grow{animation-duration:.2s}.dot{transition-duration:.01ms}}
</style>
</head>
<body>
<main id="menu" aria-label="Choose a dot">
  <div class="grid" role="group" aria-label="Sensory experiences">
    <button class="dot active" type="button" aria-label="Open sensory experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
    <button class="dot" type="button" aria-label="Unavailable experience"></button>
  </div>
</main>
<div id="zoom" aria-hidden="true"></div>
<section id="experience" aria-label="Elastic blob fidget" inert>
  <canvas id="blob" tabindex="0" role="application" aria-label="Drag the white blob to stretch it and release to let it spring back. Press Enter or Space to bounce it."></canvas>
  <button id="back" type="button" aria-label="Back to dot grid">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M28 12L16 24L28 36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</section>
<script>
(() => {
  const menu = document.getElementById('menu');
  const dots = Array.from(document.querySelectorAll('.dot'));
  const zoom = document.getElementById('zoom');
  const experience = document.getElementById('experience');
  const back = document.getElementById('back');
  const canvas = document.getElementById('blob');
  const ctx = canvas.getContext('2d', { alpha: false });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let opened = false;
  let width = 0, height = 0, dpr = 1, radius = 100;
  let x = 0, y = 0, vx = 0, vy = 0, homeX = 0, homeY = 0;
  let targetX = 0, targetY = 0, grabX = 0, grabY = 0;
  let activePointer = null, pulse = 0, previousTime = 0;
  let points = [];
  let entrySide = 0;
  let jelly = 0;
  let lastPointerX = 0, lastPointerY = 0;
  let dragStartX = 0, dragStartY = 0;
  let dragGrowth = 0, targetDragGrowth = 0;

  function resize() {
    const oldX = homeX, oldY = homeY;
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    homeX = width / 2;
    homeY = height / 2;
    radius = Math.min(176, Math.max(70, Math.min(width, height) * .205));
    if (!oldX && !oldY) { x = homeX; y = homeY; }
    else if (activePointer === null && !opened) { x = homeX; y = homeY; }
    else if (activePointer === null) { x += homeX - oldX; y += homeY - oldY; }
    else { x += homeX - oldX; y += homeY - oldY; }
    targetX = activePointer === null ? homeX : targetX + homeX - oldX;
    targetY = activePointer === null ? homeY : targetY + homeY - oldY;
    draw(0, 0, 0);
  }

  function mid(a, b) { return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
  function maxBlobScale() {
    return Math.max(1.5, Math.hypot(width, height) / Math.max(radius * 1.55, 1));
  }
  function shape(sx, sy, time) {
    const stretch = Math.min(.72, Math.hypot(sx,sy) / Math.max(radius,1) * .85);
    const angle = Math.atan2(sy,sx);
    const speed = Math.min(.32,Math.hypot(vx,vy)/760);
    const pull = Math.max(stretch,speed);
    const breath = reduceMotion ? 0 : Math.sin(time*.0015)*.032 + Math.sin(time*.0008+1.7)*.018;
    const velocityAngle = Math.atan2(vy,vx);
    const squash = reduceMotion ? 0 : Math.min(.25,Math.hypot(vx,vy)/30);
    const size = 1 + dragGrowth * (maxBlobScale() - 1);
    const rX = radius*size*(1+breath+pulse*.15+pull*.42+squash*Math.cos(velocityAngle)**2);
    const rY = radius*size*(1+breath+pulse*.15-pull*.25+squash*Math.sin(velocityAngle)**2);
    points.length = 0;
    const n = 72;
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2, rel=a-angle;
      const wild=dragGrowth;
      const idleWave=reduceMotion?0:
        (.035*Math.sin(a*2-time*.0018)+.024*Math.sin(a*3+time*.0012)+.014*Math.cos(a*5-time*.0015))+
        wild*(.12*Math.sin(a*7-time*.012)+.085*Math.cos(a*9+time*.014)+.045*Math.sin(a*11-time*.018));
      const ripple=reduceMotion?0:jelly*(.105*Math.sin(a*2+time*.009)+.055*Math.sin(a*3-time*.007)+wild*.09*Math.sin(a*8+time*.016));
      const organic=1+.048*Math.sin(a*3+.55+time*.0008)+.028*Math.cos(a*5-.8-time*.0006)+idleWave+ripple;
      const warp=1+pull*((1+Math.cos(rel))*.28-Math.sin(rel)**2*.13)+wild*.11*Math.sin(a*6+time*.014);
      const px=Math.cos(a)*rX*organic*warp, py=Math.sin(a)*rY*organic*warp;
      const rotate=squash*.35*Math.sin(velocityAngle*2);
      points.push({x:x+px+py*rotate,y:y+py-px*rotate});
    }
    const path=new Path2D(), first=mid(points[n-1],points[0]);
    path.moveTo(first.x,first.y);
    for(let i=0;i<n;i++){const p=points[i],m=mid(p,points[(i+1)%n]);path.quadraticCurveTo(p.x,p.y,m.x,m.y);}
    path.closePath();
    return path;
  }
  function draw(sx,sy,time) {
    ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);
    ctx.fillStyle='#fff';ctx.fill(shape(sx,sy,time));
  }
  function animate(time) {
    if(!width||!height){requestAnimationFrame(animate);return;}
    const dt=previousTime?Math.min((time-previousTime)/16.667,2):1;
    previousTime=time;
    const destX=homeX;
    const destY=homeY;
    if(reduceMotion){x+=(destX-x)*.34;y+=(destY-y)*.34;vx*=.65;vy*=.65;}
    else {
      const stiffness=activePointer===null?.082:.15;
      vx+=(destX-x)*stiffness*dt;vy+=(destY-y)*stiffness*dt;
      const damping=Math.pow(activePointer===null?.84:.76,dt);
      vx*=damping;vy*=damping;x+=vx*dt;y+=vy*dt;
    }
    pulse*=reduceMotion?.7:Math.pow(.9,dt);
    jelly*=reduceMotion?0:Math.pow(.965,dt);
    dragGrowth += (targetDragGrowth - dragGrowth) * (reduceMotion ? .28 : Math.min(.3, .12 * dt));
    if(pulse<.001)pulse=0;
    if(jelly<.002)jelly=0;
    if(dragGrowth<.001 && targetDragGrowth===0)dragGrowth=0;
    draw(0,0,time);
    requestAnimationFrame(animate);
  }
  function local(event){const r=canvas.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top};}

  dots.forEach((dot,index)=>{
    dot.addEventListener('click',()=>{
      if(index!==0||opened)return;
      opened=true;
      const r=dot.getBoundingClientRect();
      zoom.style.left=(r.left+r.width/2)+'px';
      zoom.style.top=(r.top+r.height/2)+'px';
      zoom.style.width=r.width+'px';
      zoom.style.height=r.height+'px';
      zoom.style.transformOrigin='center';
      const coverScale=(Math.hypot(window.innerWidth,window.innerHeight)*1.55)/r.width;
      zoom.style.setProperty('--zoom-scale',String(Math.ceil(coverScale)));
      menu.classList.add('leaving');
      zoom.classList.add('grow');
      window.setTimeout(()=>{
        startBlobEntrance();
        experience.classList.add('ready');
        experience.inert=false;
        zoom.style.display='none';
        canvas.focus({preventScroll:true});
      },reduceMotion?200:810);
    });
  });

  function startBlobEntrance(){
    entrySide=(entrySide+1)%4;
    x=homeX;y=homeY;vx=0;vy=0;jelly=.95;
    const margin=radius*2.15;
    if(reduceMotion){x=homeX;y=homeY;return;}
    if(entrySide===0){x=-margin;y=height*.5;vx=8;}
    else if(entrySide===1){x=width+margin;y=height*.42;vx=-8;}
    else if(entrySide===2){x=width*.5;y=-margin;vy=8;}
    else{x=width*.5;y=height+margin;vy=-8;}
    targetX=homeX;targetY=homeY;activePointer=null;pulse=.24;
  }

  back.addEventListener('click',()=>{
    experience.classList.remove('ready');
    experience.inert=true;
    zoom.style.display='block';
    zoom.classList.remove('grow');
    menu.classList.remove('leaving');
    opened=false;
    window.setTimeout(()=>{zoom.style.width='0';zoom.style.height='0';},20);
  });

  canvas.addEventListener('pointerdown',event=>{
    if(activePointer!==null)return;
    const p=local(event);
    const hitRadius=radius*(1+dragGrowth*(maxBlobScale()-1))*1.28;
    if(Math.hypot(p.x-x,p.y-y)>hitRadius)return;
    activePointer=event.pointerId;grabX=p.x-x;grabY=p.y-y;
    dragStartX=p.x;dragStartY=p.y;targetDragGrowth=dragGrowth;
    targetX=homeX;targetY=homeY;lastPointerX=p.x;lastPointerY=p.y;pulse=Math.max(pulse,.18);jelly=Math.max(jelly,.12);
    canvas.setPointerCapture(event.pointerId);event.preventDefault();
  });
  canvas.addEventListener('pointermove',event=>{
    if(activePointer!==event.pointerId)return;
    const p=local(event);lastPointerX=p.x;lastPointerY=p.y;
    const travel=Math.hypot(p.x-dragStartX,p.y-dragStartY);
    const threshold=Math.max(120,Math.min(width,height)*.65);
    targetDragGrowth=Math.min(1,travel/threshold);
    jelly=Math.max(jelly,.06+targetDragGrowth*.12);pulse=Math.max(pulse,targetDragGrowth*.18);
  });
  function release(event){if(activePointer!==event.pointerId)return;activePointer=null;targetDragGrowth=0;pulse=.72;jelly=1.15+dragGrowth*.35;}
  canvas.addEventListener('pointerup',release);
  canvas.addEventListener('pointercancel',release);
  canvas.addEventListener('lostpointercapture',event=>{if(activePointer===event.pointerId){activePointer=null;targetDragGrowth=0;pulse=.3;jelly=Math.max(jelly,.8);}});
  canvas.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();pulse=.85;jelly=1.1;if(!reduceMotion){vy-=7;targetDragGrowth=Math.max(targetDragGrowth,.28);window.setTimeout(()=>{targetDragGrowth=0;},180);}}
  });
  window.addEventListener('resize',resize,{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener('resize',resize,{passive:true});
  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
