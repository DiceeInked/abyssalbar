<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101215">
  <title>DAG | Cave movement test</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">DRAWING ADVENTURE GAME</p>
        <h1>Cave test</h1>
      </div>
      <p class="header-note">Phase 2 · Cave foundation</p>
    </header>

    <section class="game-frame" aria-label="DAG cave movement test">
      <canvas id="game" aria-label="A block-style character in a side-view cave movement sandbox">
        Your browser does not support the HTML canvas element.
      </canvas>

      <div class="readout" aria-live="polite">
        <span id="movement-state">READY</span>
        <span id="collision-state">A99 · CAVE TEST</span>
      </div>

      <div class="touch-controls" aria-label="Touchscreen controls">
        <div class="movement-buttons">
          <button type="button" data-action="left" aria-label="Move left">←</button>
          <button type="button" data-action="right" aria-label="Move right">→</button>
        </div>
        <button class="jump-button" type="button" data-action="jump" aria-label="Hold to jump">JUMP</button>
      </div>
    </section>

    <footer class="game-footer">
      <p><kbd>A</kbd> <kbd>D</kbd> move <span>·</span> <kbd>Space</kbd> hold to auto-jump</p>
      <p class="footer-secondary">The ledges are temporary movement-test geometry.</p>
    </footer>
  </main>

  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
