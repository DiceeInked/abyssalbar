<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050708">
<title>DOTFORM</title>
<style>
:root{color-scheme:dark;--mint:#00ffc8}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050708}
body{font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#VRButton{
  position:absolute!important;
  left:50%!important;
  bottom:24px!important;
  transform:translateX(-50%)!important;
  min-width:150px!important;
  padding:13px 22px!important;
  border:1px solid #00ffc8!important;
  border-radius:9px!important;
  background:#071310!important;
  color:#eafff9!important;
  font:700 12px system-ui,sans-serif!important;
  letter-spacing:.16em!important;
  opacity:1!important;
  cursor:pointer!important;
}
#VRButton:hover{background:#10231e!important;color:#00ffc8!important}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// DOTFORM uses an invisible, infinite grid. Only each hand's selected
// grid position is shown; the grid itself is never rendered.
const GRID_SPACING = 0.1;
const MAX_HISTORY = 100;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17102f);

// A vaporwave sunset sky. This is separate from the modeling grid.
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 32, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: `
      varying float vHeight;
      void main() {
        vHeight = normalize(position).y;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying float vHeight;
      void main() {
        vec3 horizon = vec3(0.95, 0.36, 0.48);
        vec3 middle = vec3(0.34, 0.17, 0.53);
        vec3 upper = vec3(0.055, 0.075, 0.20);
        float blendUp = smoothstep(-0.12, 0.48, vHeight);
        vec3 color = mix(horizon, middle, blendUp);
        color = mix(color, upper, smoothstep(0.25, 0.95, vHeight));
        gl_FragColor = vec4(color, 1.0);
      }
    `
  })
);
scene.add(sky);

// A striped sunset disk sits low in the distance.
const sunset = new THREE.Mesh(
  new THREE.CircleGeometry(13, 64),
  new THREE.ShaderMaterial({
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      void main() {
        float stripe = mod(vUv.y * 19.0, 1.0);
        if (vUv.y < 0.48 && stripe < 0.22) discard;
        vec3 top = vec3(1.0, 0.55, 0.48);
        vec3 bottom = vec3(1.0, 0.20, 0.58);
        gl_FragColor = vec4(mix(bottom, top, vUv.y), 1.0);
      }
    `
  })
);
sunset.position.set(0, 13, -90);
sunset.lookAt(0, 1.6, 0);
scene.add(sunset);

// The visible floor is environmental decoration, not the 0.1-unit
// modeling grid. The modeling grid remains invisible everywhere else.
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.ShaderMaterial({
    vertexShader: `
      varying vec2 vWorldPosition;
      void main() {
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPosition.xz;
        gl_Position = projectionMatrix * viewMatrix * worldPosition;
      }
    `,
    fragmentShader: `
      varying vec2 vWorldPosition;

      float gridLine(vec2 position, float spacing) {
        vec2 coordinate = position / spacing;
        vec2 distanceToLine = abs(fract(coordinate - 0.5) - 0.5);
        vec2 derivative = fwidth(coordinate);
        vec2 line = 1.0 - smoothstep(vec2(0.0), derivative * 1.35, distanceToLine);
        return max(line.x, line.y);
      }

      void main() {
        float distanceFromCenter = length(vWorldPosition);
        float fade = 1.0 - smoothstep(45.0, 260.0, distanceFromCenter);

        vec3 base = vec3(0.055, 0.035, 0.12);
        vec3 minorColor = vec3(0.12, 0.48, 0.58);
        vec3 majorColor = vec3(0.75, 0.20, 0.52);

        float minorGrid = gridLine(vWorldPosition, 1.0);
        float majorGrid = gridLine(vWorldPosition, 5.0);

        vec3 color = base;
        color = mix(color, minorColor, minorGrid * 0.42 * fade);
        color = mix(color, majorColor, majorGrid * 0.48 * fade);
        color = mix(vec3(0.025, 0.02, 0.065), color, fade);

        gl_FragColor = vec4(color, 1.0);
      }
    `
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.025;
scene.add(floor);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const faceGroup = new THREE.Group();
const lineGroup = new THREE.Group();
const pointGroup = new THREE.Group();
scene.add(faceGroup, lineGroup, pointGroup);

const pointGeometry = new THREE.SphereGeometry(0.018, 12, 10);
const pointMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
const faceMaterial = new THREE.MeshBasicMaterial({
  color: 0x00ffc8,
  transparent: true,
  opacity: 0.18,
  side: THREE.DoubleSide,
  depthWrite: false
});

const points = [];
let edges = [];
let faces = [];
const undoStack = [];
const redoStack = [];

let mainHand = null;
let viewMode = false;

function makeInstruction() {
  const canvas = document.createElement('canvas');
  canvas.width = 1200;
  canvas.height = 180;
  const context = canvas.getContext('2d');
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = '#eafff9';
  context.font = '700 46px system-ui, sans-serif';
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText('CLICK A TRIGGER TO CHOOSE YOUR MAIN HAND', 600, 90);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false
  }));
  sprite.scale.set(1.65, 0.25, 1);
  sprite.renderOrder = 100;
  sprite.visible = false;
  scene.add(sprite);
  return sprite;
}

const instruction = makeInstruction();

function makePreviewLine() {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(new Float32Array(6), 3)
  );
  const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.55
  }));
  line.visible = false;
  line.frustumCulled = false;
  scene.add(line);
  return line;
}

function makeSelector(color) {
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.025, 12, 10),
    new THREE.MeshBasicMaterial({ color })
  );
  marker.visible = false;
  scene.add(marker);
  return marker;
}

const hands = [];

for (let i = 0; i < 2; i++) {
  const controller = renderer.xr.getController(i);
  const grip = renderer.xr.getControllerGrip(i);
  scene.add(controller, grip);

  const hand = {
    controller,
    grip,
    inputSource: null,
    selectedPosition: new THREE.Vector3(),
    selectedKey: '',
    marker: makeSelector(i === 0 ? 0x00ffc8 : 0xffffff),
    preview: makePreviewLine(),
    drawing: null,
    dragging: null,
    buttonWasDown: [false, false]
  };

  controller.userData.hand = hand;
  controller.addEventListener('connected', event => {
    hand.inputSource = event.data;
  });
  controller.addEventListener('disconnected', () => {
    hand.inputSource = null;
  });
  controller.addEventListener('selectstart', () => startDrawing(hand));
  controller.addEventListener('selectend', () => finishDrawing(hand));
  controller.addEventListener('squeezestart', () => startMoving(hand));
  controller.addEventListener('squeezeend', () => finishMoving(hand));

  hands.push(hand);
}

function snapPosition(position) {
  return new THREE.Vector3(
    Math.round(position.x / GRID_SPACING) * GRID_SPACING,
    Math.round(position.y / GRID_SPACING) * GRID_SPACING,
    Math.round(position.z / GRID_SPACING) * GRID_SPACING
  );
}

function positionKey(position) {
  return [
    Math.round(position.x / GRID_SPACING),
    Math.round(position.y / GRID_SPACING),
    Math.round(position.z / GRID_SPACING)
  ].join(',');
}

function findPoint(position) {
  const key = positionKey(position);
  for (let i = 0; i < points.length; i++) {
    if (positionKey(points[i]) === key) return i;
  }
  return -1;
}

function updateHandPosition(hand) {
  hand.grip.updateMatrixWorld(true);
  const worldPosition = new THREE.Vector3();
  hand.grip.getWorldPosition(worldPosition);
  hand.selectedPosition.copy(snapPosition(worldPosition));
  hand.selectedKey = positionKey(hand.selectedPosition);
  hand.marker.position.copy(hand.selectedPosition);
}

function snapshot() {
  return {
    points: points.map(point => point.toArray()),
    edges: edges.map(edge => edge.slice()),
    faces: faces.map(face => face.slice())
  };
}

function snapshotsMatch(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function commitHistory(before) {
  const after = snapshot();
  if (snapshotsMatch(before, after)) return;

  undoStack.push(before);
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
}

function restore(state) {
  points.length = 0;
  state.points.forEach(point => points.push(new THREE.Vector3(...point)));
  edges = state.edges.map(edge => edge.slice());
  faces = state.faces.map(face => face.slice());
  drawModel();
}

function clearGroup(group) {
  while (group.children.length) {
    const object = group.children[0];
    group.remove(object);
    if (object.geometry && object.geometry !== pointGeometry) {
      object.geometry.dispose();
    }
  }
}

function makeFaceGeometry(face) {
  if (face.length < 3) return null;

  const vertices = face.map(index => points[index]);
  const normal = new THREE.Vector3();

  // Newell's method finds the normal for a polygon in any orientation.
  for (let i = 0; i < vertices.length; i++) {
    const current = vertices[i];
    const next = vertices[(i + 1) % vertices.length];
    normal.x += (current.y - next.y) * (current.z + next.z);
    normal.y += (current.z - next.z) * (current.x + next.x);
    normal.z += (current.x - next.x) * (current.y + next.y);
  }

  if (normal.lengthSq() < 0.0000001) return null;
  normal.normalize();

  const helper = Math.abs(normal.x) < 0.8
    ? new THREE.Vector3(1, 0, 0)
    : new THREE.Vector3(0, 1, 0);
  const axisX = new THREE.Vector3().crossVectors(helper, normal).normalize();
  const axisY = new THREE.Vector3().crossVectors(normal, axisX).normalize();
  const origin = vertices[0];

  // Triangulate the polygon in its own plane, then put the triangles
  // back into their original 3D positions.
  const contour = vertices.map(point => {
    const offset = new THREE.Vector3().subVectors(point, origin);
    return new THREE.Vector2(offset.dot(axisX), offset.dot(axisY));
  });
  const triangles = THREE.ShapeUtils.triangulateShape(contour, []);
  const positions = [];

  triangles.forEach(triangle => {
    triangle.forEach(vertexIndex => {
      const point = vertices[vertexIndex];
      positions.push(point.x, point.y, point.z);
    });
  });

  if (!positions.length) return null;

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  return geometry;
}

function drawModel() {
  clearGroup(faceGroup);
  clearGroup(lineGroup);
  clearGroup(pointGroup);

  faces.forEach(face => {
    const geometry = makeFaceGeometry(face);
    if (geometry) faceGroup.add(new THREE.Mesh(geometry, faceMaterial));
  });

  edges.forEach(edge => {
    const geometry = new THREE.BufferGeometry().setFromPoints([
      points[edge[0]],
      points[edge[1]]
    ]);
    lineGroup.add(new THREE.Line(geometry, lineMaterial));
  });

  points.forEach(position => {
    const point = new THREE.Mesh(pointGeometry, pointMaterial);
    point.position.copy(position);
    pointGroup.add(point);
  });
}

function edgeExists(a, b) {
  return edges.some(edge =>
    (edge[0] === a && edge[1] === b) ||
    (edge[0] === b && edge[1] === a)
  );
}

function addEdge(a, b) {
  if (a === b || edgeExists(a, b)) return false;
  edges.push([a, b]);
  return true;
}

function findExistingPath(start, end) {
  const neighbours = Array.from({ length: points.length }, () => []);
  edges.forEach(([a, b]) => {
    neighbours[a].push(b);
    neighbours[b].push(a);
  });

  const previous = Array(points.length).fill(-1);
  const visited = Array(points.length).fill(false);
  const queue = [start];
  visited[start] = true;

  while (queue.length) {
    const current = queue.shift();
    if (current === end) break;

    neighbours[current].forEach(next => {
      if (!visited[next]) {
        visited[next] = true;
        previous[next] = current;
        queue.push(next);
      }
    });
  }

  if (!visited[end]) return null;

  const path = [];
  let current = end;
  while (current !== -1) {
    path.push(current);
    if (current === start) break;
    current = previous[current];
  }

  path.reverse();
  return path[0] === start ? path : null;
}

function startDrawing(hand) {
  if (!renderer.xr.isPresenting) return;

  // The first trigger press chooses the main hand. It does not draw.
  if (!mainHand) {
    mainHand = hand.controller;
    instruction.visible = false;
    return;
  }

  if (viewMode || hand.drawing || hand.dragging) return;

  updateHandPosition(hand);
  const before = snapshot();
  let startIndex = findPoint(hand.selectedPosition);

  // A point appears immediately when the trigger is pressed.
  if (startIndex === -1) {
    startIndex = points.length;
    points.push(hand.selectedPosition.clone());
    drawModel();
  }

  hand.drawing = {
    startIndex,
    before
  };
}

function updatePreview(hand) {
  if (!hand.drawing || viewMode) {
    hand.preview.visible = false;
    return;
  }

  const start = points[hand.drawing.startIndex];
  if (!start) {
    hand.preview.visible = false;
    return;
  }

  const end = hand.selectedPosition;
  if (start.distanceToSquared(end) < 0.000001) {
    hand.preview.visible = false;
    return;
  }

  const attribute = hand.preview.geometry.attributes.position;
  attribute.array[0] = start.x;
  attribute.array[1] = start.y;
  attribute.array[2] = start.z;
  attribute.array[3] = end.x;
  attribute.array[4] = end.y;
  attribute.array[5] = end.z;
  attribute.needsUpdate = true;
  hand.preview.geometry.computeBoundingSphere();
  hand.preview.visible = true;
}

function finishDrawing(hand) {
  if (!hand.drawing) return;

  const drawing = hand.drawing;
  hand.drawing = null;
  hand.preview.visible = false;

  if (viewMode || !points[drawing.startIndex]) return;

  updateHandPosition(hand);
  let endIndex = findPoint(hand.selectedPosition);

  // Reuse an existing point at this grid position. Otherwise create it.
  if (endIndex === -1) {
    endIndex = points.length;
    points.push(hand.selectedPosition.clone());
  }

  const startIndex = drawing.startIndex;

  if (endIndex !== startIndex && !edgeExists(startIndex, endIndex)) {
    // If this new edge joins the ends of an existing path of at least
    // three points, it explicitly closes a polygon.
    const existingPath = findExistingPath(startIndex, endIndex);
    addEdge(startIndex, endIndex);

    if (existingPath && existingPath.length >= 3) {
      faces.push(existingPath);
    }
  }

  commitHistory(drawing.before);
  drawModel();
}

function startMoving(hand) {
  if (!renderer.xr.isPresenting || !mainHand || viewMode) return;
  if (hand.drawing || hand.dragging) return;

  updateHandPosition(hand);
  const index = findPoint(hand.selectedPosition);
  if (index === -1) return;

  hand.dragging = {
    index,
    before: snapshot()
  };
}

function updateMoving(hand) {
  if (!hand.dragging || viewMode) return;

  const index = hand.dragging.index;
  if (!points[index]) return;

  const occupied = findPoint(hand.selectedPosition);
  if (occupied !== -1 && occupied !== index) return;

  if (positionKey(points[index]) !== hand.selectedKey) {
    points[index].copy(hand.selectedPosition);
    drawModel();
  }
}

function mergePoints(fromIndex, intoIndex) {
  if (fromIndex === intoIndex) return intoIndex;

  function remap(index) {
    const redirected = index === fromIndex ? intoIndex : index;
    return redirected > fromIndex ? redirected - 1 : redirected;
  }

  points.splice(fromIndex, 1);

  const nextEdges = [];
  const seenEdges = new Set();
  edges.forEach(([a, b]) => {
    const first = remap(a);
    const second = remap(b);
    if (first === second) return;
    const key = Math.min(first, second) + ':' + Math.max(first, second);
    if (!seenEdges.has(key)) {
      seenEdges.add(key);
      nextEdges.push([first, second]);
    }
  });
  edges = nextEdges;

  faces = faces.map(face => {
    const mapped = [];
    face.forEach(index => {
      const next = remap(index);
      if (!mapped.includes(next)) mapped.push(next);
    });
    return mapped;
  }).filter(face => face.length >= 3);

  return remap(intoIndex);
}

function finishMoving(hand) {
  if (!hand.dragging) return;

  const drag = hand.dragging;
  hand.dragging = null;
  if (!points[drag.index]) return;

  updateHandPosition(hand);
  const occupied = findPoint(hand.selectedPosition);

  if (occupied !== -1 && occupied !== drag.index) {
    mergePoints(drag.index, occupied);
  } else {
    points[drag.index].copy(hand.selectedPosition);
  }

  commitHistory(drag.before);
  drawModel();
}

function deletePoint(index) {
  if (index < 0 || index >= points.length) return;

  const before = snapshot();
  points.splice(index, 1);

  edges = edges.filter(edge => edge[0] !== index && edge[1] !== index)
    .map(edge => edge.map(value => value > index ? value - 1 : value));

  // A face that used the deleted point is no longer a complete polygon.
  faces = faces.filter(face => !face.includes(index))
    .map(face => face.map(value => value > index ? value - 1 : value));

  hands.forEach(hand => {
    hand.drawing = null;
    hand.dragging = null;
    hand.preview.visible = false;
  });

  commitHistory(before);
  drawModel();
}

function deleteSelectedPoint(hand) {
  if (viewMode || hand.drawing || hand.dragging) return;
  updateHandPosition(hand);
  deletePoint(findPoint(hand.selectedPosition));
}

function canRunHistoryAction() {
  return !hands.some(hand => hand.drawing || hand.dragging);
}

function undo() {
  if (viewMode || !canRunHistoryAction() || !undoStack.length) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
}

function redo() {
  if (viewMode || !canRunHistoryAction() || !redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
}

function toggleViewMode() {
  if (hands.some(hand => hand.drawing || hand.dragging)) return;
  viewMode = !viewMode;

  hands.forEach(hand => {
    hand.marker.visible = false;
    hand.preview.visible = false;
  });
}

function pollButtons(hand) {
  const inputSource = hand.inputSource || hand.controller.userData.inputSource;
  const gamepad = inputSource && inputSource.gamepad;
  if (!gamepad) return;

  const buttonA = !!gamepad.buttons[4]?.pressed;
  const buttonB = !!gamepad.buttons[5]?.pressed;

  if (buttonA && !hand.buttonWasDown[0]) {
    if (hand.controller === mainHand) toggleViewMode();
    else undo();
  }

  if (buttonB && !hand.buttonWasDown[1]) {
    if (hand.controller === mainHand) deleteSelectedPoint(hand);
    else redo();
  }

  hand.buttonWasDown[0] = buttonA;
  hand.buttonWasDown[1] = buttonB;
}

function updateInstruction() {
  if (!instruction.visible) return;

  const xrCamera = renderer.xr.getCamera(camera);
  xrCamera.updateMatrixWorld(true);

  const cameraPosition = new THREE.Vector3();
  const forward = new THREE.Vector3();
  xrCamera.getWorldPosition(cameraPosition);
  xrCamera.getWorldDirection(forward);

  instruction.position.copy(cameraPosition).addScaledVector(forward, 1.4);
  instruction.quaternion.copy(xrCamera.quaternion);
}

renderer.xr.addEventListener('sessionstart', () => {
  mainHand = null;
  viewMode = false;
  instruction.visible = true;

  hands.forEach(hand => {
    hand.drawing = null;
    hand.dragging = null;
    hand.buttonWasDown = [false, false];
    hand.marker.visible = false;
    hand.preview.visible = false;
  });
});

renderer.xr.addEventListener('sessionend', () => {
  mainHand = null;
  viewMode = false;
  instruction.visible = false;

  hands.forEach(hand => {
    hand.drawing = null;
    hand.dragging = null;
    hand.marker.visible = false;
    hand.preview.visible = false;
  });
});

function animate() {
  if (renderer.xr.isPresenting) {
    updateInstruction();

    hands.forEach(hand => {
      updateHandPosition(hand);
      pollButtons(hand);

      const editing = !!mainHand && !viewMode;
      hand.marker.visible = editing;
      if (editing) {
        hand.marker.position.copy(hand.selectedPosition);
        updatePreview(hand);
        updateMoving(hand);
      } else {
        hand.preview.visible = false;
      }
    });
  }

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
