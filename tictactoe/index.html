<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tic Tac Toe</title>
<style>
:root{color-scheme:dark;--black:#000;--white:#fff}
*{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--black);color:var(--white);font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;overflow:hidden;padding:20px}
.home{position:fixed;top:20px;left:20px;width:42px;height:42px;display:grid;place-items:center;border:1px solid #fff;border-radius:50%;color:#fff;text-decoration:none;font-size:21px;transition:background .35s,color .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.home:hover{background:#fff;color:#000;transform:translateX(-3px)}
main{width:min(88vw,360px);text-align:center;animation:appear .8s cubic-bezier(.16,1,.3,1) both}
.status{height:24px;margin:0 0 22px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;perspective:700px}
.cell{position:relative;display:grid;place-items:center;aspect-ratio:1;background:#000;border:1px solid #fff;border-radius:3px;padding:0;cursor:pointer;overflow:hidden;transition:background .35s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1),border-radius .45s cubic-bezier(.2,.8,.2,1)}
.cell:hover:enabled{background:#fff;border-radius:14px;transform:translateY(-2px)}
.cell:focus-visible,.action:focus-visible{outline:2px solid #fff;outline-offset:4px}
.cell:disabled{cursor:default}
.mark{position:relative;width:48%;height:48%;display:block;animation:mark-in .48s cubic-bezier(.16,1.4,.3,1) both}
.mark.x:before,.mark.x:after{content:"";position:absolute;left:43%;top:-7%;width:14%;height:114%;background:#fff;border-radius:999px}
.mark.x:before{transform:rotate(45deg);animation:draw .36s cubic-bezier(.16,1,.3,1) both}
.mark.x:after{transform:rotate(-45deg);animation:draw-back .36s .06s cubic-bezier(.16,1,.3,1) both}
.mark.o{border:clamp(4px,1.5vw,7px) solid #fff;border-radius:50%;animation:ring-in .5s cubic-bezier(.16,1.3,.3,1) both}
.cell:hover:enabled .mark.x:before,.cell:hover:enabled .mark.x:after{background:#000}
.cell:hover:enabled .mark.o{border-color:#000}
.cell.winner{background:#fff;border-radius:14px;animation:win-pulse .7s ease-in-out infinite alternate}
.cell.winner .mark.x:before,.cell.winner .mark.x:after{background:#000}
.cell.winner .mark.o{border-color:#000}
.controls{display:flex;justify-content:center;gap:9px;margin-top:22px}
.action{background:transparent;color:#fff;border:1px solid #fff;border-radius:999px;padding:10px 16px;font:inherit;font-size:12px;cursor:pointer;transition:background .3s,color .3s,transform .3s}
.action:hover{background:#fff;color:#000;transform:translateY(-2px)}
.action:active{transform:scale(.96)}
@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes mark-in{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes ring-in{from{opacity:0;transform:scale(.2) rotate(-90deg);border-radius:25%}to{opacity:1;transform:scale(1) rotate(0);border-radius:50%}}
@keyframes draw{from{transform:scaleY(0) rotate(45deg)}to{transform:scaleY(1) rotate(45deg)}}
@keyframes draw-back{from{transform:scaleY(0) rotate(-45deg)}to{transform:scaleY(1) rotate(-45deg)}}
@keyframes win-pulse{from{transform:scale(1)}to{transform:scale(.975)}}
@media(max-width:380px){main{width:min(86vw,320px)}.controls{gap:7px}.action{padding:10px 13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<a class="home" href="../" aria-label="Home">↖</a>
<main>
<p class="status" id="status" role="status" aria-live="polite">X TO MOVE</p>
<div class="board" role="group" aria-label="Tic Tac Toe">
<button class="cell" type="button" data-cell="0" aria-label="Row 1, column 1"></button>
<button class="cell" type="button" data-cell="1" aria-label="Row 1, column 2"></button>
<button class="cell" type="button" data-cell="2" aria-label="Row 1, column 3"></button>
<button class="cell" type="button" data-cell="3" aria-label="Row 2, column 1"></button>
<button class="cell" type="button" data-cell="4" aria-label="Row 2, column 2"></button>
<button class="cell" type="button" data-cell="5" aria-label="Row 2, column 3"></button>
<button class="cell" type="button" data-cell="6" aria-label="Row 3, column 1"></button>
<button class="cell" type="button" data-cell="7" aria-label="Row 3, column 2"></button>
<button class="cell" type="button" data-cell="8" aria-label="Row 3, column 3"></button>
</div>
<div class="controls"><button class="action" id="again" type="button">PLAY AGAIN</button><button class="action" id="reset" type="button">RESET BOARD</button></div>
</main>
<script>
(()=>{const cells=[...document.querySelectorAll('[data-cell]')],status=document.getElementById('status'),wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(''),current='X',finished=false;
function getWinner(){for(const line of wins){const[a,b,c]=line;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return{player:board[a],line};}return null;}
function play(i){if(finished||board[i])return;board[i]=current;const mark=document.createElement('span');mark.className='mark '+current.toLowerCase();mark.setAttribute('aria-hidden','true');cells[i].append(mark);cells[i].setAttribute('aria-label',cells[i].getAttribute('aria-label')+', '+current);const win=getWinner();if(win){finished=true;status.textContent=win.player+' WINS';win.line.forEach(n=>cells[n].classList.add('winner'));cells.forEach(c=>c.disabled=true);return;}if(board.every(Boolean)){finished=true;status.textContent='DRAW';cells.forEach(c=>c.disabled=true);return;}current=current==='X'?'O':'X';status.textContent=current+' TO MOVE';}
function reset(){board=Array(9).fill('');current='X';finished=false;status.textContent='X TO MOVE';cells.forEach((c,i)=>{c.replaceChildren();c.disabled=false;c.className='cell';c.setAttribute('aria-label','Row '+(Math.floor(i/3)+1)+', column '+(i%3+1));});}
cells.forEach((c,i)=>c.addEventListener('click',()=>play(i)));document.getElementById('again').addEventListener('click',reset);document.getElementById('reset').addEventListener('click',reset);})();
</script>
</body>
</html>
