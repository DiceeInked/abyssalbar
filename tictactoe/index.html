
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TicTacToe by DiceeInked</title>

<style>
:root {
    color-scheme: dark;
    --black: #000;
    --white: #fff;
}

* {
    box-sizing: border-box;
}

html {
    background: var(--black);
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: system-ui, -apple-system, sans-serif;
}

main {
    width: min(88vw, 360px);
    text-align: center;
    animation: appear .8s cubic-bezier(.16, 1, .3, 1) both;
}

.status {
    min-height: 2.8em;
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.scoreboard {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 22px;
    font-size: 12px;
    letter-spacing: .12em;
}

.score {
    display: flex;
    gap: 7px;
    align-items: center;
}

.score-value {
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.cell {
    position: relative;
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    padding: 0;
    overflow: hidden;
    background: var(--black);
    border: 1px solid var(--white);
    border-radius: 3px;
    cursor: pointer;
    transition:
        background .35s cubic-bezier(.2, .8, .2, 1),
        transform .45s cubic-bezier(.2, .8, .2, 1),
        border-radius .45s cubic-bezier(.2, .8, .2, 1);
}

.cell:hover:enabled {
    background: var(--white);
    border-radius: 14px;
    transform: translateY(-2px);
}

.cell:focus-visible,
.action:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 4px;
}

.cell:disabled {
    cursor: default;
}

/* X and O marks */

.mark {
    position: relative;
    width: 48%;
    height: 48%;
    display: block;
    animation: mark-in .48s cubic-bezier(.16, 1.4, .3, 1) both;
}

/* X */

.mark-x::before,
.mark-x::after {
    content: "";
    position: absolute;
    left: 43%;
    top: -7%;
    width: 14%;
    height: 114%;
    background: var(--white);
    border-radius: 999px;
}

.mark-x::before {
    transform: rotate(45deg);
    animation: draw .36s cubic-bezier(.16, 1, .3, 1) both;
}

.mark-x::after {
    transform: rotate(-45deg);
    animation: draw-back .36s .06s cubic-bezier(.16, 1, .3, 1) both;
}

/* O */

.mark-o {
    border: clamp(4px, 1.5vw, 7px) solid var(--white);
    border-radius: 50%;
    animation: ring-in .5s cubic-bezier(.16, 1.3, .3, 1) both;
}

/* Hover mark colors */

.cell:hover:enabled .mark-x::before,
.cell:hover:enabled .mark-x::after {
    background: var(--black);
}

.cell:hover:enabled .mark-o {
    border-color: var(--black);
}

/* Winning animation */

.cell.winner {
    background: var(--white);
    border-radius: 14px;
    animation: win-pulse .7s ease-in-out infinite alternate;
}

.cell.winner .mark-x::before,
.cell.winner .mark-x::after {
    background: var(--black);
}

.cell.winner .mark-o {
    border-color: var(--black);
}

/* Controls */

.controls {
    display: flex;
    justify-content: center;
    margin-top: 22px;
}

.action {
    padding: 10px 18px;
    background: transparent;
    color: var(--white);
    border: 1px solid var(--white);
    border-radius: 999px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition:
        background .3s,
        color .3s,
        transform .3s;
}

.action:hover {
    background: var(--white);
    color: var(--black);
    transform: translateY(-2px);
}

.action:active {
    transform: scale(.96);
}

/* Animations */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.97);
        filter: blur(8px);
    }
    to {
        opacity: 1;
        transform: none;
        filter: blur(0);
    }
}

@keyframes mark-in {
    from {
        opacity: 0;
        transform: scale(.3) rotate(-30deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes ring-in {
    from {
        opacity: 0;
        transform: scale(.2) rotate(-90deg);
        border-radius: 25%;
    }
    to {
        opacity: 1;
        transform: scale(1) rotate(0);
        border-radius: 50%;
    }
}

@keyframes draw {
    from {
        transform: scaleY(0) rotate(45deg);
    }
    to {
        transform: scaleY(1) rotate(45deg);
    }
}

@keyframes draw-back {
    from {
        transform: scaleY(0) rotate(-45deg);
    }
    to {
        transform: scaleY(1) rotate(-45deg);
    }
}

@keyframes win-pulse {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(.975);
    }
}

/* Small screens */

@media (max-width: 380px) {
    main {
        width: min(86vw, 320px);
    }

    .scoreboard {
        gap: 14px;
    }
}

/* Reduced motion accessibility */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>
<main>

    <p class="status" id="game-status" role="status" aria-live="polite">
        X, your move.
    </p>

    <div class="scoreboard" aria-label="Game scores">
        <div class="score">
            X <span class="score-value" id="x-score">0</span>
        </div>

        <div class="score">
            O <span class="score-value" id="o-score">0</span>
        </div>

        <div class="score">
            DRAWS <span class="score-value" id="draw-score">0</span>
        </div>
    </div>

    <div class="board" role="group" aria-label="Tic Tac Toe">
        <button class="cell" type="button" data-cell="0" aria-label="Row 1, column 1"></button>
        <button class="cell" type="button" data-cell="1" aria-label="Row 1, column 2"></button>
        <button class="cell" type="button" data-cell="2" aria-label="Row 1, column 3"></button>
        <button class="cell" type="button" data-cell="3" aria-label="Row 2, column 1"></button>
        <button class="cell" type="button" data-cell="4" aria-label="Row 2, column 2"></button>
        <button class="cell" type="button" data-cell="5" aria-label="Row 2, column 3"></button>
        <button class="cell" type="button" data-cell="6" aria-label="Row 3, column 1"></button>
        <button class="cell" type="button" data-cell="7" aria-label="Row 3, column 2"></button>
        <button class="cell" type="button" data-cell="8" aria-label="Row 3, column 3"></button>
    </div>

    <div class="controls">
        <button class="action" type="button" id="again">AGAIN :3</button>
    </div>

</main>

<script>
(() => {
    // Game elements

    const cells = [...document.querySelectorAll("[data-cell]")];
    const status = document.getElementById("game-status");
    const againButton = document.getElementById("again");

    const scoreElements = {
        X: document.getElementById("x-score"),
        O: document.getElementById("o-score"),
        draws: document.getElementById("draw-score")
    };

    // Winning combinations

    const winningLines = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
    ];

    // Taunt collection

    const taunts = [
        "{player}, your move.",
        "{player}, are you going to go?",
        "{player}, we're waiting.",
        "{player}, the board isn't going to play itself.",
        "{player}, got a plan?",
        "{player}, hurry up!",
        "{player}, let's see what you've got.",
        "{player}, don't leave me hanging.",
        "{player}, make your move already.",
        "{player}, interesting strategy... if you move.",
        "{player}, tick tock.",
        "{player}, the suspense is killing the board.",
        "{player}, blink twice if you need help.",
        "{player}, is that really your best move?",
        "{player}, I've got all day.",
        "{player}, this is getting awkward.",
        "{player}, the squares are getting bored.",
        "{player}, any day now.",
        "{player}, I'm starting to feel bad for you.",
        "{player}, don't overthink it.",
        "{player}, genius takes time, apparently.",
        "{player}, are you planning something?",
        "{player}, the pressure is on.",
        "{player}, your opponent is getting comfortable.",
        "{player}, time to prove yourself.",
        "{player}, the board demands a move.",
        "{player}, don't disappoint us.",
        "{player}, that's a lot of thinking.",
        "{player}, you've got nine squares. Choose one.",
        "{player}, come on now.",
        "{player}, this isn't a staring contest.",
        "{player}, even the empty squares are impatient.",
        "{player}, your opponent says thanks for the break.",
        "{player}, the suspense is unnecessary.",
        "{player}, make history. Or just make a move.",
        "{player}, what's the master plan?",
        "{player}, I'm beginning to question your strategy.",
        "{player}, the clock isn't real, but the pressure is.",
        "{player}, somebody has to make the first move.",
        "{player}, don't let the X's and O's win.",
        "{player}, your turn has been waiting patiently.",
        "{player}, the audience is imaginary, but they're judging.",
        "{player}, surely you've got something.",
        "{player}, the next move could change everything.",
        "{player}, this is your moment.",
        "{player}, stop negotiating with the squares.",
        "{player}, your opponent is practically celebrating.",
        "{player}, I've seen faster moves from a loading screen.",
        "{player}, make a decision!",
        "{player}, let's get this game moving."
    ];

    // Victory messages

    const victoryMessages = [
        "{player}, beautifully played.",
        "{player}, that's one for the highlight reel.",
        "{player}, victory looks good on you.",
        "{player}, your opponent almost had you.",
        "{player}, the board has spoken.",
        "{player}, perfectly placed.",
        "{player}, not bad at all.",
        "{player}, well played. Try not to brag too much.",
        "{player}, someone came prepared.",
        "{player}, that's how it's done.",
        "{player}, the crown is yours. For now.",
        "{player}, a tidy little victory.",
        "{player}, you made that look easy.",
        "{player}, the other side needs a minute.",
        "{player}, points on the board!",
        "{player}, the winning line was waiting.",
        "{player}, a little strategy goes a long way.",
        "{player}, nicely done. Your opponent saw that coming... eventually.",
        "{player}, enjoy the victory lap.",
        "{player}, the squares picked a favorite.",
        "{player}, one step ahead.",
        "{player}, clean finish.",
        "{player}, well played, champion.",
        "{player}, victory secured.",
        "{player}, that was a clever move.",
        "{player}, the board belongs to you.",
        "{player}, somebody's on a winning streak.",
        "{player}, excellent placement.",
        "{player}, you earned that one.",
        "{player}, smooth moves!"
    ];

    // Shared shuffle bags

    const tauntBag = {
        remaining: [],
        lastMessage: null
    };

    const victoryBag = {
        remaining: [],
        lastMessage: null
    };

    // Shuffle a bag without repeating its previous final message

    function shuffleBag(bag, messages) {
        const shuffled = [...messages];

        for (let i = shuffled.length - 1; i > 0; i--) {
            const randomIndex = Math.floor(Math.random() * (i + 1));

            [shuffled[i], shuffled[randomIndex]] = [
                shuffled[randomIndex],
                shuffled[i]
            ];
        }

        // Prevent a repeat across shuffle cycles

        if (
            shuffled.length > 1 &&
            shuffled[shuffled.length - 1] === bag.lastMessage
        ) {
            [shuffled[0], shuffled[shuffled.length - 1]] = [
                shuffled[shuffled.length - 1],
                shuffled[0]
            ];
        }

        bag.remaining = shuffled;
    }

    // Draw a message from the shared bag

    function drawMessage(player, messages, bag) {
        if (bag.remaining.length === 0) {
            shuffleBag(bag, messages);
        }

        const message = bag.remaining.pop();

        bag.lastMessage = message;

        return message.replace("{player}", player);
    }

    function getTaunt(player) {
        return drawMessage(player, taunts, tauntBag);
    }

    function getVictoryMessage(player) {
        return drawMessage(player, victoryMessages, victoryBag);
    }

    // Game state

    let board = Array(9).fill("");
    let currentPlayer = "X";
    let gameFinished = false;

    const scores = {
        X: 0,
        O: 0,
        draws: 0
    };

    // Update scoreboard

    function updateScores() {
        scoreElements.X.textContent = scores.X;
        scoreElements.O.textContent = scores.O;
        scoreElements.draws.textContent = scores.draws;
    }

    // Check for a winner

    function getWinner() {
        for (const line of winningLines) {
            const [a, b, c] = line;

            if (
                board[a] &&
                board[a] === board[b] &&
                board[a] === board[c]
            ) {
                return {
                    player: board[a],
                    line
                };
            }
        }

        return null;
    }

    // Handle player moves

    function play(index) {
        if (gameFinished || board[index]) return;

        board[index] = currentPlayer;

        // Create mark

        const mark = document.createElement("span");

        mark.className = `mark mark-${currentPlayer.toLowerCase()}`;
        mark.setAttribute("aria-hidden", "true");

        cells[index].append(mark);

        cells[index].setAttribute(
            "aria-label",
            `${cells[index].getAttribute("aria-label")}, ${currentPlayer}`
        );

        // Check for winner

        const winner = getWinner();

        if (winner) {
            gameFinished = true;
            scores[winner.player]++;

            updateScores();

            status.textContent = getVictoryMessage(winner.player);

            winner.line.forEach(index => {
                cells[index].classList.add("winner");
            });

            cells.forEach(cell => {
                cell.disabled = true;
            });

            return;
        }

        // Check for draw

        if (board.every(Boolean)) {
            gameFinished = true;
            scores.draws++;

            updateScores();

            status.textContent = "DRAW! NOBODY WINS.";

            cells.forEach(cell => {
                cell.disabled = true;
            });

            return;
        }

        // Switch turns and display taunt

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        status.textContent = getTaunt(currentPlayer);
    }

    // Reset board without resetting scores or shuffle bags

    function resetGame() {
        board = Array(9).fill("");
        currentPlayer = "X";
        gameFinished = false;

        status.textContent = getTaunt(currentPlayer);

        cells.forEach((cell, index) => {
            cell.replaceChildren();
            cell.disabled = false;
            cell.className = "cell";

            const row = Math.floor(index / 3) + 1;
            const column = (index % 3) + 1;

            cell.setAttribute(
                "aria-label",
                `Row ${row}, column ${column}`
            );
        });
    }

    // Event listeners

    cells.forEach((cell, index) => {
        cell.addEventListener("click", () => play(index));
    });

    againButton.addEventListener("click", resetGame);

    // Initial message

    updateScores();
    status.textContent = getTaunt(currentPlayer);

})();
</script>
</body>
</html>
