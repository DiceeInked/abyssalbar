(()=>{'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
const a11y=document.getElementById('a11y');
const FILES='abcdefgh',TAU=Math.PI*2;
const DIR={n:[-33,-31,-18,-14,14,18,31,33],b:[-17,-15,15,17],r:[-16,-1,1,16],k:[-17,-16,-15,-1,1,15,16,17]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const valid=i=>i>=0&&i<128&&!(i&0x88);
const side=p=>!p||p==='.'?0:p===p.toUpperCase()?1:-1;
const kind=p=>p.toLowerCase();
const squareName=i=>FILES[i&7]+(8-(i>>4));
const sameMove=(a,b)=>a.from===b.from&&a.to===b.to&&a.promo===b.promo;

function initialState(){
  const board=Array(128).fill('.');
  const rows=['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'];
  rows.forEach((row,y)=>[...row].forEach((piece,x)=>board[y*16+x]=piece));
  return{board,turn:1,castle:15,ep:-1,half:0,full:1};
}
function attacked(s,target,by){
  for(let from=0;from<128;from++){
    if(!valid(from)||side(s.board[from])!==by)continue;
    const p=kind(s.board[from]);
    if(p==='p'){
      const forward=-16*by;
      if(target===from+forward-1||target===from+forward+1)return true;
      continue;
    }
    const directions=p==='q'?DIR.r.concat(DIR.b):DIR[p]||DIR.k;
    for(const step of directions){
      for(let to=from+step;valid(to);to+=step){
        if(to===target)return true;
        if(s.board[to]!=='.'||p==='n'||p==='k')break;
      }
    }
  }
  return false;
}
function inCheck(s,color=s.turn){
  const king=s.board.indexOf(color===1?'K':'k');
  return king>=0&&attacked(s,king,-color);
}
function applyMove(s,m){
  const board=s.board.slice();
  const moving=board[m.from],captured=board[m.to];
  let castle=s.castle;
  board[m.from]='.';
  board[m.to]=m.promo?(s.turn===1?m.promo.toUpperCase():m.promo):moving;
  if(m.flag==='ep')board[m.to+16*s.turn]='.';
  if(m.flag==='castle'){
    const rookFrom=m.to>m.from?m.from+3:m.from-4;
    const rookTo=m.to>m.from?m.from+1:m.from-1;
    const rook=board[rookFrom];
    board[rookTo]=rook;board[rookFrom]='.';
  }
  if(moving==='K')castle&=~3;
  if(moving==='k')castle&=~12;
  const rookRights={119:1,112:2,7:4,0:8};
  if(kind(moving)==='r')castle&=~(rookRights[m.from]||0);
  if(kind(captured)==='r')castle&=~(rookRights[m.to]||0);
  return{
    board,turn:-s.turn,castle,
    ep:kind(moving)==='p'&&Math.abs(m.to-m.from)===32?(m.from+m.to)/2:-1,
    half:kind(moving)==='p'||captured!=='.'||m.flag==='ep'?0:s.half+1,
    full:s.full+(s.turn===-1?1:0)
  };
}
function pseudoMoves(s,onlyFrom=-1){
  const out=[];
  const add=(from,to,promo='',flag='')=>{
    if(!valid(to)||kind(s.board[to])==='k')return;
    out.push({from,to,promo,flag});
  };
  for(let from=0;from<128;from++){
    if(!valid(from)||side(s.board[from])!==s.turn||(onlyFrom>=0&&from!==onlyFrom))continue;
    const p=kind(s.board[from]);
    if(p==='p'){
      const forward=-16*s.turn,one=from+forward,lastRank=s.turn===1?0:7;
      const addPawn=(to,flag='')=>{
        if((to>>4)===lastRank){for(const promotion of ['q','r','b','n'])add(from,to,promotion,flag);}
        else add(from,to,'',flag);
      };
      if(valid(one)&&s.board[one]==='.'){
        addPawn(one);
        const startRank=s.turn===1?6:1,two=one+forward;
        if((from>>4)===startRank&&s.board[two]==='.')add(from,two);
      }
      for(const fileStep of [-1,1]){
        const to=one+fileStep;if(!valid(to))continue;
        if(side(s.board[to])===-s.turn)addPawn(to);
        else if(to===s.ep&&s.board[to]==='.'&&s.board[to+16*s.turn]===(s.turn===1?'p':'P'))addPawn(to,'ep');
      }
      continue;
    }
    const directions=p==='q'?DIR.r.concat(DIR.b):DIR[p]||DIR.k;
    for(const step of directions){
      for(let to=from+step;valid(to);to+=step){
        if(side(s.board[to])===s.turn)break;
        add(from,to);
        if(s.board[to]!=='.'||p==='n'||p==='k')break;
      }
    }
    if(p==='k'){
      const home=s.turn===1?116:4,rook=s.turn===1?'R':'r';
      const kingSide=s.turn===1?1:4,queenSide=s.turn===1?2:8;
      if(from===home&&!inCheck(s)){
        if((s.castle&kingSide)&&s.board[home+3]===rook&&s.board[home+1]==='.'&&s.board[home+2]==='.'&&!attacked(s,home+1,-s.turn)&&!attacked(s,home+2,-s.turn))add(from,home+2,'','castle');
        if((s.castle&queenSide)&&s.board[home-4]===rook&&s.board[home-1]==='.'&&s.board[home-2]==='.'&&s.board[home-3]==='.'&&!attacked(s,home-1,-s.turn)&&!attacked(s,home-2,-s.turn))add(from,home-2,'','castle');
      }
    }
  }
  return out;
}
function legalMoves(s,onlyFrom=-1){return pseudoMoves(s,onlyFrom).filter(m=>!inCheck(applyMove(s,m),s.turn));}
function positionKey(s){
  let pieces='';for(let rank=0;rank<8;rank++)for(let file=0;file<8;file++)pieces+=s.board[rank*16+file];
  const ep=s.ep>=0&&legalMoves(s).some(m=>m.flag==='ep')?s.ep:-1;
  return pieces+'|'+s.turn+'|'+s.castle+'|'+ep;
}
function insufficientMaterial(s){
  const minors=[];
  for(let i=0;i<128;i++)if(valid(i)&&s.board[i]!=='.'&&kind(s.board[i])!=='k'){
    const p=kind(s.board[i]);if(['p','r','q'].includes(p))return false;
    minors.push({p,side:side(s.board[i]),square:i});
  }
  if(minors.length<=1)return true;
  if(minors.length===2&&minors.every(x=>x.p==='n')&&minors[0].side===minors[1].side)return true;
  return minors.every(x=>x.p==='b')&&new Set(minors.map(x=>((x.square>>4)+(x.square&7))%2)).size===1;
}
function san(s,m){
  const p=kind(s.board[m.from]),capture=s.board[m.to]!=='.'||m.flag==='ep';
  if(m.flag==='castle'){
    const next=applyMove(s,m),replies=legalMoves(next);
    return(m.to>m.from?'O-O':'O-O-O')+(inCheck(next)?(replies.length?'+':'#'):'');
  }
  let text='';
  if(p!=='p'){
    text=s.board[m.from].toUpperCase();
    const alternatives=legalMoves(s).filter(x=>x.from!==m.from&&x.to===m.to&&kind(s.board[x.from])===p);
    if(alternatives.length){
      const sameFile=alternatives.some(x=>(x.from&7)===(m.from&7));
      const sameRank=alternatives.some(x=>(x.from>>4)===(m.from>>4));
      text+=!sameFile?FILES[m.from&7]:!sameRank?String(8-(m.from>>4)):squareName(m.from);
    }
  }else if(capture)text=FILES[m.from&7];
  text+=(capture?'x':'')+squareName(m.to)+(m.promo?'='+m.promo.toUpperCase():'');
  const next=applyMove(s,m),replies=legalMoves(next);
  if(inCheck(next))text+=replies.length?'+':'#';
  return text;
}
function countCurrentPosition(states){
  const current=positionKey(states[states.length-1]);
  return states.reduce((count,s)=>count+(positionKey(s)===current?1:0),0);
}
function gameStatus(s,states){
  const moves=legalMoves(s),check=inCheck(s),repetitions=countCurrentPosition(states);
  if(!moves.length)return{over:true,text:check?'CHECKMATE':'STALEMATE',winner:check?-s.turn:0,claim:''};
  if(insufficientMaterial(s))return{over:true,text:'DRAW · INSUFFICIENT MATERIAL',winner:0,claim:''};
  if(s.half>=150)return{over:true,text:'DRAW · 75-MOVE RULE',winner:0,claim:''};
  if(repetitions>=5)return{over:true,text:'DRAW · FIVEFOLD REPETITION',winner:0,claim:''};
  const claim=s.half>=100?'50-MOVE RULE':repetitions>=3?'THREEFOLD REPETITION':'';
  return{over:false,text:(s.turn===1?'WHITE':'BLACK')+' TO MOVE'+(check?' · CHECK':''),winner:0,claim};
}

for(const [key,piece] of Object.entries(PIECES)){
  piece.points=[...piece.d.matchAll(/[ML]\s*([\d.-]+)\s+([\d.-]+)/g)].map(m=>({x:Number(m[1]),y:Number(m[2])}));
  piece.path=new Path2D(piece.d);
  piece.linework=new Path2D(SOURCE_LINEWORK[key].d);
}

let width=1,height=1,dpr=1,layout=null,boardScale=1;
let states=[initialState()],moveNotes=[],selected=-1,selectedMoves=[],promotion=null,claimText='';
let lastMove=null,lastMoveHistory=[null],statusCache=null,statusCacheLength=-1,statusCacheClaim='';
let arrivalEffect=null,residueEffect=null,fadingResidue=null,activeWiggle=-1;
let pieceFlipEffect=null;
let turnMarkerTransition=null;
const PIECE_FLIP_DURATION=210;
const TURN_MARKER_DURATION=420;
const current=()=>states[states.length-1];
function pieceFlipY(time){
  const restingFlip=current().turn;
  if(!pieceFlipEffect)return restingFlip;
  const effect=pieceFlipEffect;
  const progress=clamp((time-effect.start)/PIECE_FLIP_DURATION,0,1);
  const eased=(1-Math.cos(Math.PI*progress))*.5;
  const flip=lerp(effect.from,effect.to,eased);
  if(progress>=1)pieceFlipEffect=null;
  return flip;
}
function nowStatus(){if(!statusCache||statusCacheLength!==states.length||statusCacheClaim!==claimText){statusCache=claimText?{over:true,text:claimText,claim:''}:gameStatus(current(),states);statusCacheLength=states.length;statusCacheClaim=claimText;}return statusCache;}
function squareCenter(i){return{x:layout.x+(i&7)*layout.cell+layout.cell/2,y:layout.y+(i>>4)*layout.cell+layout.cell/2}}
function squareRect(i){return{x:layout.x+(i&7)*layout.cell,y:layout.y+(i>>4)*layout.cell,w:layout.cell,h:layout.cell}}
function drawBoard(){
  // The board is white, with a fixed pattern of inset black eight-point cells.
  // Tile geometry uses the same 320-unit grid and cell scale as the piece paths.
  ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
  const c=layout.cell,x=layout.x,y=layout.y,unit=c/320;
  const inset=35*unit,bulge=10*unit;
  for(let rank=0;rank<8;rank++)for(let file=0;file<8;file++){
    const left=x+file*c+inset,right=x+(file+1)*c-inset;
    const top=y+rank*c+inset,bottom=y+(rank+1)*c-inset;
    const middleX=(left+right)/2,middleY=(top+bottom)/2;
    polygon([
      {x:left,y:top},
      {x:middleX,y:top-bulge},
      {x:right,y:top},
      {x:right+bulge,y:middleY},
      {x:right,y:bottom},
      {x:middleX,y:bottom+bulge},
      {x:left,y:bottom},
      {x:left-bulge,y:middleY}
    ],'#000');
  }
}
function cellPolygon(square,scale=1){
  const c=layout.cell,unit=c/320,half=c/2-35*unit,tip=half+10*unit;
  const center=squareCenter(square),hx=half*scale,hy=half*scale,tx=tip*scale,ty=tip*scale;
  return[
    {x:center.x-hx,y:center.y-hy},
    {x:center.x,y:center.y-ty},
    {x:center.x+hx,y:center.y-hy},
    {x:center.x+tx,y:center.y},
    {x:center.x+hx,y:center.y+hy},
    {x:center.x,y:center.y+ty},
    {x:center.x-hx,y:center.y+hy},
    {x:center.x-tx,y:center.y}
  ];
}
function appendPolygon(points){
  if(!points.length)return;
  ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);
  ctx.closePath();
}
function drawTurnRing(square,scale){
  if(scale<=.001)return;
  // The outer polygon stays fixed to the cell. The inner polygon alone
  // contracts, exposing a solid black frame around its white center.
  const outer=cellPolygon(square,1);
  const innerScale=lerp(1,.76,clamp(scale,0,1));
  const inner=cellPolygon(square,innerScale);
  ctx.save();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';
  ctx.beginPath();appendPolygon(outer);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();appendPolygon(inner);
  ctx.fill();
  ctx.restore();
}
function drawTurnRings(squares,scale){
  if(scale<=.001)return;
  for(const square of squares)drawTurnRing(square,scale);
}
function squaresForSide(board,color){
  const squares=[];
  for(let i=0;i<128;i++)if(valid(i)&&side(board[i])===color)squares.push(i);
  return squares;
}
function drawTurnMarkers(time){
  if(!turnMarkerTransition){
    drawTurnRings(squaresForSide(current().board,current().turn),1);
    return;
  }
  const transition=turnMarkerTransition;
  const progress=smooth((time-transition.start)/TURN_MARKER_DURATION);
  if(progress>=1){
    turnMarkerTransition=null;
    drawTurnRings(squaresForSide(current().board,current().turn),1);
    return;
  }
  drawTurnRings(transition.from,1-progress);
  drawTurnRings(transition.to,progress);
}
function polygon(points,fill,stroke=null,lineWidth=1){
  if(points.length<3)return;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);
  ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.lineJoin='miter';ctx.lineCap='square';ctx.stroke();}
}
function diamondAt(x,y,halfWidth,halfHeight,fill,stroke=null,lineWidth=1){
  polygon([{x,y:y-halfHeight},{x:x+halfWidth,y},{x,y:y+halfHeight},{x:x-halfWidth,y}],fill,stroke,lineWidth);
}
function drawInvertingMarkers(){
  if(!selectedMoves.length)return;
  ctx.save();
  ctx.globalCompositeOperation='difference';
  ctx.fillStyle='#fff';
  for(const m of selectedMoves){
    const c=squareCenter(m.to);
    const captured=current().board[m.to]!=='.'||m.flag==='ep';
    const half=captured?layout.cell*.23:layout.cell*.10;
    // Snap the marker's center and extents to the device-pixel grid so
    // the inversion is crisp and is composited over every piece layer.
    const snap=value=>Math.round(value*dpr)/dpr;
    const cx=snap(c.x),cy=snap(c.y),w=snap(half),h=snap(half);
    diamondAt(cx,cy,w,h,'#fff');
  }
  ctx.restore();
}
function pieceCenter(def){
  return def.points.reduce((p,v)=>({x:p.x+v.x/def.points.length,y:p.y+v.y/def.points.length}),{x:0,y:0});
}
function hexagonPoints(points){
  const center=points.reduce((p,v)=>({x:p.x+v.x/points.length,y:p.y+v.y/points.length}),{x:0,y:0});
  const averageRadius=points.reduce((sum,v)=>sum+Math.hypot(v.x-center.x,v.y-center.y),0)/points.length;
  const radius=averageRadius*.72;
  // The previous-move residue always has six evenly spaced vertices.
  return Array.from({length:6},(_,i)=>{
    const angle=-Math.PI/2+i*TAU/6;
    return{x:center.x+Math.cos(angle)*radius,y:center.y+Math.sin(angle)*radius};
  });
}
function animatedPoints(piece,time,mode,started,seed=1){
  const def=PIECES[kind(piece)],base=def.points,center=pieceCenter(def);
  const elapsed=Math.max(0,time-started);
  if(mode==='blob'||mode==='shrink'){
    const hexagon=hexagonPoints(base);
    if(mode==='shrink'){
      const progress=1-easeOut(elapsed/320);
      return hexagon.map(p=>({x:center.x+(p.x-center.x)*progress,y:center.y+(p.y-center.y)*progress}));
    }
    // Let each of the hexagon's six corners drift independently, gently
    // changing its angles and radius without losing the six-sided silhouette.
    const mutation=easeOut(elapsed/300);
    return hexagon.map((p,i)=>{
      const angle=Math.atan2(p.y-center.y,p.x-center.x);
      const radius=Math.hypot(p.x-center.x,p.y-center.y);
      const phase=time*.0023+i*2.399+seed*1.37;
      const radial=(Math.sin(phase)*.055+Math.sin(phase*.61+i*1.31)*.02)*radius*mutation;
      const angular=Math.sin(phase*.73+i*1.77)*.045*mutation;
      const shiftedAngle=angle+angular,shiftedRadius=radius+radial;
      return{x:center.x+Math.cos(shiftedAngle)*shiftedRadius,y:center.y+Math.sin(shiftedAngle)*shiftedRadius};
    });
  }
  return base.map((p,i)=>{
    if(mode==='wiggle'){
      const phase=time*.0062+i*1.73+seed;
      const amount=layout.cell*.047;
      return{x:p.x+Math.sin(phase)*amount+Math.sin(phase*.57+i)*amount*.42,
        y:p.y+Math.cos(phase*1.13)*amount+Math.cos(phase*.71+i*1.3)*amount*.42};
    }
    if(mode==='expand'){
      const dx=p.x-center.x,dy=p.y-center.y,distance=Math.hypot(dx,dy);
      const easeLength=Math.min(24,distance*.24),linearLength=distance-easeLength,speed=.48,easeTime=90;
      const linearTime=linearLength/speed;
      const travelled=elapsed<linearTime?elapsed*speed:linearLength+easeLength*easeOut((elapsed-linearTime)/easeTime);
      const progress=distance?Math.min(1,travelled/distance):1;
      return{x:center.x+dx*progress,y:center.y+dy*progress};
    }
    return p;
  });
}
function expandedPolygon(points,distance){
  const area=points.reduce((sum,p,i)=>sum+p.x*points[(i+1)%points.length].y-points[(i+1)%points.length].x*p.y,0);
  const direction=area>=0?1:-1;
  const normals=points.map((p,i)=>{
    const next=points[(i+1)%points.length],dx=next.x-p.x,dy=next.y-p.y,length=Math.hypot(dx,dy)||1;
    return{x:direction*dy/length,y:-direction*dx/length};
  });
  return points.map((p,i)=>{
    const before=normals[(i+points.length-1)%points.length],after=normals[i];
    const sx=before.x+after.x,sy=before.y+after.y,sl=Math.hypot(sx,sy)||1;
    const bx=sx/sl,by=sy/sl;
    const projection=bx*after.x+by*after.y;
    const amount=Math.min(distance/Math.max(.25,projection),distance*3);
    return{x:p.x+bx*amount,y:p.y+by*amount};
  });
}
function drawPolygonPiece(piece,square,points,scale=1,alpha=1,flipY=1){
  const def=PIECES[kind(piece)];if(!def)return;
  scale*=.8375;
  const center=squareCenter(square),unit=layout.cell/320*scale;
  ctx.save();ctx.globalAlpha=alpha;ctx.globalCompositeOperation='difference';ctx.translate(center.x,center.y);
  // Flip across the horizontal x-axis: top and bottom exchange places,
  // while left and right stay unchanged for the opposing perspective.
  ctx.scale(1,flipY);
  ctx.translate(0,layout.cell*.36);
  ctx.translate(-def.cx*unit,-313.5*unit);ctx.scale(unit,unit);
  ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);
  ctx.closePath();ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
}
function drawPiece(piece,square,scale=1,alpha=1,flipY=1){
  const def=PIECES[kind(piece)];if(!def)return;
  drawPolygonPiece(piece,square,def.points,scale,alpha,flipY);
}
function drawPieceAt(piece,x,y,scale=1,rotation=0,alpha=1){
  const def=PIECES[kind(piece)];if(!def)return;
  scale*=.8375;
  const unit=layout.cell/320*scale,baseline=y+layout.cell*.36;
  ctx.save();ctx.globalAlpha=alpha;ctx.globalCompositeOperation='difference';ctx.translate(x,baseline);ctx.translate(-def.cx*unit,-313.5*unit);ctx.scale(unit,unit);
  ctx.beginPath();ctx.moveTo(def.points[0].x,def.points[0].y);
  for(let i=1;i<def.points.length;i++)ctx.lineTo(def.points[i].x,def.points[i].y);
  ctx.closePath();ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
}
function drawPieces(time){
  const board=current().board;
  const flipY=pieceFlipY(time);
  for(let i=0;i<128;i++){
    if(!valid(i)||board[i]==='.')continue;
    if(arrivalEffect&&arrivalEffect.square===i){
      const age=time-arrivalEffect.start;
      if(age<380){
        drawPolygonPiece(board[i],i,animatedPoints(board[i],time,'expand',arrivalEffect.start,arrivalEffect.seed),1,1,flipY);
        continue;
      }
      arrivalEffect=null;
    }
    const wiggle=i===selected||i===activeWiggle;
    if(wiggle){
      const seed=i===selected?11:23;
      drawPolygonPiece(board[i],i,animatedPoints(board[i],time,'wiggle',0,seed),1,1,flipY);
    }else drawPiece(board[i],i,1,1,flipY);
  }
  if(fadingResidue){
    const age=time-fadingResidue.shrinkStart;
    if(age<320)drawPolygonPiece(fadingResidue.piece,fadingResidue.square,
      animatedPoints(fadingResidue.piece,time,'shrink',fadingResidue.shrinkStart,fadingResidue.seed),1,1,flipY);
    else fadingResidue=null;
  }
  if(residueEffect){
    // Keep the departure copy as its own visible piece-shaped residue.
    // It is deliberately drawn last so board pieces cannot cover it.
    drawPolygonPiece(residueEffect.piece,residueEffect.square,
      animatedPoints(residueEffect.piece,time,'blob',residueEffect.start,residueEffect.seed),1,1,flipY);
  }
}
function drawPromotion(){
  if(!promotion)return;
  const boxW=layout.cell*4.8,boxH=layout.cell*1.45,x=(width-boxW)/2,y=(height-boxH)/2;
  ctx.fillStyle='#000';ctx.fillRect(x,y,boxW,boxH);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x+.5,y+.5,boxW-1,boxH-1);
  const options=['q','r','b','n'];
  options.forEach((p,i)=>{
    const size=boxH*.78,cx=x+boxW*(i+.5)/4,cy=y+boxH/2;
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(cx-size/2,cy-size/2,size,size);
    drawPieceAt(current().turn===1?p.toUpperCase():p,cx,cy,.72);
  });
}

function drawZoomControls(){
  const size=34,gap=8,x=12,y=12;
  ctx.save();
  for(let i=0;i<2;i++){
    const bx=x+i*(size+gap),by=y;
    // The button face uses difference compositing, so it inverts the board
    // and any other pixels directly beneath the control.
    ctx.globalCompositeOperation='difference';ctx.fillStyle='#fff';ctx.fillRect(bx,by,size,size);
    ctx.globalCompositeOperation='source-over';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(bx+.75,by+.75,size-1.5,size-1.5);
    ctx.beginPath();ctx.moveTo(bx+9,by+size/2);ctx.lineTo(bx+size-9,by+size/2);
    if(i===0){ctx.moveTo(bx+size/2,by+9);ctx.lineTo(bx+size/2,by+size-9);}
    ctx.stroke();
  }
  ctx.restore();
}
function render(time){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
  drawBoard();drawTurnMarkers(time);drawPieces(time);drawInvertingMarkers();drawZoomControls();
  if(promotion)drawPromotion();
}
function finishMove(m,time){
  const before=current(),notation=san(before,m),moving=before.board[m.from],after=applyMove(before,m);
  turnMarkerTransition={from:squaresForSide(before.board,before.turn),to:squaresForSide(after.board,after.turn),start:time};
  if(residueEffect)fadingResidue={...residueEffect,shrinkStart:time};
  residueEffect={piece:moving,square:m.from,start:time,seed:states.length+7};
  arrivalEffect={piece:after.board[m.to],square:m.to,start:time,seed:states.length+13};
  pieceFlipEffect={start:time,from:before.turn,to:after.turn};
  activeWiggle=m.to;
  states.push(after);moveNotes.push(notation);lastMove={from:m.from,to:m.to};lastMoveHistory.push(lastMove);statusCache=null;
  selected=-1;selectedMoves=[];promotion=null;claimText='';
  a11y.textContent=notation+'. '+gameStatus(after,states).text;
}
function play(m,time){
  if(nowStatus().over)return;
  if(promotion&&!m.promo)return;
  const found=legalMoves(current()).find(candidate=>sameMove(candidate,m));if(!found)return;
  finishMove(found,time);
}
function chooseSquare(square,time){
  if(promotion||nowStatus().over)return;
  if(selected>=0){const options=selectedMoves.filter(m=>m.to===square);
    if(options.length){if(options.length>1){promotion={options,start:time};return;}play(options[0],time);return;}
  }
  if(side(current().board[square])===current().turn){
    selected=selected===square?-1:square;
    selectedMoves=selected<0?[]:legalMoves(current(),selected);
    return;
  }
  selected=-1;selectedMoves=[];
}
function undo(){
  if(states.length<=1||promotion)return;
  const before=current();
  states.pop();
  const after=current();
  turnMarkerTransition={from:squaresForSide(before.board,before.turn),to:squaresForSide(after.board,after.turn),start:performance.now()};moveNotes.pop();lastMoveHistory.pop();lastMove=lastMoveHistory[lastMoveHistory.length-1]||null;selected=-1;selectedMoves=[];claimText='';statusCache=null;
  arrivalEffect=null;residueEffect=null;fadingResidue=null;activeWiggle=-1;
  a11y.textContent=nowStatus().text;
}
function restart(){
  const before=current(),after=initialState();
  states=[after];
  turnMarkerTransition={from:squaresForSide(before.board,before.turn),to:squaresForSide(after.board,after.turn),start:performance.now()};
  moveNotes=[];lastMove=null;lastMoveHistory=[null];selected=-1;selectedMoves=[];promotion=null;claimText='';statusCache=null;
  arrivalEffect=null;residueEffect=null;fadingResidue=null;activeWiggle=-1;
  a11y.textContent='New game. White to move.';
}
function claimDraw(){
  const st=gameStatus(current(),states);if(st.claim&&!promotion){claimText='DRAW CLAIMED · '+st.claim;selected=-1;selectedMoves=[];statusCache=null;a11y.textContent=claimText;}
}
function resize(){
  const r=canvas.getBoundingClientRect();width=Math.max(1,r.width);height=Math.max(1,r.height);dpr=Math.min(3,window.devicePixelRatio||1);
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  // Fit the board to the available screen in both directions, leaving only
  // a small, even margin. The same zoom factor applies to every piece.
  const rawSize=Math.max(8,Math.min(width-16,height-16)*boardScale);
  const cell=Math.max(1,Math.floor(rawSize*dpr/8))/dpr;
  const size=cell*8;
  const x=Math.round(((width-size)/2)*dpr)/dpr,y=Math.round(((height-size)/2)*dpr)/dpr;
  layout={x,y,size,cell};
}
function squareAt(x,y){if(!layout||x<layout.x||y<layout.y||x>=layout.x+layout.size||y>=layout.y+layout.size)return-1;return Math.floor((y-layout.y)/layout.cell)*16+Math.floor((x-layout.x)/layout.cell);}
function pointer(e){
  e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,now=performance.now();
  const controlSize=34,controlGap=8,controlY=12,controlX=12;
  if(!promotion&&y>=controlY&&y<=controlY+controlSize){
    if(x>=controlX&&x<=controlX+controlSize){boardScale=Math.min(1,Math.round((boardScale+.1)*100)/100);resize();return;}
    const minusX=controlX+controlSize+controlGap;
    if(x>=minusX&&x<=minusX+controlSize){boardScale=Math.max(.5,Math.round((boardScale-.1)*100)/100);resize();return;}
  }
  if(promotion){
    const boxW=layout.cell*4.8,boxH=layout.cell*1.45,bx=(width-boxW)/2,by=(height-boxH)/2;
    if(x>=bx&&x<=bx+boxW&&y>=by&&y<=by+boxH){const i=Math.floor((x-bx)/(boxW/4));if(i>=0&&i<4){const choice=promotion.options[i];promotion=null;play(choice,now);}}
    else promotion=null;
    return;
  }
  const square=squareAt(x,y);if(square>=0)chooseSquare(square,now);
}
function keydown(e){
  if(e.key==='Escape'){promotion=null;selected=-1;selectedMoves=[];}
}
function frame(time){render(time);requestAnimationFrame(frame);}
canvas.addEventListener('pointerdown',pointer,{passive:false});
resize();
turnMarkerTransition={from:[],to:squaresForSide(current().board,current().turn),start:performance.now()};
a11y.textContent=gameStatus(current(),states).text;
canvas.focus({preventScroll:true});
window.addEventListener('resize',resize);
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('selectstart',e=>e.preventDefault());
requestAnimationFrame(frame);
})();
</script>
</body>
