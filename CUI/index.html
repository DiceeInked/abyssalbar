<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CUI</title>
<style>
:root{color-scheme:dark;--bar-height:clamp(104px,19vh,154px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
body{touch-action:none}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#words{position:absolute;z-index:3;top:max(24px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));right:24px;max-width:min(760px,calc(100vw - 48px));color:#fff;font-size:clamp(25px,4vw,48px);font-weight:650;line-height:1.18;letter-spacing:-.045em;overflow-wrap:anywhere;opacity:0;transition:opacity .48s ease;pointer-events:none;text-shadow:0 1px 18px #000}
#words.visible{opacity:1}#words.fading{opacity:0}
#art,#ink{position:absolute;inset:0 0 var(--bar-height);width:100%;height:calc(100% - var(--bar-height));display:block}
#art{z-index:1;pointer-events:none}#ink{z-index:2;pointer-events:none;touch-action:none}
#ink.drawing{pointer-events:auto;cursor:crosshair}
#tray{position:absolute;z-index:4;left:0;right:0;bottom:0;height:var(--bar-height);padding:12px max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:#fff;color:#111;display:flex;align-items:center;gap:12px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}
#tray::-webkit-scrollbar{display:none}
.item{position:relative;flex:0 0 auto;width:clamp(76px,12vw,112px);height:calc(var(--bar-height) - 28px);max-height:124px;padding:0;border:0;border-radius:5px;background:#eee;overflow:hidden;cursor:grab;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.item.loading{background:linear-gradient(110deg,#eee 8%,#ddd 18%,#eee 33%);background-size:200% 100%}
.item.failed{background:#e7e7e7}
#drag-ghost{position:fixed;z-index:20;width:92px;height:92px;border-radius:7px;object-fit:cover;pointer-events:none;transform:translate(-50%,-50%) scale(1.04);box-shadow:0 8px 30px #0005;display:none}
#start-screen{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:#000;transition:opacity .35s}
#start-screen.hidden{opacity:0;pointer-events:none}
#start{border:1px solid #ffffffb8;border-radius:999px;background:transparent;color:#fff;padding:17px 42px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
#start:focus-visible,.tool:focus-visible{outline:2px solid #fff;outline-offset:4px}
#tools{position:absolute;z-index:5;right:20px;top:max(20px,env(safe-area-inset-top));display:flex;gap:9px}
.tool{width:42px;height:42px;border:1px solid #ffffff55;border-radius:50%;background:#0009;color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.tool.active{background:#fff;color:#000}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){#words{font-size:clamp(26px,7vw,38px)}#tools{right:14px}.tool{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){#words,#start-screen{transition:none}}
</style>
</head>
<body>
<main id="stage">
<div id="words" aria-live="polite"></div>
<canvas id="art"></canvas><canvas id="ink"></canvas>
<div id="tools" hidden>
<button class="tool" id="pen" aria-label="Pen tool" title="Pen tool"><svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 11-11a2.8 2.8 0 0 0-4-4l-11 11L4 20Z"/><path d="m14 6 4 4"/></svg></button>
<button class="tool" id="clear" aria-label="Clear drawings" title="Clear drawings"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</div>
<div id="tray" aria-label="Collected image objects"></div>
<img id="drag-ghost" alt="">
<div id="start-screen"><button id="start">Play</button></div>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const start=$('start'),screen=$('start-screen'),words=$('words'),tray=$('tray'),art=$('art'),ink=$('ink'),pen=$('pen'),clear=$('clear'),tools=$('tools'),ghost=$('drag-ghost');
const artCtx=art.getContext('2d'),inkCtx=ink.getContext('2d');
let recognition=null,stream=null,running=false,penOn=false,drawing=false,currentSentence='',sentenceTimer=0,dragState=null,usageCounter=0,searchQueue=[],searching=false;
const items=new Map(),stickers=[],strokes=[];
const ignored=new Set(('a an the and or but if then so of to in on at by for from with about as is are was were be been being am i you he she it we they them this that these those there here my your his her our their me us do does did can could will would should may might have has had not no yes oh um uh like just very really i think say said tell telling talking something anything everything every what which who when where why how its it\'s we\'re they\'re don\'t didn\'t cant can\'t wont won\'t').split(/\s+/));
const objectWords=new Set(('dog cat bird fish horse cow sheep rabbit mouse lion tiger bear elephant giraffe monkey frog turtle snake spider butterfly flower tree grass leaf apple banana orange strawberry grape watermelon pizza burger sandwich bread cake cookie chocolate milk water coffee tea car truck bus train airplane boat bicycle bike house home building school book phone computer laptop tablet television tv camera chair table desk lamp bed door window key bottle cup glass pencil pen paper bag box ball toy shoe hat shirt jacket pants dress watch clock guitar piano drum music sun moon star cloud rain snow fire ocean river mountain beach rock stone rose garden').split(/\s+/));
const colors=new Set(['blue','red','green','yellow','orange','purple','pink','black','white','silver','gold','teal','brown','gray','grey']);
function sizeCanvas(canvas,ctx){const dpr=Math.min(window.devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function resize(){sizeCanvas(art,artCtx);sizeCanvas(ink,inkCtx);drawStickers();redrawInk()}
window.addEventListener('resize',resize);
function sentenceDone(){if(!currentSentence)return;words.classList.remove('visible');words.classList.add('fading');currentSentence='';clearTimeout(sentenceTimer)}
function showWords(text,isFinal){const clean=text.trim();if(!clean)return;if(isFinal){currentSentence=(currentSentence+' '+clean).trim();words.textContent=currentSentence;words.classList.remove('fading');words.classList.add('visible');clearTimeout(sentenceTimer);sentenceTimer=setTimeout(sentenceDone,/[.!?]["')\]]*$/.test(clean)?1500:3000);detectItems(clean)}else{words.textContent=(currentSentence+' '+clean).trim();words.classList.remove('fading');words.classList.add('visible')}}
function detectItems(text){const tokens=text.toLowerCase().replace(/[^a-z0-9' -]/g,' ').split(/\s+/);for(const word of tokens){if(word.length<2||ignored.has(word)||(!objectWords.has(word)&&!colors.has(word)))continue;addItem(word)}}
function addItem(word){let item=items.get(word);if(item){item.count++;sortTray();return}item={word,count:1,url:null,element:null,usedAt:0};items.set(word,item);item.element=document.createElement('button');item.element.type='button';item.element.className='item loading';item.element.setAttribute('aria-label',word);item.element.title=word;item.element.addEventListener('pointerdown',e=>beginDrag(e,item));tray.appendChild(item.element);sortTray();searchQueue.push(item);processSearchQueue()}
function sortTray(){const ordered=[...items.values()].sort((a,b)=>b.usedAt-a.usedAt||b.count-a.count||a.word.localeCompare(b.word));for(const item of ordered)if(item.element)tray.appendChild(item.element)}
async function processSearchQueue(){if(searching)return;searching=true;while(searchQueue.length){const item=searchQueue.shift();if(!item||!items.has(item.word))continue;try{const endpoint='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('filetype:bitmap '+item.word)+'&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=260&format=json&origin=*';const response=await fetch(endpoint);if(!response.ok)throw Error('search failed');const data=await response.json();const page=Object.values(data.query?.pages||{})[0];const url=page?.imageinfo?.[0]?.thumburl||page?.imageinfo?.[0]?.url;if(!url)throw Error('no image');await loadItemImage(item,url)}catch(error){item.element.classList.remove('loading');item.element.classList.add('failed');item.element.replaceChildren()}await new Promise(resolve=>setTimeout(resolve,350))}searching=false}
function loadItemImage(item,url){return new Promise(resolve=>{const image=new Image();image.onload=()=>{item.url=url;item.element.replaceChildren(image);item.element.classList.remove('loading','failed');resolve()};image.onerror=()=>resolve();image.src=url})}
function beginDrag(event,item){if(event.button!==undefined&&event.button!==0)return;if(!item.url)return;dragState={item,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,active:false};window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',cancelDrag)}
function moveDrag(event){if(!dragState||event.pointerId!==dragState.pointerId)return;const dx=event.clientX-dragState.startX,dy=event.clientY-dragState.startY;if(!dragState.active){if(Math.hypot(dx,dy)<8)return;if(Math.abs(dx)>Math.abs(dy)*1.15)return;dragState.active=true;ghost.src=dragState.item.url;ghost.style.display='block';dragState.item.element.style.opacity='.35'}event.preventDefault();dragState.x=event.clientX;dragState.y=event.clientY;ghost.style.left=event.clientX+'px';ghost.style.top=event.clientY+'px'}
function endDrag(event){if(!dragState||event.pointerId!==dragState.pointerId)return;const state=dragState;if(state.active){const rect=art.getBoundingClientRect();if(event.clientX>=rect.left&&event.clientX<=rect.right&&event.clientY>=rect.top&&event.clientY<=rect.bottom){placeSticker(state.item,event.clientX-rect.left,event.clientY-rect.top)}}cleanupDrag()}
function cancelDrag(){cleanupDrag()}
function cleanupDrag(){if(dragState?.item?.element)dragState.item.element.style.opacity='';dragState=null;ghost.style.display='none';window.removeEventListener('pointermove',moveDrag);window.removeEventListener('pointerup',endDrag);window.removeEventListener('pointercancel',cancelDrag)}
function placeSticker(item,x,y){if(!item.url)return;const image=new Image();image.onload=()=>{stickers.push({img:image,x,y,w:Math.min(150,Math.max(90,art.clientWidth*.14)),h:Math.min(150,Math.max(90,art.clientWidth*.14))});drawStickers()};image.src=item.url;item.usedAt=++usageCounter;sortTray()}
function drawStickers(){artCtx.clearRect(0,0,art.clientWidth,art.clientHeight);for(const s of stickers)artCtx.drawImage(s.img,s.x-s.w/2,s.y-s.h/2,s.w,s.h)}
function redrawInk(){inkCtx.clearRect(0,0,ink.clientWidth,ink.clientHeight);inkCtx.strokeStyle='#fff';inkCtx.lineWidth=3;inkCtx.lineCap='round';inkCtx.lineJoin='round';for(const stroke of strokes){if(!stroke.length)continue;inkCtx.beginPath();inkCtx.moveTo(stroke[0].x,stroke[0].y);for(let i=1;i<stroke.length;i++)inkCtx.lineTo(stroke[i].x,stroke[i].y);inkCtx.stroke()}}
ink.addEventListener('pointerdown',event=>{if(!penOn)return;drawing=true;ink.setPointerCapture(event.pointerId);strokes.push([{x:event.offsetX,y:event.offsetY}]);redrawInk()});
ink.addEventListener('pointermove',event=>{if(!drawing)return;const stroke=strokes[strokes.length-1];stroke.push({x:event.offsetX,y:event.offsetY});redrawInk()});
function endDrawing(){drawing=false}ink.addEventListener('pointerup',endDrawing);ink.addEventListener('pointercancel',endDrawing);
pen.addEventListener('click',()=>{penOn=!penOn;pen.classList.toggle('active',penOn);ink.classList.toggle('drawing',penOn)});
clear.addEventListener('click',()=>{stickers.length=0;strokes.length=0;drawStickers();redrawInk()});
function setupRecognition(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)throw Error('Speech recognition is not supported in this browser.');recognition=new Speech();recognition.continuous=true;recognition.interimResults=true;recognition.lang=navigator.language||'en-US';recognition.onresult=event=>{let interim='';for(let i=event.resultIndex;i<event.results.length;i++){const result=event.results[i],transcript=result[0].transcript;if(result.isFinal)showWords(transcript,true);else interim+=transcript}if(interim)showWords(interim,false)};recognition.onerror=event=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(event.error))stopSession()};recognition.onend=()=>{if(running){try{recognition.start()}catch(error){setTimeout(()=>{if(running)try{recognition.start()}catch(_){stopSession()}},300)}}}}
function stopSession(){running=false;clearTimeout(sentenceTimer);try{recognition?.stop()}catch(error){}if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}tools.hidden=true;screen.classList.remove('hidden');start.disabled=false;words.classList.remove('visible','fading')}
start.addEventListener('click',async()=>{start.disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone access is unavailable in this browser.');stream=await navigator.mediaDevices.getUserMedia({audio:true});setupRecognition();running=true;recognition.start();screen.classList.add('hidden');tools.hidden=false;resize()}catch(error){running=false;if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}start.disabled=false;alert(error.message||'Microphone access is needed to start.')}});
window.addEventListener('pagehide',()=>{running=false;try{recognition?.stop()}catch(error){}stream?.getTracks().forEach(track=>track.stop())});
resize();
})();
</script>
</body>
</html>
