<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Voice · Combined</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#stage{position:fixed;inset:0;overflow:hidden;background:#000;isolation:isolate}.orb{position:absolute;left:50%;top:50%;width:clamp(160px,34vmin,290px);aspect-ratio:1;border-radius:50%;background:#f7f7f7;transform:translate(-50%,-50%) scale(1);z-index:3;will-change:transform;box-shadow:0 0 80px rgba(255,255,255,.055)}#flame{position:absolute;left:50%;top:50%;width:clamp(60px,13vmin,112px);aspect-ratio:1;border-radius:50%;background:#858585;transform:translate(-50%,-50%);z-index:1;will-change:left,top,transform,background;box-shadow:0 0 34px rgba(255,255,255,.035);transition:background .2s,box-shadow .2s}#particles{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.wave{position:absolute;left:50%;top:50%;width:min(76vw,calc(clamp(160px,34vmin,290px)*.82));height:clamp(100px,28vmin,230px);transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;gap:clamp(8px,3vw,24px);z-index:4;pointer-events:none}.dot{width:clamp(8px,2.4vmin,18px);height:5px;border-radius:99px;background:#050505;will-change:height;transition:height .07s linear}.controls{position:fixed;z-index:10;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:12px}.controls button{border:1px solid #303030;border-radius:99px;padding:12px 17px;background:rgba(12,12,12,.9);color:#eee;font:inherit;font-size:11px;white-space:nowrap;cursor:pointer}.controls button:hover{background:#1a1a1a}.status{position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#777;font-size:10px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}.status.live{color:#eee}#message{position:fixed;z-index:10;bottom:max(78px,calc(env(safe-area-inset-bottom) + 64px));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 34px));text-align:center;color:#777;font-size:11px;line-height:1.5;pointer-events:none}@media(prefers-reduced-motion:reduce){.orb,.dot,#flame{transition:none}}
</style>
</head>
<body>
<main id="stage" aria-label="Combined voice visualizer">
<canvas id="particles" aria-hidden="true"></canvas>
<div id="flame" aria-hidden="true"></div>
<div id="orb" class="orb" aria-hidden="true"></div>
<div id="wave" class="wave" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</main>
<div class="status" id="status">Microphone off</div>
<p id="message">Start the microphone to animate the orb, five-dot wave, and moving particle orb.</p>
<div class="controls"><button id="mic" type="button">Enable microphone</button></div>
<script>
(()=>{
const orb=document.getElementById('orb'),flame=document.getElementById('flame'),wave=document.getElementById('wave'),dots=[...document.querySelectorAll('.dot')],canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),mic=document.getElementById('mic'),status=document.getElementById('status'),message=document.getElementById('message');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let stream=null,audio=null,analyser=null,source=null,timeData=null,freqData=null,raf=0,listening=false,starting=false,level=0,pitch=.5,lastSpeech=0,nextParticle=0,particles=[],width=0,height=0,dpr=1,flameX=.5,flameY=.5;
function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function estimatePitch(data,sampleRate){let mean=0;for(let i=0;i<data.length;i++)mean+=(data[i]-128)/128;mean/=data.length;const samples=new Float32Array(data.length);let energy=0;for(let i=0;i<data.length;i++){samples[i]=(data[i]-128)/128-mean;energy+=samples[i]*samples[i]}if(Math.sqrt(energy/data.length)<.012)return null;const minLag=Math.max(25,Math.floor(sampleRate/430)),maxLag=Math.min(Math.floor(sampleRate/65),Math.floor(samples.length*.44)),limit=samples.length-maxLag;let best=0,bestCorr=0;for(let lag=minLag;lag<=maxLag;lag+=2){let cross=0,a2=0,b2=0;for(let i=0;i<limit;i+=3){const a=samples[i],b=samples[i+lag];cross+=a*b;a2+=a*a;b2+=b*b}const corr=cross/Math.sqrt(a2*b2||1);if(corr>bestCorr){bestCorr=corr;best=lag}}if(bestCorr<.36||!best)return null;const hz=sampleRate/best;if(hz<65||hz>430)return null;return clamp((Math.log(hz)-Math.log(80))/(Math.log(400)-Math.log(80)),0,1)}
function emitParticle(now){const size=flame.offsetWidth;particles.push({x:flameX*width+(Math.random()-.5)*size*.55,y:flameY*height-size*.35,vx:(Math.random()-.5)*.8,vy:-(.8+Math.random()*1.8),r:1+Math.random()*2.2,life:1,decay:.009+Math.random()*.013});if(particles.length>160)particles.shift();nextParticle=now+32}
function drawParticles(){ctx.clearRect(0,0,width,height);for(let i=particles.length-1;i>=0;i--){const p=particles[i];if(!reduce){p.x+=p.vx;p.y+=p.vy;p.life-=p.decay}if(p.life<=0||p.y<-20){particles.splice(i,1);continue}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+clamp(p.life,0,1)+')';ctx.fill()}}
function frame(now){if(!listening||!analyser)return;analyser.getByteTimeDomainData(timeData);let sum=0;for(let i=0;i<timeData.length;i++){const s=(timeData[i]-128)/128;sum+=s*s}const rms=Math.sqrt(sum/timeData.length),raw=clamp((rms-.007)*18*1.6,0,1);level+=(raw-level)*(raw>level?.2:.096);if(raw>.075)lastSpeech=now;const speaking=now-lastSpeech<155;
analyser.getByteFrequencyData(freqData);
orb.style.transform='translate(-50%,-50%) scale('+(1+level*.72).toFixed(3)+')';orb.style.boxShadow='0 0 '+(65+level*65).toFixed(0)+'px rgba(255,255,255,'+(.035+level*.075).toFixed(3)+')';
const nyquist=audio.sampleRate/2;for(let i=0;i<5;i++){const position=i/4,hz=65*Math.pow(Math.min(9000,audio.sampleRate*.46)/65,position),bin=clamp(Math.round(hz/nyquist*(freqData.length-1)),0,freqData.length-1),energy=(freqData[Math.max(0,bin-1)]+freqData[bin]+freqData[Math.min(freqData.length-1,bin+1)])/3,strength=Math.pow(clamp((energy-34)/170,0,1),.82);dots[i].style.height=(4+strength*Math.min(190,height*.27)).toFixed(1)+'px';dots[i].style.opacity=(.75+strength*.25).toFixed(2)}
if(speaking){const detected=estimatePitch(timeData,audio.sampleRate);if(detected!==null)pitch+=(detected-pitch)*.2;const targetX=clamp(.5+(pitch-.5)*.9,.08,.92),targetY=clamp(.5-level*.55,.13,.87);flameX+=(targetX-flameX)*.2;flameY+=(targetY-flameY)*.2;flame.style.left=(flameX*100)+'%';flame.style.top=(flameY*100)+'%';flame.style.background='#f8f8f8';flame.style.boxShadow='0 0 '+(28+level*45)+'px rgba(255,255,255,'+(.035+level*.08)+')';if(now>=nextParticle)emitParticle(now)}else{flameX+=(.5-flameX)*.055;flameY+=(.5-flameY)*.055;flame.style.left=(flameX*100)+'%';flame.style.top=(flameY*100)+'%';flame.style.background='#858585';flame.style.boxShadow='0 0 34px rgba(255,255,255,.035)'}
drawParticles();raf=requestAnimationFrame(frame)}
async function start(){if(starting||listening)return;starting=true;mic.disabled=true;message.textContent='Requesting microphone access…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Microphone access is unavailable in this browser. Open this page over HTTPS.');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Audio analysis is unavailable in this browser.');audio=new AC();if(audio.state==='suspended')await audio.resume();analyser=audio.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.72;source=audio.createMediaStreamSource(stream);source.connect(analyser);timeData=new Uint8Array(analyser.fftSize);freqData=new Uint8Array(analyser.frequencyBinCount);listening=true;lastSpeech=0;nextParticle=0;mic.textContent='Stop listening';status.textContent='Listening';status.classList.add('live');message.textContent='Audio is analysed locally to animate the visuals.';raf=requestAnimationFrame(frame)}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;message.textContent=e.message||'Could not start microphone. Check site permissions.';status.textContent='Microphone off'}finally{starting=false;mic.disabled=false}}
async function stop(){listening=false;if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(source)try{source.disconnect()}catch(e){}if(audio)try{await audio.close()}catch(e){}audio=null;analyser=null;source=null;timeData=null;freqData=null;level=0;particles=[];flameX=.5;flameY=.5;flame.style.left='50%';flame.style.top='50%';flame.style.background='#858585';flame.style.boxShadow='0 0 34px rgba(255,255,255,.035)';orb.style.transform='translate(-50%,-50%) scale(1)';dots.forEach(d=>{d.style.height='4px';d.style.opacity='.85'});drawParticles();mic.textContent='Enable microphone';status.textContent='Microphone off';status.classList.remove('live');message.textContent='Microphone off. Press the button to start again.'}
mic.addEventListener('click',()=>listening?stop():start());addEventListener('resize',resize,{passive:true});addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(audio)audio.close().catch(()=>{})});resize();drawParticles();
})();
</script>
</body>
</html>
