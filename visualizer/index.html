<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Voice · Combined</title>
<style>
:root{color-scheme:dark;--black:#000;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#stage,#stage *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;isolation:isolate}
#particles{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.orb{position:absolute;left:50%;top:50%;width:clamp(160px,34vmin,290px);aspect-ratio:1;border-radius:50%;background:var(--white);transform:translate3d(-50%,-50%,0) scale(1);z-index:3;will-change:transform}
.wave{position:absolute;left:50%;top:50%;width:clamp(130px,27.88vmin,238px);height:clamp(100px,28vmin,230px);transform:translate3d(-50%,-50%,0);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;gap:clamp(5px,1.7vmin,15px);z-index:4;pointer-events:none}
.dot{display:block;width:clamp(6px,1.4vmin,9px);height:clamp(6px,1.4vmin,9px);border-radius:999px;background:#000;will-change:height}
.controls{position:fixed;z-index:10;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center}
.controls button{border:2px solid #fff;border-radius:0;padding:12px 17px;background:#fff;color:#000;font:inherit;font-size:11px;font-weight:650;white-space:nowrap;cursor:pointer;transition:none}
.controls button:hover{background:#000;color:#fff;border-color:#fff}
.controls button:disabled{cursor:wait}
.status{position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#888;font-size:10px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap;z-index:10}
.status.live{color:#fff}
#message{position:fixed;z-index:10;bottom:max(78px,calc(env(safe-area-inset-bottom) + 64px));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 34px));margin:0;text-align:center;color:#777;font-size:11px;line-height:1.5;pointer-events:none}
#glow{position:absolute;left:50%;top:50%;width:clamp(220px,52vmin,440px);aspect-ratio:1;border-radius:50%;z-index:2;pointer-events:none;opacity:0;visibility:hidden;background:radial-gradient(circle,rgba(122,71,255,.18) 0%,rgba(73,100,255,.12) 38%,rgba(0,0,0,0) 72%);transform:translate3d(-50%,-50%,0);filter:blur(22px)}
#caption-layer{position:absolute;left:50%;top:50%;width:min(88vw,640px);transform:translate3d(-50%,-50%,0);z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center}
#caption-word{display:inline-block;max-width:100%;padding:.13em .27em;border-radius:2px;background:#fff;color:#000;font-size:clamp(25px,5.5vw,54px);font-weight:650;letter-spacing:-.045em;line-height:1.08;overflow-wrap:anywhere;opacity:0;transform:translateY(7px) scale(.98);will-change:opacity,transform}
#caption-word.active{animation:caption-in 200ms cubic-bezier(.2,.75,.25,1) both}
#export-panel{position:fixed;z-index:30;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:20px}
#export-panel[hidden]{display:none}
.export-card{width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
#export-title{margin:0;color:#fff;font-size:14px;font-weight:650;letter-spacing:.06em}
#export-status{margin:0;color:#aaa;font-size:12px;line-height:1.5}
#export-preview{display:block;width:100%;max-height:60vh;aspect-ratio:9/16;object-fit:contain;background:#000;border:1px solid #333}
.export-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.export-actions a,.export-actions button{border:1px solid #fff;border-radius:0;background:#fff;color:#000;padding:12px 15px;font:inherit;font-size:12px;font-weight:650;text-decoration:none;cursor:pointer}
.export-actions button{background:#000;color:#fff}
#export-panel button:focus-visible,#export-panel a:focus-visible{outline:2px solid #aaa;outline-offset:3px}
#stage.spotlight-mode #particles,#stage.spotlight-mode .wave{visibility:hidden}
#stage.spotlight-mode #orb{background:#000;transform:translate3d(-50%,-50%,0) scale(1);z-index:4}
#stage.spotlight-mode #glow{opacity:1;visibility:visible;animation:glow-drift 8s ease-in-out infinite}
body.spotlight-mode #status,body.spotlight-mode #message{visibility:hidden}
@keyframes glow-drift{0%,100%{filter:blur(22px) hue-rotate(-12deg);transform:translate3d(-50%,-50%,0) scale(.96)}50%{filter:blur(27px) hue-rotate(28deg);transform:translate3d(-50%,-50%,0) scale(1.04)}}
@keyframes caption-in{from{opacity:0;transform:translateY(7px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

</style>
</head>
<body>
<main id="stage" aria-label="Combined voice visualizer">
<canvas id="particles" aria-hidden="true"></canvas>
<div id="glow" aria-hidden="true"></div>
<div id="orb" class="orb" aria-hidden="true"></div>
<div id="wave" class="wave" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div id="caption-layer" aria-hidden="true"><span id="caption-word"></span></div>
</main>
<div class="status" id="status">Microphone off</div>
<p id="message">Start the microphone to animate the orb, five-dot wave, and rising pitch notes.</p>
<div class="controls"><button id="mic" type="button">Start recording</button></div>
<section id="export-panel" hidden aria-live="polite" aria-label="Recording export">
 <div class="export-card">
  <h2 id="export-title">Your video is ready</h2>
  <p id="export-status">Your recording has been processed on this device.</p>
  <video id="export-preview" controls playsinline preload="metadata"></video>
  <div class="export-actions">
   <a id="download-link" href="#" download="abyssalbar-recording.webm">Download video</a>
   <button id="close-export" type="button">Close</button>
  </div>
 </div>
</section>
<script>
(()=>{
'use strict';
const stage=document.getElementById('stage'),orb=document.getElementById('orb'),dots=[...document.querySelectorAll('.dot')],canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),mic=document.getElementById('mic'),status=document.getElementById('status'),message=document.getElementById('message'),captionWord=document.getElementById('caption-word'),exportPanel=document.getElementById('export-panel'),exportTitle=document.getElementById('export-title'),exportStatus=document.getElementById('export-status'),exportPreview=document.getElementById('export-preview'),downloadLink=document.getElementById('download-link'),closeExport=document.getElementById('close-export');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PITCH_INTERVAL=45,NOTE_RELEASE_MS=170,NOTE_DURATION=2400,NOTE_WIDTH=12,NOTE_MAX_COUNT=48,NOTE_PADDING=0.12;
let stream=null,audio=null,analyser=null,source=null,timeData=null,freqData=null,raf=0,listening=false,starting=false,stopping=false,level=0,pitchMinLog=null,pitchMaxLog=null,lastSpeech=0,lastPitchAt=0,lastValidPitchAt=0,candidateMidi=null,candidateCount=0,currentMidi=null,currentNote=null,notes=[],width=0,height=0,dpr=1,previousTime=0,dotDiameters=[];
let spotlightMode=false,recognition=null,recognitionBlocked=false,recognitionLoading=false,holdPointerId=null,wordQueue=[],activeWord=null,activeWordUntil=0,captionToken=0,finalSegments=new Map(),interimCounts=new Map();
let isRecording=false,audioRecorder=null,audioChunks=[],recordingStartedAt=0,lastRecordedFrameAt=-1,recordedFrames=[],recordedNotes=[],recordedSpeechSegments=[],exportObjectUrl=null,transcriberPromise=null;
const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
const pitchScratch=new Float32Array(2048);
const dotLevels=[0,0,0,0,0];
function clamp(v,min,max){return Math.min(max,Math.max(min,v))}
function resize(){
 width=innerWidth;height=innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
 canvas.style.width=width+'px';canvas.style.height=height+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 dotDiameters=dots.map(dot=>dot.getBoundingClientRect().width||8);
 drawNotes(performance.now());
}

// Reuse the pitch buffer so microphone analysis does not allocate on every check.
function estimatePitch(bytes,sampleRate){
 const data=pitchScratch;
 if(data.length!==bytes.length)return null;
 let mean=0;
 for(let i=0;i<bytes.length;i++)mean+=(bytes[i]-128)/128;
 mean/=bytes.length;
 let energy=0;
 for(let i=0;i<bytes.length;i++){data[i]=(bytes[i]-128)/128-mean;energy+=data[i]*data[i]}
 if(Math.sqrt(energy/data.length)<.012)return null;
 const minLag=Math.max(20,Math.floor(sampleRate/700));
 const maxLag=Math.min(Math.floor(sampleRate/75),Math.floor(data.length*.44));
 const limit=data.length-maxLag;
 let bestLag=0,bestCorrelation=0;
 for(let lag=minLag;lag<=maxLag;lag++){
  let cross=0,a2=0,b2=0;
  for(let i=0;i<limit;i+=3){
   const a=data[i],b=data[i+lag];
   cross+=a*b;a2+=a*a;b2+=b*b;
  }
  const correlation=cross/Math.sqrt((a2*b2)||1);
  if(correlation>bestCorrelation){bestCorrelation=correlation;bestLag=lag}
 }
 if(bestCorrelation<.36||!bestLag)return null;
 const hz=sampleRate/bestLag;
 return hz>=75&&hz<=700?hz:null;
}

function startNote(now,midi,pitchPosition){
 const x=clamp(pitchPosition,.025,.975);
 const recorded=isRecording?{midi,x,start:Math.max(0,(now-recordingStartedAt)/1000),end:null}:null;
 if(recorded)recordedNotes.push(recorded);
 const note={midi,x,startedAt:now,lastSeen:now,endedAt:null,recorded};
 notes.push(note);
 currentNote=note;currentMidi=midi;
 if(notes.length>NOTE_MAX_COUNT)notes.splice(0,notes.length-NOTE_MAX_COUNT);
}
function endCurrentNote(now){
 if(!currentNote)return;
 currentNote.endedAt=now;
 if(currentNote.recorded&&currentNote.recorded.end===null){
  currentNote.recorded.end=Math.max(currentNote.recorded.start,(now-recordingStartedAt)/1000);
 }
 currentNote=null;currentMidi=null;
}
function pitchToPosition(midiLog){
 if(pitchMinLog===null)pitchMinLog=midiLog;
 if(pitchMaxLog===null)pitchMaxLog=midiLog;
 pitchMinLog=Math.min(pitchMinLog,midiLog);
 pitchMaxLog=Math.max(pitchMaxLog,midiLog);
 const low=pitchMinLog-NOTE_PADDING,high=pitchMaxLog+NOTE_PADDING;
 return clamp((midiLog-low)/(high-low),.025,.975);
}
function drawCapsule(x,top,bottom,radius,alpha){
 ctx.fillStyle='rgba(255,255,255,'+alpha.toFixed(3)+')';
 if(bottom-top<=radius*2){
  ctx.beginPath();ctx.arc(x,(top+bottom)*.5,radius,0,Math.PI*2);ctx.fill();
  return;
 }
 ctx.beginPath();
 ctx.moveTo(x-radius,top+radius);
 ctx.arc(x,top+radius,radius,Math.PI,Math.PI*2);
 ctx.lineTo(x+radius,bottom-radius);
 ctx.arc(x,bottom-radius,radius,0,Math.PI);
 ctx.closePath();ctx.fill();
}
function drawNotes(now){
 ctx.clearRect(0,0,width,height);
 const speed=height/(NOTE_DURATION/1000);
 const maxLength=Math.max(NOTE_WIDTH,height*.9);
 for(let i=notes.length-1;i>=0;i--){
  const note=notes[i],ended=note.endedAt!==null;
  const duration=Math.max(0,(ended?note.endedAt:now)-note.startedAt);
  const length=clamp(duration*speed/1000,NOTE_WIDTH,maxLength);
  const rise=ended?(now-note.endedAt)*speed/1000:0;
  const top=height-length-rise,bottom=height-rise;
  const alpha=ended?clamp(1-(now-note.endedAt)/NOTE_DURATION,0,1):1;
  drawCapsule(note.x*width,top,bottom,NOTE_WIDTH*.5,alpha);
  if(ended&&(now-note.endedAt>=NOTE_DURATION||bottom < -NOTE_WIDTH)){
   notes.splice(i,1);
  }
 }
}

function updateWave(responsiveness,speaking){
 if(!freqData||!audio)return;
 const nyquist=audio.sampleRate/2,minHz=65,maxHz=Math.min(9000,audio.sampleRate*.46);
 for(let i=0;i<5;i++){
  const pos=i/4,hz=minHz*Math.pow(maxHz/minHz,pos),bin=clamp(Math.round(hz/nyquist*(freqData.length-1)),0,freqData.length-1);
  const energy=(freqData[Math.max(0,bin-1)]+freqData[bin]+freqData[Math.min(freqData.length-1,bin+1)])/3;
  const magnitude=speaking?Math.pow(clamp((energy-34)/170,0,1),.82):0;
  const changeRate=magnitude>dotLevels[i]?responsiveness*1.25:Math.max(.12,responsiveness*.78);
  dotLevels[i]+=(magnitude-dotLevels[i])*Math.min(.45,changeRate);
  // Height changes symmetrically around the grid's fixed vertical center.
  const diameter=dotDiameters[i]||8;
  const extension=Math.min(150,Math.max(80,height*.24));
  dots[i].style.height=(diameter+dotLevels[i]*extension)+'px';
 }
}
function frame(now){
 if(!listening||!analyser)return;
 const dt=previousTime?Math.min((now-previousTime)/16.667,2):1;
 previousTime=now;
 analyser.getByteTimeDomainData(timeData);
 let sum=0;
 for(let i=0;i<timeData.length;i++){const sample=(timeData[i]-128)/128;sum+=sample*sample}
 const rms=Math.sqrt(sum/timeData.length);
 const raw=clamp((rms-.007)*18*1.6,0,1);
 const attack=reducedMotion ? 0.09 : 0.13,release=reducedMotion ? 0.06 : 0.075;
 level+=(raw-level)*(raw>level?1-Math.pow(1-attack,dt):1-Math.pow(1-release,dt));
 if(raw>.075)lastSpeech=now;
 const speaking=now-lastSpeech<155;
 analyser.getByteFrequencyData(freqData);
 orb.style.transform=spotlightMode?'translate3d(-50%,-50%,0) scale(1)':'translate3d(-50%,-50%,0) scale('+(1+level*.72).toFixed(3)+')';
 updateWave(reducedMotion ? 0.08 : 0.16,speaking);

 if(now-lastPitchAt>=PITCH_INTERVAL){
  lastPitchAt=now;
  const detectedHz=estimatePitch(timeData,audio.sampleRate);
  if(detectedHz!==null){
   if(now-lastValidPitchAt>120){candidateMidi=null;candidateCount=0}
   lastValidPitchAt=now;
   const midi=Math.round(69+12*Math.log2(detectedHz/440));
   if(midi===candidateMidi)candidateCount++;
   else{candidateMidi=midi;candidateCount=1}

   // Require two consistent detections before changing the displayed note.
   if(candidateCount>=2){
    const midiLog=Math.log(440)+(midi-69)*Math.LN2/12;
    const x=pitchToPosition(midiLog);
    if(midi!==currentMidi){
     endCurrentNote(now);
     startNote(now,midi,x);
    }else if(currentNote){
     currentNote.lastSeen=now;
    }
   }
  }
 }

 // End a sustained capsule only after a brief gap, so tiny pitch-detection dropouts do not break it.
 if(currentNote&&now-currentNote.lastSeen>NOTE_RELEASE_MS){
  endCurrentNote(now);
  candidateMidi=null;candidateCount=0;
 }
 if(isRecording&&now-lastRecordedFrameAt>=33){
  recordedFrames.push({t:Math.max(0,(now-recordingStartedAt)/1000),level,wave:dotLevels.slice(),spot:spotlightMode});
  lastRecordedFrameAt=now;
 }
 updateCaption(now);
 drawNotes(now);
 raf=requestAnimationFrame(frame);
}

function transcriptWords(text){
 return String(text||'').trim().split(/\s+/).filter(word=>/[a-z0-9]/i.test(word));
}
function enqueueWords(words){
 for(const word of words){
  if(wordQueue.length<100)wordQueue.push(word);
 }
}
function handleSpeechResult(event,instance){
 if(recognition!==instance)return;
 for(let i=0;i<event.results.length;i++){
  const result=event.results[i],transcript=result[0]?.transcript||'',words=transcriptWords(transcript);
  if(result.isFinal){
   if(!finalSegments.has(i)){
    const alreadyQueued=interimCounts.get(i)||0;
    if(words.length>alreadyQueued&&spotlightMode)enqueueWords(words.slice(alreadyQueued));
    finalSegments.set(i,transcript);
    if(isRecording&&transcript.trim())recordedSpeechSegments.push({text:transcript,time:Math.max(0,(performance.now()-recordingStartedAt)/1000)});
    interimCounts.delete(i);
   }
  }else if(spotlightMode){
   const alreadyQueued=interimCounts.get(i)||0;
   if(words.length>alreadyQueued)enqueueWords(words.slice(alreadyQueued));
   interimCounts.set(i,Math.max(alreadyQueued,words.length));
  }
 } 
}
function showSpeechNotice(text){
 captionWord.classList.remove('active');
 captionWord.textContent=text;
 activeWord=null;
 const token=++captionToken;
 requestAnimationFrame(()=>{if(spotlightMode&&token===captionToken)captionWord.classList.add('active')});
}
function updateCaption(now){
 if(!spotlightMode)return;
 if(activeWord&&now>=activeWordUntil){
  activeWord=null;
  captionWord.classList.remove('active');
  captionWord.textContent='';
  captionToken++;
 }
 if(!activeWord&&wordQueue.length){
  activeWord=wordQueue.shift();
  captionWord.classList.remove('active');
  captionWord.textContent=activeWord;
  activeWordUntil=now+clamp(285+activeWord.length*15,320,480);
  const token=++captionToken;
  requestAnimationFrame(()=>{if(spotlightMode&&token===captionToken)captionWord.classList.add('active')});
 }
}
async function startWordRecognition(){
 if(recognition||recognitionLoading)return;
 if(!SpeechRecognitionAPI||typeof SpeechRecognitionAPI.available!=='function'||typeof SpeechRecognitionAPI.install!=='function'){
  recognitionBlocked=true;
  if(spotlightMode)showSpeechNotice('Live captions vary by browser; the final video transcribes locally');
  return false;
 }
 recognitionLoading=true;
 try{
  const options={langs:['en-US'],processLocally:true,quality:'dictation'};
  let availability=await SpeechRecognitionAPI.available(options);
  if(availability==='downloadable'||availability==='downloading'){
   if(spotlightMode)showSpeechNotice('Preparing offline speech recognition…');
   const installed=await SpeechRecognitionAPI.install(options);
   if(!installed)throw new Error('The offline language pack could not be installed.');
   availability=await SpeechRecognitionAPI.available(options);
  }
  if(availability!=='available')throw new Error('Offline speech recognition is not available in this browser.');
  if(!spotlightMode||!listening)return false;
  const instance=new SpeechRecognitionAPI();
  if(!('processLocally' in instance))throw new Error('This browser cannot guarantee local speech recognition.');
  instance.processLocally=true;
  recognitionBlocked=false;
  finalSegments=new Map();interimCounts=new Map();wordQueue=[];activeWord=null;
  recognition=instance;
  instance.lang='en-US';instance.continuous=true;instance.interimResults=true;instance.maxAlternatives=1;
  instance.onresult=event=>handleSpeechResult(event,instance);
  instance.onerror=event=>{
   if(recognition!==instance||!spotlightMode)return;
   if(event.error==='not-allowed'||event.error==='service-not-allowed'||event.error==='audio-capture'||event.error==='language-not-supported'){
    recognitionBlocked=true;
    showSpeechNotice('Live offline captions unavailable; final transcription stays on-device');
   }
  };
  instance.onend=()=>{
   if(recognition!==instance)return;
   if(spotlightMode&&listening&&!recognitionBlocked){try{instance.start()}catch(_){}}
   else if(recognition===instance)recognition=null;
  };
  instance.start();
  return true;
 }catch(_){
  recognitionBlocked=true;
  if(spotlightMode)showSpeechNotice('Live captions unavailable; final transcription stays on-device');
  if(recognition){const old=recognition;recognition=null;old.onresult=null;old.onerror=null;old.onend=null;try{old.abort()}catch(_){}}
  return false;
 }finally{recognitionLoading=false}
}
function enterSpotlight(){
 if(spotlightMode||!listening)return;
 spotlightMode=true;
 stage.classList.add('spotlight-mode');
 document.body.classList.add('spotlight-mode');
 captionWord.textContent='';
 captionWord.classList.remove('active');
 activeWord=null;activeWordUntil=0;captionToken++;
 startWordRecognition();
}
function leaveSpotlight(){
 if(!spotlightMode)return;
 spotlightMode=false;
 stage.classList.remove('spotlight-mode');
 document.body.classList.remove('spotlight-mode');
 wordQueue=[];activeWord=null;activeWordUntil=0;captionToken++;
 captionWord.textContent='';
 captionWord.classList.remove('active');
 if(recognition){
  const oldRecognition=recognition;
  recognition=null;
  oldRecognition.onresult=null;oldRecognition.onerror=null;oldRecognition.onend=null;
  try{oldRecognition.abort()}catch(_){}
 }
 recognitionBlocked=false;
 if(listening){status.textContent='Listening';status.classList.add('live')}
}


function chooseMimeType(types){
 if(!window.MediaRecorder)return '';
 if(typeof MediaRecorder.isTypeSupported!=='function')return '';
 return types.find(type=>MediaRecorder.isTypeSupported(type))||'';
}
function cleanNoteEvents(events,duration){
 const sorted=events.map(event=>({
  midi:event.midi,
  start:clamp(Number(event.start)||0,0,duration),
  end:clamp(Number.isFinite(event.end)?event.end:duration,0,duration)
 })).filter(event=>event.end-event.start>.055).sort((a,b)=>a.start-b.start);
 const merged=[];
 for(const event of sorted){
  const prev=merged[merged.length-1];
  if(prev&&prev.midi===event.midi&&event.start-prev.end<.22){
   prev.end=Math.max(prev.end,event.end);
  }else merged.push({...event});
 }
 if(!merged.length)return [];
 const minMidi=Math.min(...merged.map(event=>event.midi));
 const maxMidi=Math.max(...merged.map(event=>event.midi));
 for(const event of merged){
  event.x=maxMidi===minMidi?.5:.04+((event.midi-minMidi)/(maxMidi-minMidi))*.92;
 }
 return merged;
}
function fallbackWords(segments,duration){
 const out=[];
 for(const segment of segments){
  const words=transcriptWords(segment.text);
  const start=clamp(segment.time||0,0,duration);
  const span=Math.min(words.length*.27,Math.max(.2,duration-start));
  words.forEach((text,index)=>out.push({text,start:start+span*index/Math.max(1,words.length),end:start+span*(index+1)/Math.max(1,words.length)}));
 }
 return out.sort((a,b)=>a.start-b.start);
}
function wordsFromTranscript(result,duration){
 const words=[];
 if(Array.isArray(result?.chunks)){
  let cursor=0;
  for(const chunk of result.chunks){
   const tokens=transcriptWords(chunk.text);
   if(!tokens.length)continue;
   const rawTimes=chunk.timestamp;
   const hasStart=Array.isArray(rawTimes)&&Number.isFinite(rawTimes[0]);
   const hasEnd=Array.isArray(rawTimes)&&Number.isFinite(rawTimes[1]);
   const start=hasStart?clamp(rawTimes[0],0,duration):cursor;
   const end=hasEnd?clamp(rawTimes[1],start,duration):Math.min(duration,start+tokens.length*.26);
   const span=Math.max(0,end-start);
   tokens.forEach((text,index)=>words.push({
    text,
    start:start+span*index/tokens.length,
    end:start+span*(index+1)/tokens.length
   }));
   cursor=Math.max(cursor,end);
  }
 }
 if(!words.length&&result?.text){

function groupCaptionWords(words){

  if(!word.text)continue;

  const pause=previous?word.start-previous.end:0;
  if(current.length&&(pause>.62||/[.!?][\\"'”’)}\]]*$/.test(previous.text)||current.length>=9)){
   groups.push({start:current[0].start,end:current[current.length-1].end+.32,words:current});
   current=[];
  }
  current.push(word);

 if(current.length)groups.push({start:current[0].start,end:current[current.length-1].end+.32,words:current});

}
function resampleTo16k(buffer){
 const rate=16000,sourceRate=buffer.sampleRate,channels=[];

  const position=i*sourceRate/rate,index=Math.floor(position),mix=position-index;

   const a=channel[Math.min(index,channel.length-1)]||0;
   const b=channel[Math.min(index+1,channel.length-1)]||0;
   sample+=(a+(b-a)*mix)/channels.length;

}
async function getLocalTranscriber(){

  transcriberPromise=(async()=>{
   message.textContent='Loading the on-device speech model. The first download may be large…';
   const transformers=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');
   transformers.env.useBrowserCache=true;
   transformers.env.allowRemoteModels=true;
   if(transformers.env.backends?.onnx?.wasm)transformers.env.backends.onnx.wasm.numThreads=1;
   return transformers.pipeline('automatic-speech-recognition','onnx-community/whisper-tiny.en',{
    dtype:'q8',
    progress_callback:progress=>{
     if(progress&&progress.status==='progress'&&Number.isFinite(progress.loaded)&&Number.isFinite(progress.total)&&progress.total>0){
      message.textContent='Loading the local speech model: '+Math.round(progress.loaded/progress.total*100)+'%';
     }
    }
   });
  })().catch(error=>{transcriberPromise=null;throw error});
 }

}
async function transcribeOnDevice(audioBuffer){

 const mono=resampleTo16k(audioBuffer);
 return await transcriber(mono,{sampling_rate:16000,return_timestamps:'word',chunk_length_s:20,stride_length_s:3});
}
function recordedVisualAt(time,frames,indexRef){
 if(!frames.length)return {level:0,wave:[0,0,0,0,0],spot:false};
 while(indexRef.index+1<frames.length&&frames[indexRef.index+1].t<=time)indexRef.index++;
 const first=frames[indexRef.index]||frames[0],next=frames[Math.min(indexRef.index+1,frames.length-1)]||first;
 const mix=next.t>first.t?clamp((time-first.t)/(next.t-first.t),0,1):0;
 return {
  level:first.level+(next.level-first.level)*mix,
  wave:first.wave.map((value,i)=>value+((next.wave[i]??value)-value)*mix),
  spot:first.spot

}
function drawExportCapsule(context,x,top,bottom,radius,alpha){
 if(bottom<top){const swap=top;top=bottom;bottom=swap}
 context.fillStyle='rgba(255,255,255,'+clamp(alpha,0,1).toFixed(3)+')';
 if(bottom-top<=radius*2){
  context.beginPath();context.arc(x,(top+bottom)/2,radius,0,Math.PI*2);context.fill();return;
 }
 context.beginPath();
 context.moveTo(x-radius,top+radius);
 context.arc(x,top+radius,radius,Math.PI,Math.PI*2);
 context.lineTo(x+radius,bottom-radius);
 context.arc(x,bottom-radius,radius,0,Math.PI);
 context.closePath();context.fill();
}
function drawCaptionGroup(context,group,time,cx,cy,maxWidth,canvasWidth){
 if(!group||!group.words.length)return;
 const fontSize=clamp(canvasWidth*.064,27,48),lineHeight=fontSize*1.32;
 context.font='650 '+fontSize+'px Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
 context.textBaseline='middle';
 const words=group.words.map((word,index)=>({...word,index,width:context.measureText(word.text).width}));
 const lines=[];let line=[];
 for(const word of words){
  const currentWidth=line.reduce((sum,item)=>sum+item.width,0)+Math.max(0,line.length)*fontSize*.34;
  if(line.length&&currentWidth+fontSize*.34+word.width>maxWidth){lines.push(line);line=[]}
  line.push(word);
 }
 if(line.length)lines.push(line);
 const totalHeight=lines.length*lineHeight,top=cy-totalHeight/2;
 lines.forEach((items,lineIndex)=>{
  const widthOfLine=items.reduce((sum,item)=>sum+item.width,0)+Math.max(0,items.length-1)*fontSize*.34;
  let x=cx-widthOfLine/2;
  const y=top+lineIndex*lineHeight;
  for(const item of items){
   const isActive=time>=item.start-.02&&time<Math.max(item.end,item.start+.10);
   if(isActive){
    const padX=fontSize*.12,padY=fontSize*.12;
    context.fillStyle='#fff';
    context.fillRect(x-padX,y-fontSize*.58-padY,item.width+padX*2,fontSize*1.16+padY*2);
    context.fillStyle='#000';
   }else context.fillStyle='#fff';
   context.fillText(item.text,x,y);
   x+=item.width+fontSize*.34;
  }

}
function drawExportFrame(context,canvasWidth,canvasHeight,time,visual,notesForExport,captionGroups,indexRef){
 context.fillStyle='#000';context.fillRect(0,0,canvasWidth,canvasHeight);
 const cx=canvasWidth/2,cy=canvasHeight/2;
 const scale=canvasWidth/Math.max(1,innerWidth),minViewport=Math.min(innerWidth,innerHeight);
 const orbBase=clamp(minViewport*.34,160,290)*scale;
 if(visual.spot){
  const blend=(Math.sin(time*.31)+1)/2;
  const r=125+30*blend,g=75+20*(1-blend),b=255;
  const ox=cx+Math.sin(time*.27)*orbBase*.16,oy=cy+Math.cos(time*.21)*orbBase*.13;
  const glow=context.createRadialGradient(ox,oy,2,cx,cy,orbBase*1.55);
  glow.addColorStop(0,'rgba('+r+','+g+','+b+',0.15)');
  glow.addColorStop(.48,'rgba(70,95,255,0.085)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  context.fillStyle=glow;context.beginPath();context.arc(cx,cy,orbBase*1.6,0,Math.PI*2);context.fill();
 }else{
  const speed=canvasHeight/(NOTE_DURATION/1000),radius=NOTE_WIDTH*scale/2;
  for(const note of notesForExport){
   if(time<note.start)continue;
   const sounding=time<=note.end;
   const activeDuration=sounding?time-note.start:note.end-note.start;
   const length=clamp(activeDuration*speed,NOTE_WIDTH*scale,canvasHeight*.9);
   const rise=sounding?0:(time-note.end)*speed;
   const alpha=sounding?1:clamp(1-(time-note.end)/(NOTE_DURATION/1000),0,1);
   if(alpha<=0)continue;
   drawExportCapsule(context,note.x*canvasWidth,canvasHeight-length-rise,canvasHeight-rise,radius,alpha);
  }
 }
 const orbRadius=orbBase*.5*(visual.spot?1:1+visual.level*.72);
 context.fillStyle=visual.spot?'#000':'#fff';
 context.beginPath();context.arc(cx,cy,orbRadius,0,Math.PI*2);context.fill();
 if(!visual.spot){
  const waveWidth=clamp(minViewport*.2788,130,238)*scale;
  const gap=clamp(minViewport*.017,5,15)*scale;
  const cell=(waveWidth-gap*4)/5;
  const baseDiameter=clamp(minViewport*.014,6,9)*scale;
  const extension=clamp(innerHeight*.24,80,150)*scale;
  for(let i=0;i<5;i++){
   const x=cx-waveWidth/2+cell/2+i*(cell+gap);
   const barHeight=baseDiameter+(visual.wave[i]||0)*extension;
   drawExportCapsule(context,x,cy-barHeight/2,cy+barHeight/2,baseDiameter/2,1);
  }
 }else{
  const group=captionGroups.find(item=>time>=item.start-.15&&time<=item.end);
  drawCaptionGroup(context,group,time,cx,cy,canvasWidth*.84,canvasWidth);

}
async function renderVideo(audioBuffer,cleanNotes,visualFrames,captionGroups){
 if(!window.MediaRecorder)throw new Error('This browser does not support video recording.');
 const exportCanvas=document.createElement('canvas');
 const portrait=innerHeight>=innerWidth;
 exportCanvas.width=portrait?720:1280;
 exportCanvas.height=portrait?1280:720;

 if(!exportCtx||!exportCanvas.captureStream)throw new Error('This browser cannot export canvas video.');

 let recorder;
 try{recorder=mime?new MediaRecorder(mixedStream,{mimeType:mime}):new MediaRecorder(mixedStream)}

 const chunks=[];
 let doneResolve,doneReject;

async function makeVideo(audioBlob){

 try{

 }catch(error){
  console.warn('Local transcription was unavailable; exporting without model-generated captions.',error);

 const captions=groupCaptionWords(words);
 const cleanedNotes=cleanNoteEvents(recordedNotes,audioBuffer.duration);

 downloadLink.download='abyssalbar-recording.'+extension;

async function start(){

  listening=true;level=0;pitchMinLog=null;pitchMaxLog=null;lastSpeech=0;lastPitchAt=0;lastValidPitchAt=0;candidateMidi=null;candidateCount=0;currentMidi=null;currentNote=null;previousTime=0;notes=[];dotLevels.fill(0);

async function stop(){
 if(stopping||!listening)return;

  recordedFrames.push({t:Math.max(0,(stopAt-recordingStartedAt)/1000),level,wave:dotLevels.slice(),spot:spotlightMode});
  lastRecordedFrameAt=stopAt;

     activeRecorder.addEventListener('stop',resolve,{once:true});

mic.addEventListener('click',()=>listening?stop():start());
closeExport.addEventListener('click',()=>{

stage.addEventListener('pointerdown',event=>{
