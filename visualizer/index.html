<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Voice · Combined</title>
<style>
:root{color-scheme:dark;--black:#000;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;isolation:isolate}
#particles{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#flame{position:absolute;left:50%;top:50%;width:clamp(60px,13vmin,112px);aspect-ratio:1;border-radius:50%;background:#fff;transform:translate3d(-50%,-50%,0);z-index:2;will-change:left,top}
.orb{position:absolute;left:50%;top:50%;width:clamp(160px,34vmin,290px);aspect-ratio:1;border-radius:50%;background:var(--white);transform:translate3d(-50%,-50%,0) scale(1);z-index:3;will-change:transform}
.wave{position:absolute;left:50%;top:50%;width:clamp(130px,27.88vmin,238px);height:clamp(100px,28vmin,230px);transform:translate3d(-50%,-50%,0);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center;gap:clamp(5px,1.7vmin,15px);z-index:4;pointer-events:none}
.dot{display:block;width:clamp(6px,1.4vmin,9px);height:clamp(6px,1.4vmin,9px);border-radius:999px;background:#000;will-change:height}
.controls{position:fixed;z-index:10;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center}
.controls button{border:2px solid #fff;border-radius:0;padding:12px 17px;background:#fff;color:#000;font:inherit;font-size:11px;font-weight:650;white-space:nowrap;cursor:pointer;transition:none}
.controls button:hover{background:#000;color:#fff;border-color:#fff}
.controls button:disabled{cursor:wait}
.status{position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#888;font-size:10px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap;z-index:10}
.status.live{color:#fff}
#message{position:fixed;z-index:10;bottom:max(78px,calc(env(safe-area-inset-bottom) + 64px));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 34px));margin:0;text-align:center;color:#777;font-size:11px;line-height:1.5;pointer-events:none}

</style>
</head>
<body>
<main id="stage" aria-label="Combined voice visualizer">
<canvas id="particles" aria-hidden="true"></canvas>
<div id="flame" aria-hidden="true"></div>
<div id="orb" class="orb" aria-hidden="true"></div>
<div id="wave" class="wave" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</main>
<div class="status" id="status">Microphone off</div>
<p id="message">Start the microphone to animate the orb, five-dot wave, and moving particle orb.</p>
<div class="controls"><button id="mic" type="button">Enable microphone</button></div>
<script>
(()=>{
'use strict';
const orb=document.getElementById('orb'),flame=document.getElementById('flame'),dots=[...document.querySelectorAll('.dot')],canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),mic=document.getElementById('mic'),status=document.getElementById('status'),message=document.getElementById('message');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TRAIL_INTERVAL=68,TRAIL_DURATION=1200;
let stream=null,audio=null,analyser=null,source=null,timeData=null,freqData=null,raf=0,listening=false,starting=false,stopping=false,level=0,pitch=.5,lastSpeech=0,lastPitchAt=0,nextCloneAt=0,trails=[],width=0,height=0,dpr=1,flameX=.5,flameY=.5,previousTime=0,flameDiameter=100;
const dotLevels=[0,0,0,0,0];
function clamp(v,min,max){return Math.min(max,Math.max(min,v))}
function resize(){width=innerWidth;height=innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);flameDiameter=flame.getBoundingClientRect().width||100;trails.length=0;drawTrails(performance.now())}
// Pitch estimator adapted from the original Pattern prototype.
function estimatePitch(bytes,sampleRate){
 const data=new Float32Array(bytes.length);let mean=0;
 for(let i=0;i<bytes.length;i++)mean+=(bytes[i]-128)/128;
 mean/=bytes.length;let energy=0;
 for(let i=0;i<bytes.length;i++){data[i]=(bytes[i]-128)/128-mean;energy+=data[i]*data[i]}
 if(Math.sqrt(energy/data.length)<.012)return null;
 const minLag=Math.max(20,Math.floor(sampleRate/700)),maxLag=Math.min(Math.floor(sampleRate/75),Math.floor(data.length*.44)),limit=data.length-maxLag;
 let bestLag=0,bestCorrelation=0;
 for(let lag=minLag;lag<=maxLag;lag++){let cross=0,a2=0,b2=0;for(let i=0;i<limit;i+=3){const a=data[i],b=data[i+lag];cross+=a*b;a2+=a*a;b2+=b*b}const correlation=cross/Math.sqrt((a2*b2)||1);if(correlation>bestCorrelation){bestCorrelation=correlation;bestLag=lag}}
 if(bestCorrelation<.36||!bestLag)return null;
 const hz=sampleRate/bestLag;if(hz<75||hz>700)return null;
 // Map a broader singing range logarithmically across the full screen.
 return clamp((Math.log(hz)-Math.log(75))/(Math.log(700)-Math.log(75)),0,1)
}
function emitTrail(now){trails.push({x:flameX*width,y:flameY*height,createdAt:now});if(trails.length>24)trails.shift();nextCloneAt=now+TRAIL_INTERVAL}
function drawTrails(now){
 ctx.clearRect(0,0,width,height);
 for(let i=trails.length-1;i>=0;i--){
  const t=trails[i],age=(now-t.createdAt)/TRAIL_DURATION;
  if(age>=1){trails.splice(i,1);continue}
  const rise=Math.max(90,flameDiameter*1.05)*age;
  const radius=flameDiameter*.5;
  const alpha=.92*(1-age);
  ctx.beginPath();ctx.arc(t.x,t.y-rise,radius,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,'+alpha.toFixed(3)+')';ctx.fill();
 }
}
function updateWave(responsiveness,speaking){
 if(!freqData||!audio)return;
 const nyquist=audio.sampleRate/2,minHz=65,maxHz=Math.min(9000,audio.sampleRate*.46);
 for(let i=0;i<5;i++){
  const pos=i/4,hz=minHz*Math.pow(maxHz/minHz,pos),bin=clamp(Math.round(hz/nyquist*(freqData.length-1)),0,freqData.length-1);
  const energy=(freqData[Math.max(0,bin-1)]+freqData[bin]+freqData[Math.min(freqData.length-1,bin+1)])/3;
  const magnitude=speaking?Math.pow(clamp((energy-34)/170,0,1),.82):0;
  const changeRate=magnitude>dotLevels[i]?responsiveness*1.25:Math.max(.12,responsiveness*.78);
  dotLevels[i]+=(magnitude-dotLevels[i])*Math.min(.45,changeRate);
  // Height changes symmetrically around the grid's fixed vertical center.
  const diameter=dots[i].getBoundingClientRect().width;
  const extension=Math.min(150,Math.max(80,height*.24));
  dots[i].style.height=(diameter+dotLevels[i]*extension)+'px';
 }
}
function frame(now){
 if(!listening||!analyser)return;
 const dt=previousTime?Math.min((now-previousTime)/16.667,2):1;previousTime=now;
 analyser.getByteTimeDomainData(timeData);let sum=0;
 for(let i=0;i<timeData.length;i++){const s=(timeData[i]-128)/128;sum+=s*s}
 const rms=Math.sqrt(sum/timeData.length),raw=clamp((rms-.007)*18*1.6,0,1);
 const attack=reducedMotion ? 0.09 : 0.18,release=reducedMotion ? 0.07 : 0.085;
 level+=(raw-level)*(raw>level?1-Math.pow(1-attack,dt):1-Math.pow(1-release,dt));
 if(raw>.075)lastSpeech=now;
 const speaking=now-lastSpeech<155;
 analyser.getByteFrequencyData(freqData);
 orb.style.transform='translate3d(-50%,-50%,0) scale('+(1+level*.72).toFixed(3)+')';
 updateWave(reducedMotion ? 0.08 : 0.16,speaking);
 const responsiveness=reducedMotion ? 0.07 : 0.13;
 if(speaking){
  if(now-lastPitchAt>=45){
   lastPitchAt=now;
   const detected=estimatePitch(timeData,audio.sampleRate);
   if(detected!==null)pitch+=(detected-pitch)*0.4;
  }
  // Pitch steers left/right; volume steers up/down, with generous safe margins.
  const targetX=clamp(.5+(pitch-.5)*2.0,.035,.965);
  const targetY=clamp(.5-level*.34,.16,.83);
  const move=1-Math.pow(1-(reducedMotion ? 0.12 : 0.34),dt);
  flameX+=(targetX-flameX)*move;flameY+=(targetY-flameY)*move;
  if(now>=nextCloneAt)emitTrail(now);
 }
 flame.style.background=speaking?'#fff':'#888';
 flame.style.left=(flameX*100).toFixed(3)+'%';flame.style.top=(flameY*100).toFixed(3)+'%';
 drawTrails(now);raf=requestAnimationFrame(frame)
}
async function start(){
 if(starting||listening||stopping)return;starting=true;mic.disabled=true;message.textContent='Requesting microphone access…';
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Microphone access is unavailable here. Open this page over HTTPS in a browser that supports microphone input.');
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Audio analysis is unavailable in this browser.');
  audio=new AC();if(audio.state==='suspended')await audio.resume();
  analyser=audio.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.72;
  source=audio.createMediaStreamSource(stream);source.connect(analyser);
  timeData=new Uint8Array(analyser.fftSize);freqData=new Uint8Array(analyser.frequencyBinCount);
  listening=true;level=0;pitch=.5;lastSpeech=0;lastPitchAt=0;nextCloneAt=0;previousTime=0;trails=[];dotLevels.fill(0);
  mic.textContent='Stop listening';status.textContent='Listening';status.classList.add('live');message.textContent='Audio is analysed locally to animate the visuals.';
  raf=requestAnimationFrame(frame)
 }catch(e){
  listening=false;if(raf)cancelAnimationFrame(raf);raf=0;
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  if(source)try{source.disconnect()}catch(_){}source=null;
  const failedAudio=audio;audio=null;analyser=null;timeData=null;freqData=null;
  if(failedAudio)try{await failedAudio.close()}catch(_){}
  message.textContent=e.message||'Could not start microphone. Check site permissions.';
  status.textContent='Microphone off';status.classList.remove('live');
}finally{starting=false;mic.disabled=false}
}
async function stop(){
 if(stopping)return;stopping=true;mic.disabled=true;
 listening=false;if(raf)cancelAnimationFrame(raf);raf=0;
 const activeStream=stream;stream=null;if(activeStream)activeStream.getTracks().forEach(t=>t.stop());
 if(source)try{source.disconnect()}catch(_){}source=null;
 const activeAudio=audio;audio=null;analyser=null;timeData=null;freqData=null;
 if(activeAudio)try{await activeAudio.close()}catch(_){}
 level=0;pitch=.5;lastSpeech=0;lastPitchAt=0;previousTime=0;trails=[];dotLevels.fill(0);
 flameX=.5;flameY=.5;flame.style.left='50%';flame.style.top='50%';
 orb.style.transform='translate3d(-50%,-50%,0) scale(1)';
 dots.forEach(d=>{d.style.height=''});
 drawTrails(performance.now());
 mic.textContent='Enable microphone';status.textContent='Microphone off';status.classList.remove('live');message.textContent='Microphone off. Press the button to start again.';
 stopping=false;mic.disabled=false;
}
mic.addEventListener('click',()=>listening?stop():start());
addEventListener('resize',resize,{passive:true});
addEventListener('pagehide',()=>{listening=false;if(raf)cancelAnimationFrame(raf);raf=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(source)try{source.disconnect()}catch(_){}source=null;if(audio)audio.close().catch(()=>{});audio=null});
resize();drawTrails(performance.now());
})();
</script>
</body>
</html>
