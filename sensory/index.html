<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020208">
<meta name="description" content="A generative neon sculpture. Tap to create a new dimension.">
<title>Sensory</title>
<style>
:root{color-scheme:dark;--a:#5ff9ff;--b:#a875ff;--c:#ff55c8;--haze:rgba(50,22,100,.23)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020208;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
#space{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,var(--haze),transparent 57%),radial-gradient(ellipse at 12% 85%,rgba(0,92,120,.09),transparent 42%),#020208}
.glow:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(2,2,8,.3) 77%,#020208 130%)}
#fallback{position:fixed;left:50%;top:50%;width:min(78vmin,580px);aspect-ratio:1;transform:translate(-50%,-50%);display:none;pointer-events:none;filter:drop-shadow(0 0 18px var(--a))}
.ring{position:absolute;inset:9%;border:2px solid var(--a);border-radius:50%;box-shadow:0 0 17px var(--a),inset 0 0 15px var(--a);animation:orbitA 9s linear infinite}
.ring:nth-child(2){inset:0 17%;border-color:var(--b);box-shadow:0 0 19px var(--b),inset 0 0 16px var(--b);animation:orbitB 12s linear infinite}
.ring:nth-child(3){inset:17% 0;border-color:var(--c);box-shadow:0 0 20px var(--c),inset 0 0 14px var(--c);animation:orbitC 10s linear infinite}
.ring:nth-child(4){inset:23%;border-width:1px;border-color:var(--a);animation:orbitD 7s linear infinite}
#fallback:after{content:"";position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle at 30% 25%,white 0,var(--a) 10%,var(--b) 38%,rgba(5,3,18,.9) 72%);box-shadow:0 0 38px var(--b),0 0 90px rgba(100,65,255,.25)}
body.no-gl #space{display:none}
body.no-gl #fallback{display:block}
.ripple{position:fixed;z-index:4;left:var(--x);top:var(--y);width:15px;height:15px;border:1px solid var(--a);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:.75;pointer-events:none;box-shadow:0 0 12px var(--a),inset 0 0 10px var(--b);animation:ripple .95s cubic-bezier(.12,.75,.22,1) forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(18);opacity:0}}
@keyframes orbitA{to{transform:rotateX(67deg) rotateY(31deg) rotateZ(360deg)}}
@keyframes orbitB{to{transform:rotateY(70deg) rotateZ(-360deg)}}
@keyframes orbitC{to{transform:rotateX(73deg) rotateZ(360deg)}}
@keyframes orbitD{to{transform:rotateX(40deg) rotateY(65deg) rotateZ(-360deg)}}
@media(prefers-reduced-motion:reduce){.ring{animation-duration:40s!important}.ripple{animation-duration:.2s!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<canvas id="space" aria-label="Animated three-dimensional neon sculpture. Tap anywhere to generate a new form." role="img"></canvas>
<div id="fallback" aria-hidden="true"><i class="ring"></i><i class="ring"></i><i class="ring"></i><i class="ring"></i></div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('space'),body=document.body,fallback=document.getElementById('fallback');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const palettes=[
 {a:'#5ff9ff',b:'#a875ff',c:'#ff55c8',haze:'rgba(50,22,100,.23)'},
 {a:'#b8ff64',b:'#37ffe0',c:'#6286ff',haze:'rgba(10,80,67,.22)'},
 {a:'#ffe178',b:'#ff62bd',c:'#9874ff',haze:'rgba(91,31,71,.23)'},
 {a:'#ff597e',b:'#ffbd62',c:'#59e8ff',haze:'rgba(108,27,40,.2)'},
 {a:'#77a4ff',b:'#b6a0ff',c:'#75fff0',haze:'rgba(38,36,115,.24)'},
 {a:'#f5f6ff',b:'#57d8ff',c:'#ff65b7',haze:'rgba(35,57,120,.21)'}

const random=(min,max)=>min+Math.random()*(max-min);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};

let paletteIndex=Math.floor(Math.random()*palettes.length),gl=null,raf=0,loop=null,render=null;
let dead=false,fromGeometry=null,toGeometry=null,morph=1,startedAt=0,impulse=0,nextChange=0,lastTime=500;

let meshBuffer=null,triBuffer=null,lineBuffer=null,starBuffer=null,triangleCount=0,lineCount=0;
let projection=null,sceneScale=1,pixelRatio=1;

function setPalette(index){
 paletteIndex=index;
 const p=palettes[index];
 document.documentElement.style.setProperty('--a',p.a);
 document.documentElement.style.setProperty('--b',p.b);
 document.documentElement.style.setProperty('--c',p.c);
 document.documentElement.style.setProperty('--haze',p.haze);
}
function rotate(v,r){
 let x=v[0],y=v[1],z=v[2],c=Math.cos(r[0]),s=Math.sin(r[0]);
 [y,z]=[y*c-z*s,y*s+z*c];c=Math.cos(r[1]);s=Math.sin(r[1]);
 [x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(r[2]);s=Math.sin(r[2]);
 return [x*c-y*s,x*s+y*c,z];
}
function mesh(v,tri,lines){return {v:v,tri:tri,lines:lines}}
function makeTorus(seg,sides,R,tube,warp,phase){
 const v=[],tri=[],lines=[];
 for(let i=0;i<=seg;i++){
  const u=i/seg*Math.PI*2,rr=R*(1+warp*Math.cos(u*3+phase));
  for(let j=0;j<=sides;j++){
   const w=j/sides*Math.PI*2,cw=Math.cos(w),sw=Math.sin(w);
   const nx=cw*Math.cos(u),ny=cw*Math.sin(u),nz=sw;
   v.push((rr+tube*cw)*Math.cos(u),(rr+tube*cw)*Math.sin(u),tube*sw,nx,ny,nz);
  }
 }
 for(let i=0;i<seg;i++)for(let j=0;j<sides;j++){
  const a=i*(sides+1)+j,b=(i+1)*(sides+1)+j,c=a+1,d=b+1;
  tri.push(a,b,c,c,b,d);lines.push(a,b,a,c);
 }
 return mesh(v,tri,lines);
}
function makeSphere(lat,lon,spike,phase){
 const v=[],tri=[],lines=[];
 for(let i=0;i<=lat;i++){
  const phi=i/lat*Math.PI;
  for(let j=0;j<=lon;j++){
   const theta=j/lon*Math.PI*2;
   const jag=1+spike*Math.pow(Math.abs(Math.sin(theta*3+phase)*Math.sin(phi*4+phase*.7)),5);
   const x=Math.sin(phi)*Math.cos(theta)*jag,y=Math.cos(phi)*jag,z=Math.sin(phi)*Math.sin(theta)*jag;
   const nx=Math.sin(phi)*Math.cos(theta),ny=Math.cos(phi),nz=Math.sin(phi)*Math.sin(theta);
   v.push(x,y,z,nx,ny,nz);
  }
 }
 for(let i=0;i<lat;i++)for(let j=0;j<lon;j++){
  const a=i*(lon+1)+j,b=a+lon+1,c=a+1,d=b+1;
  tri.push(a,b,c,c,b,d);lines.push(a,b,a,c);
 }
 return mesh(v,tri,lines);
}
function makeKnot(seg,sides,R,tube,depth,phase,twist){
 const v=[],tri=[],lines=[];
 for(let i=0;i<=seg;i++){
  const u=i/seg*Math.PI*2;
  const center=[R*Math.cos(u),R*.82*Math.sin(2*u+phase*.35),depth*Math.sin(3*u+phase)];
  const tangent=[-R*Math.sin(u),R*1.64*Math.cos(2*u+phase*.35),depth*3*Math.cos(3*u+phase)];
  const tl=Math.hypot(...tangent)||1,t=tangent.map(n=>n/tl);
  let side=[-t[1],t[0],0],sl=Math.hypot(...side);
  if(sl<.001){side=[1,0,0];sl=1}side=side.map(n=>n/sl);
  let normal=[t[1]*side[2]-t[2]*side[1],t[2]*side[0]-t[0]*side[2],t[0]*side[1]-t[1]*side[0]];
  const nl=Math.hypot(...normal)||1;normal=normal.map(n=>n/nl);
  for(let j=0;j<=sides;j++){
   const w=j/sides*Math.PI*2+u*twist,cw=Math.cos(w),sw=Math.sin(w);
   const nx=normal[0]*cw+side[0]*sw,ny=normal[1]*cw+side[1]*sw,nz=normal[2]*cw+side[2]*sw;
   v.push(center[0]+tube*nx,center[1]+tube*ny,center[2]+tube*nz,nx,ny,nz);
  }
 }
 for(let i=0;i<seg;i++)for(let j=0;j<sides;j++){
  const a=i*(sides+1)+j,b=(i+1)*(sides+1)+j,c=a+1,d=b+1;
  tri.push(a,b,c,c,b,d);lines.push(a,b,a,c);
 }

}
function buildScene(palette){
 const positions=[],normals=[],colors=[],triangles=[],lines=[];
 const ca=rgb(palette.a),cb=rgb(palette.b),cc=rgb(palette.c);
 function add(m,transform,phase,brightness){
  const offset=positions.length/3,r=transform.r,sc=transform.s,o=transform.o;
  for(let i=0;i<m.v.length;i+=6){
   const p=rotate([m.v[i]*sc,m.v[i+1]*sc,m.v[i+2]*sc],r);
   const n=rotate([m.v[i+3],m.v[i+4],m.v[i+5]],r);
   positions.push(p[0]+o[0],p[1]+o[1],p[2]+o[2]);
   const nl=Math.hypot(...n)||1;normals.push(n[0]/nl,n[1]/nl,n[2]/nl);
   const f=.5+.5*Math.sin(phase+p[0]*1.7+p[1]*1.45+p[2]*1.9);
   const c=f<.5?ca.map((x,k)=>mix(x,cb[k],f*2)):cb.map((x,k)=>mix(x,cc[k],(f-.5)*2));
   const boost=brightness*(.78+.22*Math.sin(phase+p[2]*1.4));
   colors.push(clamp(c[0]*boost,0,1),clamp(c[1]*boost,0,1),clamp(c[2]*boost,0,1));
  }
  for(const n of m.tri)triangles.push(n+offset);
  for(const n of m.lines)lines.push(n+offset);
 }
 const ang=()=>random(-Math.PI,Math.PI);
 add(makeSphere(20,28,random(.02,.17),random(0,6.28)),{s:random(.36,.57),r:[ang(),ang(),ang()],o:[0,0,0]},random(0,6.28),1.12);
 for(let i=0;i<6;i++){
  const form=makeTorus(64,8,random(.86,1.58),random(.012,.043),random(0,.11),random(0,6.28));
  add(form,{s:random(.72,1.18),r:[ang(),ang(),ang()],o:[random(-.13,.13),random(-.13,.13),random(-.13,.13)]},random(0,6.28),random(.72,1.13));
 }
 for(let i=0;i<2;i++){
  const form=makeKnot(92,6,random(.68,1.15),random(.014,.032),random(.18,.55),random(0,6.28),random(.6,2.4));
  add(form,{s:random(.8,1.13),r:[ang(),ang(),ang()],o:[random(-.08,.08),random(-.08,.08),random(-.08,.08)]},random(0,6.28),random(.8,1.2));
 }
 for(let i=0;i<2;i++){
  const a=random(0,Math.PI*2),rad=random(.78,1.42);
  add(makeSphere(20,28,random(0,.12),random(0,6.28)),{s:random(.105,.205),r:[ang(),ang(),ang()],o:[Math.cos(a)*rad,Math.sin(a)*rad*.82,random(-.85,.85)]},random(0,6.28),random(.82,1.22));
 }
 return {positions:new Float32Array(positions),normals:new Float32Array(normals),colors:new Float32Array(colors),triangles:new Uint16Array(triangles),lines:new Uint16Array(lines)};
}
function blendGeometry(a,b,t){
 const o={positions:new Float32Array(a.positions.length),normals:new Float32Array(a.normals.length),colors:new Float32Array(a.colors.length),triangles:a.triangles,lines:a.lines};
 for(let i=0;i<o.positions.length;i++){o.positions[i]=mix(a.positions[i],b.positions[i],t);o.normals[i]=mix(a.normals[i],b.normals[i],t);o.colors[i]=mix(a.colors[i],b.colors[i],t)}
 return o;
}
function packGeometry(a,b){
 const count=a.positions.length/3,data=new Float32Array(count*18);
 for(let i=0;i<count;i++){
  const v=i*3,o=i*18;
  data[o]=a.positions[v];data[o+1]=a.positions[v+1];data[o+2]=a.positions[v+2];
  data[o+3]=a.normals[v];data[o+4]=a.normals[v+1];data[o+5]=a.normals[v+2];
  data[o+6]=b.positions[v];data[o+7]=b.positions[v+1];data[o+8]=b.positions[v+2];
  data[o+9]=b.normals[v];data[o+10]=b.normals[v+1];data[o+11]=b.normals[v+2];
  data[o+12]=a.colors[v];data[o+13]=a.colors[v+1];data[o+14]=a.colors[v+2];
  data[o+15]=b.colors[v];data[o+16]=b.colors[v+1];data[o+17]=b.colors[v+2];
 }
 gl.bindBuffer(gl.ARRAY_BUFFER,meshBuffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,triBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,b.triangles,gl.STATIC_DRAW);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lineBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,b.lines,gl.STATIC_DRAW);
 triangleCount=b.triangles.length;lineCount=b.lines.length;
}
function blend(a,b,t){return a.map((v,i)=>mix(v,b[i],t))}
const vertexSource=[
'attribute vec3 aFromPos;','attribute vec3 aFromNormal;','attribute vec3 aToPos;','attribute vec3 aToNormal;','attribute vec3 aFromColor;','attribute vec3 aToColor;',
'uniform mat4 uProjection;','uniform float uTime;','uniform float uMorph;','uniform float uScale;','uniform vec3 uRotation;','uniform float uPulse;',
'varying vec3 vNormal;','varying vec3 vPosition;','varying vec3 vColor;',
'vec3 rx(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,p.y*c-p.z*s,p.y*s+p.z*c);}',
'vec3 ry(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x*c+p.z*s,p.y,-p.x*s+p.z*c);}',
'vec3 rz(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x*c-p.y*s,p.x*s+p.y*c,p.z);}',
'void main(){',
' vec3 p=mix(aFromPos,aToPos,uMorph);',
' vec3 n=normalize(mix(aFromNormal,aToNormal,uMorph));',
' float wave=sin(p.x*3.2+uTime*.78)*cos(p.y*3.6-uTime*.61)*.018;',
' p+=n*wave*(.55+uPulse*.85);',
' p=rz(ry(rx(p,uRotation.x),uRotation.y),uRotation.z)*uScale;',
' n=normalize(rz(ry(rx(n,uRotation.x),uRotation.y),uRotation.z));',
' p.z-=6.1;vPosition=p;vNormal=n;vColor=mix(aFromColor,aToColor,uMorph);',
' gl_Position=uProjection*vec4(p,1.0);','}'
].join('\n');
const fragmentSource=[
'precision mediump float;','uniform vec3 uColorA;','uniform vec3 uColorB;','uniform float uTime;','uniform float uPulse;','uniform float uWire;',
'varying vec3 vNormal;','varying vec3 vPosition;','varying vec3 vColor;',
'void main(){',' vec3 n=normalize(vNormal);vec3 viewDir=normalize(-vPosition);',
' vec3 lightDir=normalize(vec3(-.42,.58,.78));',
' float diffuse=.19+.81*max(dot(n,lightDir),0.0);',
' float rim=pow(1.0-max(dot(n,viewDir),0.0),2.15);',
' float glint=pow(max(dot(reflect(-lightDir,n),viewDir),0.0),16.0);',
' float bands=.5+.5*sin(vPosition.y*8.0+vPosition.x*3.0+uTime*1.15);',
' vec3 col=vColor*(.37+diffuse*.55+rim*1.25)+uColorB*(rim*.22+glint*.65)+uColorA*(bands*.045+uPulse*.025);',
' if(uWire>.5){col=mix(vColor,vec3(1.0),.18)+uColorA*(.10+rim*.14);}',
' float alpha=uWire>.5?.88:.54+rim*.18;gl_FragColor=vec4(col,alpha);','}'
].join('\n');
const starVertexSource=[
'attribute vec3 aPosition;','attribute float aHue;','attribute float aSize;',
'uniform mat4 uProjection;','uniform float uTime;','uniform float uPixelRatio;',
'varying float vHue;','varying float vGlow;',
'void main(){vec3 p=aPosition;p.z=-8.0-mod((-aPosition.z-8.0)+uTime*.15,29.0);',
' gl_Position=uProjection*vec4(p,1.0);gl_PointSize=clamp(aSize*uPixelRatio*(18.0/max(1.0,-p.z)),.6,3.6*uPixelRatio);',
' vHue=aHue;vGlow=.45+.55*sin(uTime*.9+aPosition.x*2.3+aPosition.y*3.2);}'
].join('\n');
const starFragmentSource=[
'precision mediump float;','uniform vec3 uColorA;','uniform vec3 uColorB;','varying float vHue;','varying float vGlow;',
'void main(){float r=length(gl_PointCoord-vec2(.5));float edge=1.0-smoothstep(.05,.5,r);',
' vec3 c=mix(uColorA,uColorB,vHue);gl_FragColor=vec4(c,edge*vGlow*.62);}'
].join('\n');
function compile(type,source){
 const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);
 if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){const msg=gl.getShaderInfoLog(sh)||'Shader compilation failed';gl.deleteShader(sh);throw new Error(msg)}
 return sh;
}
function program(vs,fs){
 const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p)||'Shader link failed');
 return p;
}
function perspective(fov,aspect,near,far){
 const f=1/Math.tan(fov/2),m=new Float32Array(16);
 m[0]=f/aspect;m[5]=f;m[10]=(far+near)/(near-far);m[11]=-1;m[14]=2*far*near/(near-far);return m;
}
function init(){

 if(!gl)throw new Error('WebGL unavailable');
 const mp=program(vertexSource,fragmentSource),sp=program(starVertexSource,starFragmentSource);
 const ml={
  p:gl.getAttribLocation(mp,'aFromPos'),n:gl.getAttribLocation(mp,'aFromNormal'),tp:gl.getAttribLocation(mp,'aToPos'),tn:gl.getAttribLocation(mp,'aToNormal'),c:gl.getAttribLocation(mp,'aFromColor'),tc:gl.getAttribLocation(mp,'aToColor'),
  proj:gl.getUniformLocation(mp,'uProjection'),time:gl.getUniformLocation(mp,'uTime'),morph:gl.getUniformLocation(mp,'uMorph'),scale:gl.getUniformLocation(mp,'uScale'),rot:gl.getUniformLocation(mp,'uRotation'),pulse:gl.getUniformLocation(mp,'uPulse'),wire:gl.getUniformLocation(mp,'uWire'),ca:gl.getUniformLocation(mp,'uColorA'),cb:gl.getUniformLocation(mp,'uColorB')
 };
 const sl={
  p:gl.getAttribLocation(sp,'aPosition'),h:gl.getAttribLocation(sp,'aHue'),s:gl.getAttribLocation(sp,'aSize'),proj:gl.getUniformLocation(sp,'uProjection'),time:gl.getUniformLocation(sp,'uTime'),ratio:gl.getUniformLocation(sp,'uPixelRatio'),ca:gl.getUniformLocation(sp,'uColorA'),cb:gl.getUniformLocation(sp,'uColorB')
 };
 meshBuffer=gl.createBuffer();triBuffer=gl.createBuffer();lineBuffer=gl.createBuffer();
 const stars=new Float32Array(360*5);
 for(let i=0;i<360;i++){const j=i*5;stars[j]=random(-15,15);stars[j+1]=random(-10,10);stars[j+2]=-8-random(0,28);stars[j+3]=Math.random();stars[j+4]=random(.7,2.4)}
 starBuffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,starBuffer);gl.bufferData(gl.ARRAY_BUFFER,stars,gl.STATIC_DRAW);
 gl.clearColor(0,0,0,0);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
 function resize(){
  const width=Math.max(1,innerWidth),height=Math.max(1,innerHeight);
  pixelRatio=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.round(width*pixelRatio);canvas.height=Math.round(height*pixelRatio);
  gl.viewport(0,0,canvas.width,canvas.height);
  projection=perspective(Math.PI/4,width/height,.1,60);
  sceneScale=Math.min(1.08,Math.max(.4,width/height*1.03));
  if(render&&(reducedMotion||!raf))render(lastTime);
 }
 function uniformsColor(loc,p){gl.uniform3fv(loc.ca,rgb(p.a));gl.uniform3fv(loc.cb,rgb(p.b))}
 function drawStars(t){

  gl.enableVertexAttribArray(sl.p);gl.vertexAttribPointer(sl.p,3,gl.FLOAT,false,20,0);
  gl.enableVertexAttribArray(sl.h);gl.vertexAttribPointer(sl.h,1,gl.FLOAT,false,20,12);

  gl.uniformMatrix4fv(sl.proj,false,projection);gl.uniform1f(sl.time,t*.001);gl.uniform1f(sl.ratio,pixelRatio);
  uniformsColor(sl,palettes[paletteIndex]);gl.disable(gl.DEPTH_TEST);gl.drawArrays(gl.POINTS,0,360);gl.enable(gl.DEPTH_TEST);
 }
 function bindMesh(){
  gl.bindBuffer(gl.ARRAY_BUFFER,meshBuffer);const stride=72;
  for(const [a,o] of [[ml.p,0],[ml.n,12],[ml.tp,24],[ml.tn,36],[ml.c,48],[ml.tc,60]]){gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,stride,o)}
 }
 function drawMesh(t,wire){
  gl.useProgram(mp);bindMesh();
  const seconds=t*.001;
  gl.uniformMatrix4fv(ml.proj,false,projection);gl.uniform1f(ml.time,seconds);gl.uniform1f(ml.morph,morph);gl.uniform1f(ml.scale,sceneScale);
  gl.uniform3f(ml.rot,.24+easedY*.24+Math.sin(seconds*.16)*.24,seconds*.19+easedX*.48,Math.sin(seconds*.13)*.21);
  gl.uniform1f(ml.pulse,impulse);gl.uniform1f(ml.wire,wire?1:0);uniformsColor(ml,palettes[paletteIndex]);
  if(wire){gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lineBuffer);gl.depthMask(false);gl.drawElements(gl.LINES,lineCount,gl.UNSIGNED_SHORT,0);gl.depthMask(true)}
  else{gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,triBuffer);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,1);gl.drawElements(gl.TRIANGLES,triangleCount,gl.UNSIGNED_SHORT,0);gl.disable(gl.POLYGON_OFFSET_FILL)}
 }
 function draw(t){
  if(dead||!gl)return;
  lastTime=t;morph=reducedMotion?1:smooth((t-startedAt)/1450);
  easedX+=(pointerX-easedX)*.035;easedY+=(pointerY-easedY)*.035;impulse*=.965;
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
  drawStars(t);drawMesh(t,false);drawMesh(t,true);
 }
 render=draw;loop=frame;
 function frame(now){
  if(dead||document.hidden)return;
  draw(now);
  if(now>=nextChange){newScene(false);nextChange=now+random(10500,18000)}
  raf=requestAnimationFrame(frame);
 }
 window.addEventListener('resize',resize,{passive:true});
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();dead=true;gl=null;if(raf)cancelAnimationFrame(raf);body.classList.add('no-gl')});
 resize();
}
function newScene(changePalette){
 if(changePalette){
  let next=paletteIndex;
  while(next===paletteIndex)next=Math.floor(Math.random()*palettes.length);
  setPalette(next);
 }
 const target=buildScene(palettes[paletteIndex]);
 if(fromGeometry&&toGeometry&&!reducedMotion){
  fromGeometry=blendGeometry(fromGeometry,toGeometry,morph);toGeometry=target;morph=0;startedAt=performance.now();
 }else{fromGeometry=target;toGeometry=target;morph=1;startedAt=performance.now()-1500}
 if(gl)packGeometry(fromGeometry,toGeometry);
 impulse=1;
 if(reducedMotion&&render)render(performance.now());
}
function ripple(x,y){
 const el=document.createElement('i');el.className='ripple';el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');
 document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function fallbackTap(){
 let next=paletteIndex;while(next===paletteIndex)next=Math.floor(Math.random()*palettes.length);
 setPalette(next);
 fallback.querySelectorAll('.ring').forEach(r=>{r.style.animationDuration=random(4.5,14)+'s';r.style.transform='rotateX('+random(25,85)+'deg) rotateY('+random(-75,75)+'deg)'});
 fallback.style.transform='translate(-50%,-50%) rotate('+random(-18,18)+'deg) scale('+random(.82,1.12)+')';
}
canvas.addEventListener('pointerdown',e=>{
 if(gl&&!dead)newScene(true);else fallbackTap();
 ripple(e.clientX,e.clientY);
 if(reducedMotion&&render)render(performance.now());
},{passive:true});
canvas.addEventListener('pointermove',e=>{
 pointerX=clamp(e.clientX/Math.max(1,innerWidth)*2-1,-1,1);
 pointerY=clamp(e.clientY/Math.max(1,innerHeight)*2-1,-1,1);
},{passive:true});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0}
 else if(gl&&!dead&&!reducedMotion&&loop){nextChange=performance.now()+random(8000,16000);raf=requestAnimationFrame(loop)}
});
try{
 setPalette(paletteIndex);
 init();
 fromGeometry=buildScene(palettes[paletteIndex]);toGeometry=fromGeometry;morph=1;startedAt=performance.now()-1500;
 packGeometry(fromGeometry,toGeometry);
 nextChange=performance.now()+random(9000,16000);
 if(reducedMotion)render(500);else raf=requestAnimationFrame(loop);
}catch(_){
 gl=null;body.classList.add('no-gl');setPalette(paletteIndex);
 setInterval(()=>{if(document.hidden)return;fallbackTap()},14000);
}
})();
</script>
