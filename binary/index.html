<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Binary File</title>
<style>
:root { color-scheme: dark; --black: #000; --white: #fff; }
* { box-sizing: border-box; }
html { background: var(--black); }
body {
    margin: 0; min-height: 100vh; min-height: 100dvh; padding: 20px;
    display: grid; place-items: center; overflow-x: hidden;
    background: var(--black); color: var(--white);
    font-family: system-ui, -apple-system, sans-serif;
}
main { width: min(88vw, 420px); text-align: center; animation: appear .8s cubic-bezier(.16, 1, .3, 1) both; }
h1 { margin: 0 0 22px; font-size: 15px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
textarea, select, button { font: inherit; }
textarea {
    display: block; width: 100%; min-height: 190px; resize: vertical; padding: 16px;
    border: 1px solid var(--white); border-radius: 12px; outline: none;
    background: var(--black); color: var(--white);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.7;
    transition: background .3s, color .3s, border-radius .4s;
}
textarea:focus { background: #101010; border-radius: 18px; }
textarea::placeholder { color: #777; }
.row { display: flex; gap: 9px; margin-top: 12px; }
select, .download {
    min-height: 44px; border: 1px solid var(--white); border-radius: 999px;
    background: transparent; color: var(--white); font-size: 12px;
    transition: background .3s, color .3s, transform .3s;
}
select { flex: 1; min-width: 0; padding: 0 15px; color-scheme: dark; }
.download { flex: 1; padding: 10px 18px; cursor: pointer; }
.download:hover:enabled { background: var(--white); color: var(--black); transform: translateY(-2px); }
.download:active:enabled { transform: scale(.96); }
.download:disabled { opacity: .35; cursor: default; }
select:focus-visible, textarea:focus-visible, .download:focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }
.status { min-height: 1.5em; margin: 15px 0 0; color: #aaa; font-size: 11px; letter-spacing: .08em; }
@keyframes appear {
    from { opacity: 0; transform: translateY(12px) scale(.97); filter: blur(8px); }
    to { opacity: 1; transform: none; filter: blur(0); }
}
@media (max-width: 380px) { main { width: min(88vw, 340px); } textarea { min-height: 165px; } }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main>
    <h1>Binary File</h1>
    <textarea id="binary-input" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Binary input" placeholder="Paste binary here..."></textarea>
    <div class="row">
        <select id="file-type" aria-label="File type">
            <option value="txt">TXT</option>
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
            <option value="pdf">PDF</option>
            <option value="mp3">MP3</option>
            <option value="mp4">MP4</option>
            <option value="zip">ZIP</option>
            <option value="bin">BIN</option>
        </select>
        <button class="download" id="download-button" type="button">DOWNLOAD</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">0 bits</p>
</main>
<script>
(() => {
    const binaryInput = document.getElementById("binary-input");
    const fileType = document.getElementById("file-type");
    const downloadButton = document.getElementById("download-button");
    const status = document.getElementById("status");
    function getBits() { return binaryInput.value.replace(/\s/g, ""); }
    function updateStatus() {
        const bits = getBits();
        const valid = /^[01]*$/.test(bits);
        const complete = bits.length > 0 && bits.length % 8 === 0;
        downloadButton.disabled = !valid || !complete;
        if (!bits.length) status.textContent = "0 bits";
        else if (!valid) status.textContent = "Only 0s and 1s are allowed";
        else if (!complete) status.textContent = `${bits.length} bits · needs ${8 - bits.length % 8} more`;
        else status.textContent = `${bits.length} bits · ${bits.length / 8} bytes`;
    }
    function downloadFile() {
        const bits = getBits();
        if (!/^[01]+$/.test(bits) || bits.length % 8 !== 0) return;
        const bytes = new Uint8Array(bits.length / 8);
        for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
        const blob = new Blob([bytes], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `download.${fileType.value}`;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
    }
    binaryInput.addEventListener("input", updateStatus);
    downloadButton.addEventListener("click", downloadFile);
    updateStatus();
})();
</script>
</body>
</html>
