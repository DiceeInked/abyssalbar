<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abyssal Bar</title><style>:root{--fg:#00ffc8;--line:rgba(0,255,200,.24)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}.app{position:fixed;inset:0;display:grid;place-items:center;padding:14px}.window{width:min(900px,94vw);height:min(720px,92vh);border:1px solid var(--line);background:#020806;display:flex;flex-direction:column}.title{padding:10px 14px;border-bottom:1px solid var(--line)}.out{flex:1;overflow:auto;padding:14px;line-height:1.5}.input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit}button{background:none;color:var(--fg);border:1px solid var(--line);padding:6px 10px;font:inherit;cursor:pointer}.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px)}</style></head><body><main class="app"><section class="window"><div class="title">Abyssal Bar Terminal <span>v2.27</span></div><div class="out" id="out"><p>--------------------------------</p><p>GOOGLE SITES EXTERNAL MODE</p><p>Commands open the corresponding Abyssal Bar page.</p><p>--------------------------------</p><p>/help</p></div><form class="input" id="form"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="Type /command..."><button>Enter</button></form></section></main><div class="scan"></div><script>
const SUPABASE_URL="PASTE_YOUR_SUPABASE_URL_HERE";
const SUPABASE_KEY="PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
const SITE_VERSION="2.27";
const EXTERNAL_SITE_URL="https://abyssalbar.vercel.app";
const routes={"/home":"/","/egg":"/egg","/egg 0":"/egg?mode=0","/etho":"/etho","/games":"/gametonics","/tetris":"/tetris"};
const out=document.getElementById("out");
function go(path){window.location.href=EXTERNAL_SITE_URL+path}
document.getElementById("form").onsubmit=e=>{e.preventDefault();const raw=document.getElementById("cmd").value.trim().toLowerCase();document.getElementById("cmd").value="";if(!raw)return;if(raw==="/help"){out.innerHTML+="<p>/home<br>/egg<br>/egg 0<br>/etho<br>/games<br>/tetris</p>";out.scrollTop=out.scrollHeight;return}if(routes[raw]){out.innerHTML+=`<p>&gt; ${raw}<br>OPENING ${routes[raw]}</p>`;out.scrollTop=out.scrollHeight;go(routes[raw]);return}out.innerHTML+=`<p>UNKNOWN COMMAND: ${raw.toUpperCase()}</p>`;out.scrollTop=out.scrollHeight};document.getElementById("cmd").focus();
</script></body></html>
