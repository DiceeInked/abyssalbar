const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
const SITE_VERSION = "2.27";
const EXTERNAL_SITE_URL = "https://abyssalbar.vercel.app";
const GAME_BUCKET = "gametonics";

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyssal Bar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#000;--fg:#00ffc8;--dim:#087c69;--danger:#ff4055;--panel:#020806;--line:rgba(0,255,200,.24)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow:hidden}button,input{font:inherit;color:inherit;background:none}button{cursor:pointer}.app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#000}.scan{position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);opacity:.45}.window{width:min(900px,94vw);height:min(720px,92vh);display:flex;flex-direction:column;border:1px solid var(--line);background:rgba(0,8,6,.96);box-shadow:0 0 30px rgba(0,255,200,.07);position:relative;z-index:2}.title{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}.output{flex:1;overflow:auto;padding:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.output::-webkit-scrollbar{width:8px}.output::-webkit-scrollbar-thumb{background:var(--dim)}.input{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:9px;align-items:center}.input input{min-width:0;flex:1;border:0;outline:0;background:transparent}.input button,.game{border:1px solid var(--line);padding:6px 10px}.input button:disabled{opacity:.4}.muted{opacity:.65}.danger{color:var(--danger)}.red{color:#ff4055}.choice{border:1px solid var(--line);padding:12px;margin:12px 0}.choice button{display:block;width:100%;text-align:left;border:0;padding:7px}.choice .sel{outline:1px solid var(--fg)}.games{display:grid;gap:12px}.game-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px}.game{text-align:left}.game:hover{background:rgba(0,255,200,.08)}.gameHost{position:absolute;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}.gameBar{height:40px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:6px 10px}.gameFrame{flex:1;border:0;width:100%;background:#000}.egg{font-size:8px;line-height:1.05;white-space:pre;overflow:hidden;height:100%}.center{display:grid;place-items:center;height:100%;padding:20px;text-align:center}.cassette{width:220px;height:120px;border:2px solid var(--fg);position:relative;display:grid;place-items:center;cursor:pointer;animation:float 2s ease-in-out infinite}.cassette:before,.cassette:after{content:"";position:absolute;width:35px;height:35px;border:2px solid var(--fg);border-radius:50%;top:42px}.cassette:before{left:25px}.cassette:after{right:25px}.slot{width:280px;height:32px;border:2px solid var(--fg);margin-top:25px}.boot{display:flex;flex-direction:column;align-items:center}.terminalSmall{margin-top:20px}.tetris{display:grid;grid-template-columns:repeat(10,22px);gap:1px;width:max-content;border:1px solid var(--line)}.cell{width:22px;height:22px;border:1px solid rgba(0,255,200,.18)}.filled{background:var(--fg)}@keyframes float{50%{transform:translateY(-8px)}}@media(max-width:600px){.window{width:96vw;height:94vh}.tetris{grid-template-columns:repeat(10,18px)}.cell{width:18px;height:18px}}
</style></head><body><div id="root"></div><div class="scan"></div>
<script>
const {createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_KEY);const root=document.getElementById('root');
const state={page:'home',input:'',messages:[],account:null,connected:false,output:[],games:[],search:'',eggZero:false,game:null,tetris:null,ethostage:0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lineWrap=(text,n=80)=>{let out=[],cur='';for(const w of String(text).split(' ')){if(w.length>n){if(cur)out.push(cur),cur='';for(let i=0;i<w.length;i+=n)out.push(w.slice(i,i+n));continue}const c=cur?cur+' '+w:w;if(c.length>n){out.push(cur);cur=w}else cur=c}if(cur)out.push(cur);return out.length?out:['']};
function shell(title,body,input=true){root.innerHTML=`<main class="app"><section class="window"><div class="title">${esc(title)} <span class="muted">v${SITE_VERSION}</span></div>${body}${input?`<form class="input" id="form"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="Type a message or /command..."><button>Enter</button></form>`:''}</section></main>`;if(input){const f=document.getElementById('form');document.getElementById('cmd').value=state.input;f.addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('cmd').value;state.input='';handle(v)});document.getElementById('cmd').focus()}}
function home(){state.page='home';const msgs=state.messages.map(m=>lineWrap(m.username+': '+m.message).map(x=>`<p>${esc(x)}</p>`).join('')).join('');const intro=!state.account?'<p>Type /sign up &lt;username&gt; &lt;password&gt; to create an account.</p>':'';shell('Abyssal Bar Terminal',`<div class="output" id="out"><p>--------------------------------</p><p>Account: ${esc(state.account?.username||'Not signed in')}</p><p>Connection status: ${state.connected?'Online':'Connecting...'}</p><p>--------------------------------</p>${intro}${state.output.map(x=>`<p>${esc(x)}</p>`).join('')}${msgs}</div>`);}
async function refreshMessages(){const {data,error}=await db.from('messages').select('id,username,message,created_at').order('created_at',{ascending:false}).limit(64);if(!error)state.messages=(data||[]).reverse();if(state.page==='home')home()}
async function auth(action,u,p){const rpc=action==='sign_up'?'create_account_session':'create_account_session';if(action==='sign_up'){const c=await db.rpc('create_account',{p_username:u,p_password:p});if(c.error){state.output=[c.error.message];return}}const r=await db.rpc(rpc,{p_username:u,p_password:p});if(r.error){state.output=[r.error.message];return}state.account={id:r.data.id,username:r.data.username};sessionStorage.setItem('abyssal_session_token',r.data.token);state.output=[action==='sign_up'?'Account created.':'Signed in.'];home()}
async function sendMessage(text){const token=sessionStorage.getItem('abyssal_session_token');if(!token){state.output=['Sign in required.'];home();return}const r=await db.rpc('send_account_message',{p_token:token,p_message:text});if(r.error)state.output=['Message error: '+r.error.message];await refreshMessages()}
async function handle(v){v=v.trim();if(!v)return;if(!v.startsWith('/')){await sendMessage(v);return}const p=v.split(/\s+/),c=p[0].toLowerCase(),a=p.slice(1);state.output=[];if(c==='/help')state.output=['Commands:','/help','/home','/sign up <username> <password>','/sign in <username> <password>','/sign out','/egg','/egg 0','/etho','/games','/tetris'];else if(c==='/home')home();else if(c==='/games')games();else if(c==='/egg')egg(a[0]==='0');else if(c==='/tetris')tetris();else if(c==='/etho')etho();else if(c==='/sign'){if(a[0]==='out'){sessionStorage.removeItem('abyssal_session_token');state.account=null;state.output=['Signed out.'];home()}else if((a[0]==='up'||a[0]==='in')&&a.length===3)await auth(a[0]==='up'?'sign_up':'sign_in',a[1],a[2]);else state.output=['Usage: /sign up <username> <password> or /sign in <username> <password>']}else if(c==='/clear'){state.output=[];home()}else state.output=['Unknown command. Type /help.'];if(state.page==='home')home()}
async function games(){state.page='games';shell('GameTonics',`<div class="output"><p id="gameStatus">Loading GameTonics...</p><div class="games" id="gameList"></div></div><div class="input"><span>&gt;</span><input id="gameSearch" placeholder="Search games..." autocomplete="off"></div>`,false);const {data,error}=await db.storage.from(GAME_BUCKET).list('',{limit:1000,sortBy:{column:'name',order:'asc'}});if(error){document.getElementById('gameStatus').textContent='Unable to load the GameTonics library.';return}state.games=(data||[]).filter(x=>x.name&&!x.name.startsWith('.')&&x.id===null).map(x=>x.name);renderGames();document.getElementById('gameSearch').addEventListener('input',e=>{state.search=e.target.value;renderGames()})}
function renderGames(){const q=state.search.toLowerCase();const list=state.games.filter(x=>x.toLowerCase().includes(q));document.getElementById('gameStatus').textContent=list.length+' '+(list.length===1?'game':'games')+' found.';document.getElementById('gameList').innerHTML=list.map(n=>`<button class="game" data-game="${esc(n)}">${esc(n)}</button>`).join('');document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game))}
function openGame(name){const url=SUPABASE_URL.replace(/\/$/,'')+'/storage/v1/object/public/'+GAME_BUCKET+'/'+name.split('/').map(encodeURIComponent).join('/')+'/index.html';state.game=name;root.innerHTML=`<div class="gameHost"><div class="gameBar"><button id="back">← Back</button><span>${esc(name)}</span></div><iframe class="gameFrame" sandbox="allow-scripts allow-forms allow-pointer-lock" src="${url}"></iframe></div>`;document.getElementById('back').onclick=games}
function egg(zero){state.page='egg';let lines=Array.from({length:180},()=>makeEggLine(zero));shell('Egg',`<div class="output egg" id="egg">${lines.map(esc).join('<br>')}</div>`,false);const timer=setInterval(()=>{if(state.page!=='egg'){clearInterval(timer);return}const el=document.getElementById('egg');if(!el)return;const n=Array.from({length:12},()=>makeEggLine(zero));el.innerHTML=(el.innerHTML.split('<br>').slice(12).concat(n.map(esc))).join('<br>')},45)}
const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-/\\[]{}()<>:;,.=+*#@$%&?!|~^';function makeEggLine(z){const n=z?256:16+Math.floor(Math.random()*241);let s='';for(let i=0;i<n;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
function etho(){state.page='etho';let stage=state.ethostage;const responses=['IT STARTED WITH A GIRL WHO COULD MAKE WINTER LISTEN.\n\nNEXT INPUT: /SWORD','THE BLADE DID NOT CUT THEM.\n\nNEXT INPUT: /1225','I REMEMBER THE NUMBER.\n\nNEXT INPUT: /LAKE','THE LAKE DOESN\'T FREEZE WHEN SHE LOOKS AT IT.\n\nNEXT INPUT: /ECHO','THE ECHO IS NOT DESS.\n\nGO DEEPER: /DESS'];shell('ECHO TERMINAL',`<div class="output"><p>CONNECTION: UNSTABLE</p><p>TYPE /HELP TO BEGIN.</p><p class="muted">ETHO standalone Google Sites mode</p></div>`);const f=document.getElementById('form');f.onsubmit=e=>{e.preventDefault();const v=document.getElementById('cmd').value.trim().toLowerCase();document.getElementById('cmd').value='';if(v==='/home'){home();return}if(v==='/reset'){state.ethostage=0;etho();return}if(v==='/help'){state.output=['/HELP','/GIRL','/SWORD','/1225','/LAKE','/ECHO','/DESS','/RESET'];ethoOut();return}const cmds=['/girl','/sword','/1225','/lake','/echo'];if(cmds[stage]===v){state.ethostage=Math.min(4,stage+1);state.output=[responses[stage]];ethoOut()}else if(v==='/dess'&&state.ethostage>=4){dess()}else{state.output=['UNKNOWN COMMAND: '+v.toUpperCase()];ethoOut()}}}
function ethoOut(){document.querySelector('.output').innerHTML=state.output.map(x=>`<p>${esc(x)}</p>`).join('');}
function dess(){state.page='dess';shell('LAKE.EXE - SYSTEM ERROR','<div class="output" id="errors"></div>',false);let i=0;const t=setInterval(()=>{if(state.page!=='dess'){clearInterval(t);return}const e=document.getElementById('errors');if(!e)return;for(let n=0;n<5;n++)e.innerHTML+=`<div class="choice"><b>${esc(['FATAL ERROR','MEMORY ACCESS VIOLATION','THE WATER IS LISTENING','UNKNOWN ERROR'][Math.floor(Math.random()*4)])}</b><p>AN UNEXPECTED ERROR HAS OCCURRED.</p><button onclick="this.parentElement.remove()">OK</button></div>`;i+=5;if(i>60)clearInterval(t)},100)}
function tetris(){state.page='tetris';const W=10,H=20;let board=Array.from({length:H},()=>Array(W).fill(0));let piece={x:4,y:0,w:2,h:2};function draw(){shell('TETRIS',`<div class="output"><div class="tetris" id="tb">${board.flatMap((r,y)=>r.map((c,x)=>`<div class="cell ${c?'filled':''}"></div>`)).join('')}</div><p>← → Move · ↓ Drop · Space Hard drop · R Restart</p><p>Press /home to return.</p></div>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();home()};document.onkeydown=e=>{if(state.page!=='tetris')return;if([' ','ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')piece.x=Math.max(0,piece.x-1);if(e.key==='ArrowRight')piece.x=Math.min(W-piece.w,piece.x+1);if(e.key==='ArrowDown')piece.y=Math.min(H-piece.h,piece.y+1);if(e.key===' ')piece.y=H-piece.h;draw()}}draw()}
(async()=>{const token=sessionStorage.getItem('abyssal_session_token');if(token){const r=await db.rpc('get_session_account',{p_token:token});if(!r.error&&r.data)state.account=r.data}const ch=db.channel('google-sites-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>refreshMessages()).subscribe(s=>{state.connected=s==='SUBSCRIBED';if(state.connected)refreshMessages()});window.addEventListener('beforeunload',()=>db.removeChannel(ch));home()})();
</script></body></html>
