<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyssal Bar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--fg:#00ffc8;--dim:#087c69;--line:rgba(0,255,200,.24);--danger:#ff4055}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}button,input{font:inherit;color:inherit;background:none}button{cursor:pointer}.app{position:fixed;inset:0;display:grid;place-items:center;padding:14px;background:#000}.scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px)}.window{width:min(900px,94vw);height:min(720px,92vh);display:flex;flex-direction:column;border:1px solid var(--line);background:#020806;box-shadow:0 0 30px rgba(0,255,200,.07)}.title{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}.version{opacity:.6}.output{flex:1;overflow:auto;padding:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.output::-webkit-scrollbar{width:8px}.output::-webkit-scrollbar-thumb{background:var(--dim)}.input{display:flex;gap:9px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}.input input{min-width:0;flex:1;border:0;outline:0}.input button,.game{border:1px solid var(--line);padding:6px 10px}.muted{opacity:.6}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px}.game{text-align:left}.game:hover{background:rgba(0,255,200,.08)}.gameHost{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}.gameBar{height:40px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:6px 10px}.gameFrame{flex:1;border:0;width:100%;background:#000}.egg{font-size:8px;line-height:1.05;white-space:pre;overflow:hidden}.choice{border:1px solid var(--line);padding:10px;margin:10px 0}.tetris{display:grid;grid-template-columns:repeat(10,22px);gap:1px;width:max-content;border:1px solid var(--line)}.cell{width:22px;height:22px;border:1px solid rgba(0,255,200,.18)}.filled{background:var(--fg)}.cassette{width:220px;height:120px;border:2px solid var(--fg);position:relative;display:grid;place-items:center;cursor:pointer}.cassette:before,.cassette:after{content:"";position:absolute;top:42px;width:34px;height:34px;border:2px solid var(--fg);border-radius:50%}.cassette:before{left:24px}.cassette:after{right:24px}.slot{width:280px;height:32px;border:2px solid var(--fg);margin-top:22px}.center{display:grid;place-items:center;height:100%;text-align:center}@media(max-width:600px){.window{width:96vw;height:94vh}.tetris{grid-template-columns:repeat(10,18px)}.cell{width:18px;height:18px}}
</style>
</head>
<body><div id="root"></div><div class="scan"></div>
<script>
const SUPABASE_URL="PASTE_YOUR_SUPABASE_URL_HERE";
const SUPABASE_KEY="PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
const SITE_VERSION="2.27";
const GAME_BUCKET="gametonics";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),root=document.getElementById("root");
const S={page:"home",messages:[],account:null,connected:false,output:[],games:[],search:"",stage:0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const wrap=(text,n=80)=>{const out=[];let cur="";for(const word of String(text).split(" ")){if(word.length>n){if(cur)out.push(cur),cur="";for(let i=0;i<word.length;i+=n)out.push(word.slice(i,i+n));continue}const next=cur?cur+" "+word:word;if(next.length>n){out.push(cur);cur=word}else cur=next}if(cur)out.push(cur);return out.length?out:[""]};
function shell(title,body,withInput=true){root.innerHTML=`<main class="app"><section class="window"><div class="title">${esc(title)} <span class="version">v${SITE_VERSION}</span></div>${body}${withInput?'<form class="input" id="form"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="Type a message or /command..."><button>Enter</button></form>':''}</section></main>`;if(withInput){const f=document.getElementById("form");f.onsubmit=e=>{e.preventDefault();handle(document.getElementById("cmd").value)};document.getElementById("cmd").focus()}}
function home(){S.page="home";const msgs=S.messages.map(m=>wrap(`${m.username}: ${m.message}`).map(x=>`<p>${esc(x)}</p>`).join("")).join("");const intro=S.account?"":"<p>Type /sign up &lt;username&gt; &lt;password&gt; to create an account.</p>";shell("Abyssal Bar Terminal",`<div class="output"><p>--------------------------------</p><p>Account: ${esc(S.account?.username||"Not signed in")}</p><p>Connection status: ${S.connected?"Online":"Connecting..."}</p><p>--------------------------------</p>${intro}${S.output.map(x=>`<p>${esc(x)}</p>`).join("")}${msgs}</div>`)}
async function loadMessages(){const r=await db.from("messages").select("id,username,message,created_at").order("created_at",{ascending:false}).limit(64);if(!r.error)S.messages=(r.data||[]).reverse();if(S.page==="home")home()}
async function auth(action,u,p){if(action==="up"){const c=await db.rpc("create_account",{p_username:u,p_password:p});if(c.error){S.output=[c.error.message];home();return}}const r=await db.rpc("create_account_session",{p_username:u,p_password:p});if(r.error){S.output=[r.error.message];home();return}S.account={id:r.data.id,username:r.data.username};sessionStorage.setItem("abyssal_session_token",r.data.token);S.output=[action==="up"?"Account created.":"Signed in."];home()}
async function sendMessage(text){const token=sessionStorage.getItem("abyssal_session_token");if(!token){S.output=["Sign in required."];home();return}const r=await db.rpc("send_account_message",{p_token:token,p_message:text});if(r.error)S.output=["Message error: "+r.error.message];await loadMessages()}
async function handle(value){const v=value.trim();if(!v)return;if(!v.startsWith("/")){await sendMessage(v);return}const p=v.split(/\s+/),c=p[0].toLowerCase(),a=p.slice(1);S.output=[];if(c==="/help")S.output=["Commands:","/help","/home","/sign up <username> <password>","/sign in <username> <password>","/sign out","/egg","/egg 0","/etho","/games","/tetris"];else if(c==="/home")home();else if(c==="/clear")home();else if(c==="/games")games();else if(c==="/egg")egg(a[0]==="0");else if(c==="/etho")etho();else if(c==="/tetris")tetris();else if(c==="/sign"){if(a[0]==="out"){sessionStorage.removeItem("abyssal_session_token");S.account=null;S.output=["Signed out."];home()}else if((a[0]==="up"||a[0]==="in")&&a.length===3)await auth(a[0],a[1],a[2]);else S.output=["Usage: /sign up <username> <password> or /sign in <username> <password>"];if(S.page==="home")home()}else S.output=["Unknown command. Type /help."];if(S.page==="home"&&!c==="/sign")home()}
async function games(){S.page="games";shell("GameTonics",'<div class="output"><p id="status">Loading GameTonics...</p><div id="list" class="games"></div></div><div class="input"><span>&gt;</span><input id="search" placeholder="Search games..." autocomplete="off"></div>',false);const r=await db.storage.from(GAME_BUCKET).list("",{limit:1000,sortBy:{column:"name",order:"asc"}});if(r.error){document.getElementById("status").textContent="Unable to load the GameTonics library.";return}S.games=(r.data||[]).filter(x=>x.name&&!x.name.startsWith(".")&&x.id===null).map(x=>x.name);renderGames();document.getElementById("search").oninput=e=>{S.search=e.target.value.toLowerCase();renderGames()}}
function renderGames(){const list=S.games.filter(x=>x.toLowerCase().includes(S.search));document.getElementById("status").textContent=`${list.length} ${list.length===1?"game":"games"} found.`;document.getElementById("list").innerHTML=list.map(n=>`<button class="game" data-game="${esc(n)}">${esc(n)}</button>`).join("");document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>openGame(b.dataset.game))}
function openGame(name){const url=`${SUPABASE_URL.replace(/\/$/,"")}/storage/v1/object/public/${GAME_BUCKET}/${name.split("/").map(encodeURIComponent).join("/")}/index.html`;root.innerHTML=`<div class="gameHost"><div class="gameBar"><button id="back">← Back</button><span>${esc(name)}</span></div><iframe class="gameFrame" title="${esc(name)}" sandbox="allow-scripts allow-forms allow-pointer-lock" src="${url}"></iframe></div>`;document.getElementById("back").onclick=games}
const EGG_CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-/\\[]{}()<>:;,.=+*#@$%&?!|~^";function eggLine(zero){const n=zero?256:16+Math.floor(Math.random()*241);let s="";for(let i=0;i<n;i++)s+=EGG_CHARS[Math.floor(Math.random()*EGG_CHARS.length)];return s}function egg(zero){S.page="egg";shell("Egg",`<div class="output egg" id="egg">${Array.from({length:180},()=>esc(eggLine(zero))).join("<br>")}</div>`,false);const timer=setInterval(()=>{if(S.page!=="egg"){clearInterval(timer);return}const el=document.getElementById("egg");if(el)el.innerHTML=el.innerHTML.split("<br>").slice(12).concat(Array.from({length:12},()=>esc(eggLine(zero)))).join("<br>")},45)}
const ETHO=["IT STARTED WITH A GIRL WHO COULD MAKE WINTER LISTEN.\n\nNEXT INPUT: /SWORD","THE BLADE DID NOT CUT THEM.\n\nNEXT INPUT: /1225","I REMEMBER THE NUMBER.\n\nNEXT INPUT: /LAKE","THE LAKE DOESN'T FREEZE WHEN SHE LOOKS AT IT.\n\nNEXT INPUT: /ECHO","THE ECHO IS NOT DESS.\n\nGO DEEPER: /DESS"];function etho(){S.page="etho";shell("ECHO TERMINAL",'<div class="output"><p>CONNECTION: UNSTABLE</p><p>TYPE /HELP TO BEGIN.</p></div>');document.getElementById("form").onsubmit=e=>{e.preventDefault();const v=document.getElementById("cmd").value.trim().toLowerCase();const cmds=["/girl","/sword","/1225","/lake","/echo"];if(v==="/home")return home();if(v==="/reset"){S.stage=0;return etho()}if(v==="/help"){S.output=["/HELP","/GIRL","/SWORD","/1225","/LAKE","/ECHO","/DESS","/RESET"];return ethoOut()}if(cmds[S.stage]===v){S.output=[ETHO[S.stage]];S.stage=Math.min(4,S.stage+1);return ethoOut()}if(v==="/dess"&&S.stage>=4)return dess();S.output=[`UNKNOWN COMMAND: ${v.toUpperCase()}`];ethoOut()}}
function ethoOut(){document.querySelector(".output").innerHTML=S.output.map(x=>`<p>${esc(x)}</p>`).join("")}
function dess(){S.page="dess";shell("LAKE.EXE - SYSTEM ERROR",'<div class="output" id="errors"></div>',false);const timer=setInterval(()=>{if(S.page!=="dess"){clearInterval(timer);return}const e=document.getElementById("errors");if(!e)return;for(let i=0;i<5;i++)e.innerHTML+=`<div class="choice"><b>${esc(["FATAL ERROR","MEMORY ACCESS VIOLATION","THE WATER IS LISTENING","UNKNOWN ERROR"][Math.floor(Math.random()*4)])}</b><p>AN UNEXPECTED ERROR HAS OCCURRED.</p><button onclick="this.parentElement.remove()">OK</button></div>`},120)}
function tetris(){S.page="tetris";const W=10,H=20;let board=Array.from({length:H},()=>Array(W).fill(0)),x=4,y=0;function draw(){shell("TETRIS",`<div class="output"><div class="tetris">${board.flatMap(r=>r.map(c=>`<div class="cell ${c?"filled":""}"></div>`)).join("")}</div><p>← → Move · ↓ Drop · Space Hard drop · R Restart</p><p>/home returns home.</p></div>`);document.getElementById("form").onsubmit=e=>{e.preventDefault();home()};document.onkeydown=e=>{if(S.page!=="tetris")return;if([" ","ArrowLeft","ArrowRight","ArrowDown","ArrowUp"].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft")x=Math.max(0,x-1);if(e.key==="ArrowRight")x=Math.min(W-2,x+1);if(e.key==="ArrowDown")y=Math.min(H-2,y+1);if(e.key===" ")y=H-2;draw()} }draw()}
(async()=>{const token=sessionStorage.getItem("abyssal_session_token");if(token){const r=await db.rpc("get_session_account",{p_token:token});if(!r.error&&r.data)S.account=r.data}db.channel("google-sites-chat").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},loadMessages).subscribe(status=>{S.connected=status==="SUBSCRIBED";if(S.page==="home")home()});home()})();
</script></body></html>
