<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyssal Bar</title>
<style>
:root{--fg:#00ffc8;--dim:#087c69;--line:rgba(0,255,200,.24);--bg:#020806;--danger:#ff4055}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
body{min-height:100%}button,input{font:inherit;color:inherit}button{cursor:pointer;background:none}button:disabled{opacity:.45;cursor:not-allowed}
.app{position:fixed;inset:0;display:grid;place-items:center;padding:12px;background:#000}.scan{position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px)}
.window{width:min(900px,96vw);height:min(720px,94vh);display:flex;flex-direction:column;border:1px solid var(--line);background:var(--bg);box-shadow:0 0 30px rgba(0,255,200,.07);overflow:hidden}.title{flex:none;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}.version{opacity:.6}
.output{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.output p{margin:0 0 8px}.output::-webkit-scrollbar{width:8px}.output::-webkit-scrollbar-thumb{background:var(--dim)}
.input{flex:none;display:flex;gap:9px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}.input input{min-width:0;flex:1;border:0;outline:0;background:transparent}.input button,.game,.back{border:1px solid var(--line);padding:6px 10px}.input button:hover,.game:hover,.back:hover{background:rgba(0,255,200,.08)}
.status{opacity:.65}.error{color:var(--danger)}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px}.game{text-align:left}.game small{display:block;opacity:.55;margin-top:3px}.gameHost{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}.gameBar{height:42px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:6px 10px}.gameFrame{flex:1;min-height:0;border:0;width:100%;background:#000}
.egg{font-size:8px;line-height:1.05;white-space:pre;overflow:hidden}.choice{border:1px solid var(--line);padding:10px;margin:10px 0}.center{display:grid;place-items:center;height:100%;text-align:center}.cassetteWrap{display:grid;place-items:center;gap:18px;height:100%}.cassette{width:220px;height:120px;border:2px solid var(--fg);position:relative;display:grid;place-items:center;cursor:pointer}.cassette:before,.cassette:after{content:"";position:absolute;top:42px;width:34px;height:34px;border:2px solid var(--fg);border-radius:50%}.cassette:before{left:24px}.cassette:after{right:24px}.slot{width:280px;height:32px;border:2px solid var(--fg);margin-top:22px}
.tetris{display:grid;grid-template-columns:repeat(10,22px);gap:1px;width:max-content;border:1px solid var(--line)}.cell{width:22px;height:22px;border:1px solid rgba(0,255,200,.18)}.filled{background:var(--fg)}
@media(max-width:600px){.window{width:97vw;height:95vh}.tetris{grid-template-columns:repeat(10,18px)}.cell{width:18px;height:18px}}
</style>
</head>
<body>
<div id="root"></div><div class="scan"></div>
<script>
/* Paste your Supabase values here. The page renders even if Supabase cannot load. */
const SUPABASE_URL="PASTE_YOUR_SUPABASE_URL_HERE";
const SUPABASE_KEY="PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
const SITE_VERSION="2.28";
const GAME_BUCKET="gametonics";
const MAX_MESSAGES=64;
const MESSAGE_LINE_LENGTH=80;
const root=document.getElementById("root");
const S={page:"home",messages:[],account:null,connected:false,output:[],games:[],search:"",stage:0,gameName:""};
let db=null,channel=null,eggTimer=null,errorTimer=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const wrap=(text,n=MESSAGE_LINE_LENGTH)=>{const out=[];let line="";for(const word of String(text).split(/\s+/)){if(!word)continue;if(word.length>n){if(line)out.push(line),line="";for(let i=0;i<word.length;i+=n)out.push(word.slice(i,i+n));continue}const next=line?line+" "+word:word;if(next.length>n){if(line)out.push(line);line=word}else line=next}if(line)out.push(line);return out.length?out:[""]};
function stopTimers(){if(eggTimer){clearInterval(eggTimer);eggTimer=null}if(errorTimer){clearInterval(errorTimer);errorTimer=null}}
function shell(title,body,input=true){stopTimers();root.innerHTML=`<main class="app"><section class="window"><div class="title">${esc(title)} <span class="version">v${SITE_VERSION}</span></div>${body}${input?'<form class="input" id="form"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="Type a message or /command..."><button type="submit">Enter</button></form>':''}</section></main>`;if(input){document.getElementById("form").onsubmit=e=>{e.preventDefault();handle(document.getElementById("cmd").value)};document.getElementById("cmd").focus()}}
function renderHome(){S.page="home";const messages=S.messages.map(m=>wrap(`${m.username}: ${m.message}`).map(x=>`<p>${esc(x)}</p>`).join("")).join("");const intro=S.account?"":'<p>Type /sign up &lt;username&gt; &lt;password&gt; to create an account.</p>';shell("Abyssal Bar Terminal",`<div class="output"><p>--------------------------------</p><p>Account: ${esc(S.account?.username||"Not signed in")}</p><p>Connection status: ${S.connected?"Online":"Offline / standalone mode"}</p><p>--------------------------------</p>${intro}${S.output.map(x=>`<p>${esc(x)}</p>`).join("")}${messages}</div>`)}
async function loadMessages(){if(!db)return;try{const r=await db.from("messages").select("id,username,message,created_at").order("created_at",{ascending:false}).limit(MAX_MESSAGES);if(!r.error)S.messages=(r.data||[]).reverse();if(S.page==="home")renderHome()}catch(e){console.warn("Message load failed",e)}}
async function setupSupabase(){if(!SUPABASE_URL||SUPABASE_URL.startsWith("PASTE_")||!SUPABASE_KEY||SUPABASE_KEY.startsWith("PASTE_")){S.connected=false;renderHome();return}try{await loadSupabaseScript();db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const token=sessionStorage.getItem("abyssal_session_token");if(token){const r=await db.rpc("get_session_account",{p_token:token});if(!r.error&&r.data)S.account=r.data}channel=db.channel("google-sites-chat").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},()=>void loadMessages());channel.subscribe(status=>{S.connected=status==="SUBSCRIBED";if(status==="SUBSCRIBED")void loadMessages();if(S.page==="home")renderHome()});await loadMessages();if(S.page==="home")renderHome()}catch(e){console.warn("Supabase unavailable",e);S.connected=false;renderHome()}}
function loadSupabaseScript(){return new Promise((resolve,reject)=>{if(window.supabase)return resolve();const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=resolve;s.onerror=()=>reject(new Error("Supabase library could not load"));document.head.appendChild(s)})}
async function sendMessage(text){if(!db){S.output=["Supabase is not configured in this Google Sites copy."];renderHome();return}const token=sessionStorage.getItem("abyssal_session_token");if(!token){S.output=["Sign in required."];renderHome();return}const r=await db.rpc("send_account_message",{p_token:token,p_message:text});if(r.error)S.output=["Message error: "+r.error.message];await loadMessages()}
async function auth(action,u,p){if(!db){S.output=["Supabase is not configured."];renderHome();return}const rpc=action==="up"?"create_account":"create_account_session";const args=action==="up"?{p_username:u,p_password:p}:{p_username:u,p_password:p};const r=await db.rpc(rpc,args);if(r.error){S.output=[r.error.message];renderHome();return}if(action==="up"){const s=await db.rpc("create_account_session",args);if(s.error){S.output=[s.error.message];renderHome();return}S.account={id:s.data.id,username:s.data.username};sessionStorage.setItem("abyssal_session_token",s.data.token)}else{S.account={id:r.data.id,username:r.data.username};sessionStorage.setItem("abyssal_session_token",r.data.token)}S.output=[action==="up"?"Account created.":"Signed in."];renderHome()}
async function handle(value){const v=value.trim();if(!v)return;if(!v.startsWith("/")){await sendMessage(v);return}const p=v.split(/\s+/),c=p[0].toLowerCase(),a=p.slice(1);S.output=[];if(c==="/help"){S.output=["Commands:","/help","/home","/sign up <username> <password>","/sign in <username> <password>","/sign out","/egg","/egg 0","/etho","/games","/tetris"];renderHome();return}if(c==="/home"){renderHome();return}if(c==="/clear"){S.output=[];renderHome();return}if(c==="/games"){await games();return}if(c==="/egg"){if(a.length===0||a.length===1&&a[0]==="0")egg(a[0]==="0");else{S.output=["Usage: /egg or /egg 0"];renderHome()}return}if(c==="/etho"){etho();return}if(c==="/tetris"){tetris();return}if(c==="/sign"){if(a[0]==="out"){sessionStorage.removeItem("abyssal_session_token");S.account=null;S.output=["Signed out."];renderHome();return}if((a[0]==="up"||a[0]==="in")&&a.length===3){await auth(a[0],a[1],a[2]);return}S.output=["Usage: /sign up <username> <password> or /sign in <username> <password>"];renderHome();return}S.output=["Unknown command. Type /help."];renderHome()}
async function games(){S.page="games";shell("GameTonics",'<div class="output"><p id="status">Loading GameTonics...</p><div id="list" class="games"></div></div><div class="input"><span>&gt;</span><input id="search" placeholder="Search games..." autocomplete="off"></div>',false);const search=document.getElementById("search");search.oninput=()=>{S.search=search.value.toLowerCase();renderGames()};if(!db){document.getElementById("status").textContent="Supabase is not configured.";return}const r=await db.storage.from(GAME_BUCKET).list("",{limit:1000,sortBy:{column:"name",order:"asc"}});if(r.error){document.getElementById("status").textContent="Unable to load GameTonics.";return}S.games=(r.data||[]).filter(x=>x.name&&x.id===null).map(x=>x.name);renderGames()}
function renderGames(){const list=S.games.filter(x=>x.toLowerCase().includes(S.search));const status=document.getElementById("status"),el=document.getElementById("list");if(!status||!el)return;status.textContent=`${list.length} ${list.length===1?"game":"games"} found.`;el.innerHTML=list.map(n=>`<button class="game" data-game="${esc(n)}">${esc(n)}<small>Play in this window</small></button>`).join("");document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>openGame(b.dataset.game))}
function openGame(name){if(!SUPABASE_URL||SUPABASE_URL.startsWith("PASTE_")){S.output=["Supabase URL is not configured."];renderHome();return}const url=`${SUPABASE_URL.replace(/\/$/,"")}/storage/v1/object/public/${GAME_BUCKET}/${String(name).split("/").map(encodeURIComponent).join("/")}/index.html`;S.page="game";root.innerHTML=`<div class="gameHost"><div class="gameBar"><button class="back" id="back">← Back</button><span>${esc(name)}</span></div><iframe class="gameFrame" title="${esc(name)}" src="${esc(url)}" sandbox="allow-scripts allow-forms allow-pointer-lock allow-same-origin"></iframe></div>`;document.getElementById("back").onclick=games}
const EGG_CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-/\\[]{}()<>:;,.=+*#@$%&?!|~^";const eggLine=zero=>{const n=zero?256:16+Math.floor(Math.random()*241);let s="";for(let i=0;i<n;i++)s+=EGG_CHARS[Math.floor(Math.random()*EGG_CHARS.length)];return s};function egg(zero){S.page="egg";shell("Egg",`<div class="output egg" id="egg"></div>`,false);const el=document.getElementById("egg");const add=()=>{for(let i=0;i<12;i++)el.innerHTML+=esc(eggLine(zero))+"<br>";while(el.childElementCount>220)el.removeChild(el.firstChild)};for(let i=0;i<180;i++)el.innerHTML+=esc(eggLine(zero))+"<br>";eggTimer=setInterval(()=>{if(S.page!=="egg"){stopTimers();return}add();el.scrollTop=el.scrollHeight},45)}
const ETHO=["IT STARTED WITH A GIRL WHO COULD MAKE WINTER LISTEN.\n\nNEXT INPUT: /SWORD","THE BLADE DID NOT CUT THEM.\n\nNEXT INPUT: /1225","I REMEMBER THE NUMBER.\n\nNEXT INPUT: /LAKE","THE LAKE DOESN'T FREEZE WHEN SHE LOOKS AT IT.\n\nNEXT INPUT: /ECHO","THE ECHO IS NOT DESS.\n\nGO DEEPER: /DESS"];function etho(){S.page="etho";shell("ECHO TERMINAL",'<div class="output"><p>CONNECTION: UNSTABLE</p><p>TYPE /HELP TO BEGIN.</p><p>/GIRL</p></div>');document.getElementById("form").onsubmit=e=>{e.preventDefault();const v=document.getElementById("cmd").value.trim().toLowerCase();document.getElementById("cmd").value="";if(v==="/home")return renderHome();if(v==="/reset"){S.stage=0;return etho()}const cmds=["/girl","/sword","/1225","/lake","/echo"];if(v==="/help"){S.output=["/HELP","/GIRL","/SWORD","/1225","/LAKE","/ECHO","/DESS","/RESET","/HOME"];return ethoOut()}if(cmds[S.stage]===v){S.output=[ETHO[S.stage]];S.stage=Math.min(5,S.stage+1);return ethoOut()}if(v==="/dess"&&S.stage>=5)return dess();S.output=[`UNKNOWN COMMAND: ${v.toUpperCase()}`];ethoOut()}}
function ethoOut(){const out=document.querySelector(".output");out.innerHTML=S.output.map(x=>`<p>${esc(x)}</p>`).join("");out.scrollTop=out.scrollHeight}
function dess(){S.page="dess";shell("LAKE.EXE - SYSTEM ERROR",'<div class="output" id="errors"></div>',false);const e=document.getElementById("errors"),messages=["FATAL ERROR","MEMORY ACCESS VIOLATION","THE WATER IS LISTENING","UNKNOWN ERROR"];errorTimer=setInterval(()=>{if(S.page!=="dess"){stopTimers();return}for(let i=0;i<4;i++){const box=document.createElement("div");box.className="choice";box.innerHTML=`<b>${esc(messages[Math.floor(Math.random()*messages.length)])}</b><p>AN UNEXPECTED ERROR HAS OCCURRED.</p><button type="button">OK</button>`;box.querySelector("button").onclick=()=>box.remove();e.appendChild(box)}},120)}
function tetris(){S.page="tetris";const W=10,H=20;let board=Array.from({length:H},()=>Array(W).fill(0));let x=4,y=0;function draw(){shell("Tetris",`<div class="output"><div class="tetris">${board.flatMap(r=>r.map(c=>`<div class="cell ${c?"filled":""}"></div>`)).join("")}</div><p>Arrow keys move · Space drops · R restarts · /home returns home.</p></div>`);document.getElementById("form").onsubmit=e=>{e.preventDefault();renderHome()};document.onkeydown=e=>{if(S.page!=="tetris")return;if([" ","ArrowLeft","ArrowRight","ArrowDown","ArrowUp"].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft")x=Math.max(0,x-1);if(e.key==="ArrowRight")x=Math.min(W-1,x+1);if(e.key==="ArrowDown")y=Math.min(H-1,y+1);if(e.key===" ")y=H-1;if(e.key.toLowerCase()==="r"){board=Array.from({length:H},()=>Array(W).fill(0));x=4;y=0}draw()}}draw()}
renderHome();setupSupabase();
</script>
</body>
</html>
